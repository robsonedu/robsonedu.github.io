aw() {\n        if (!R) return;\n        c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, Wd, Ht);\n        c.save(); c.translate(cx, cy);\n        c.save(); c.beginPath(); c.arc(0, 0, R + 1, 0, TAU); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = R * 0.1; c.shadowOffsetY = R * 0.02; c.fillStyle = 'rgba(12,14,20,0.42)'; c.fill(); c.restore();\n        const sp = Math.abs(omega), steps = reduced() ? 1 : clampN(Math.round(sp / 4), 1, 6), spread = Math.min(0.32, sp * 0.016), dim = 1 - 0.62 * lift, s = cache.width / dpr;\n        for (let k = 0; k < steps; k++) { c.save(); c.rotate(rot - spread * k / steps); c.globalAlpha = dim / steps; c.drawImage(cache, -s / 2, -s / 2, s, s); c.restore(); }\n        if (win >= 0 && lift > 0.01) {\n          const mid = (win + 0.5) * span, off = lift * R * 0.045;\n          c.save(); c.rotate(rot); c.translate(Math.cos(mid - Math.PI / 2) * off, Math.sin(mid - Math.PI / 2) * off);\n          c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, win * span - Math.PI / 2, (win + 1) * span - Math.PI / 2); c.closePath();\n          const g = c.createRadialGradient(0, 0, R * 0.2, 0, 0, R);\n          g.addColorStop(0, `rgba(122,60,255,${0.55 * lift})`); g.addColorStop(0.6, `rgba(179,71,255,${0.9 * lift})`); g.addColorStop(1, `rgba(224,91,255,${0.95 * lift})`);\n          c.shadowColor = `rgba(190,90,255,${0.7 * lift})`; c.shadowBlur = 24 * lift; c.fillStyle = g; c.fill(); c.shadowBlur = 0;\n          c.strokeStyle = `rgba(255,255,255,${0.55 * lift})`; c.lineWidth = 1.2; c.stroke();\n          c.rotate(mid - Math.PI / 2);\n          const fs = Math.min(R * 0.078, span * R * 0.6 * 0.62) * 1.08;\n          c.font = `700 ${fs}px ${FONT}`; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = `rgba(255,255,255,${lift})`;\n          c.fillText(fitText(c, NAMES[win], R * 0.59), R * 0.86, 0);\n          c.restore();\n        }\n        c.save(); c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip();\n        const rg = c.createLinearGradient(0 t\">\n      <div class=\"idx\" id=\"idx\">01 / 05<\/div>\n      <h1 class=\"big\" id=\"big\">Wheel<\/h1>\n    <\/div>\n    <div class=\"right\">\n      <div class=\"verb\" id=\"verb\">Spin it<\/div>\n      <p class=\"desc\" id=\"desc\"><\/p>\n      <div class=\"thr\" role=\"group\" aria-label=\"Themes\"><small>Available in four themes<\/small><div class=\"row\"><button type=\"button\" data-theme=\"purple\" aria-pressed=\"false\"><span class=\"p\" style=\"background:linear-gradient(135deg,#120c2c,#6b4dff 60%,#5b9bff)\"><img alt=\"\" src=\"images/THUMBSelectrPlus.png\" onerror=\"this.remove()\"><\/span>Purple<\/button><button type=\"button\" data-theme=\"neon\" aria-pressed=\"true\"><span class=\"p\" style=\"background:linear-gradient(135deg,#0b0b0c,#a6ff2e 70%,#f2ff8a)\"><img alt=\"\" src=\"images/THUMBSelectrPlusNEON.png\" onerror=\"this.remove()\"><\/span>Neon<\/button><button type=\"button\" data-theme=\"blue\" aria-pressed=\"false\"><span class=\"p\" style=\"background:linear-gradient(135deg,#ffffff,#d9e4fb 45%,#3375f3)\"><img alt=\"\" src=\"images/THUMBSelectrPlusBlue.png\" onerror=\"this.remove()\"><\/span>Light Blue<\/button><button type=\"button\" data-theme=\"sketch\" aria-pressed=\"false\"><span class=\"p\" style=\"background:linear-gradient(135deg,#fbf5e6,#f6c652 50%,#ad97da)\"><img alt=\"\" src=\"images/THUMBSelectrPlusSKETCH.png\" onerror=\"this.remove()\"><\/span>Sketchbook<\/button><\/div><\/div>\n    <\/div>\n  <\/section>\n  <div class=\"hint\">Hover to preview <i><\/i> Click to open<\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" aria-live=\"polite\"><div><b id=\"toastName\"><\/b><span>In SELECTr, this opens the tool. This preview just shows the transition.<\/span><\/div><\/div>\n\n<script>\n(() => {\n  'use strict';\n  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const wait = ms => new Promise(r => setTimeout(r, ms));\n  const pick = a => a[Math.floor(Math.random() * a.length)];\n  const mod = (a, m) => ((a % m) + m) % m;\n  const $ = s => document.querySelector(s);\n\n  const TOOLS = [\n    { k: 'wheel', name: 'Wheel', verb: 'Spin it', desc: 'Spin to win.', tint: '#7c7f88' },\n    { k: 'drum', name: 'Drum', verb: 'Flip it', desc: 'A split-flap board that rolls through your options.', tint: '#6a6d75' },\n    { k: 'num', name: 'Numbers', verb: 'Locate it', desc: 'Select by team number, letter, or custom (desk number, question number, etc.)', tint: '#858891' },\n    { k: 'first', name: \"Who's First\", verb: 'Settle it', desc: 'Playful characteristics that decide who goes first.', tint: '#73767e' },\n    { k: 'colors', name: 'Colors', verb: 'Color it', desc: 'Two to six colors, one glowing pick.', tint: '#8e9199' }\n  ];\n\n  /* ---------- Tool previews: miniatures of the real SPINr screens ---------- */\n  const TAU = Math.PI * 2;\n  const FONT = \"Inter, -apple-system, 'Segoe UI', system-ui, sans-serif\";\n  const clampN = (v, a, b) => Math.max(a, Math.min(b, v));\n  const NAMES = ['Ava Thompson', 'Liam Nguyen', 'Sofia Ramirez', 'Noah Patel', 'Maya Johnson', 'Ethan Brooks', 'Zoe Kim', 'Lucas Carter', 'Isabella Reed', 'Mateo Garcia', 'Harper Lewis', 'Owen Price'];\n  const PROMPTS = ['Whoever woke up earliest today.', 'Whoever\u2019s birthday is coming up next.', 'Whoever has the most siblings.', 'Whoever has the shortest first name.', 'Whoever is the tallest.', 'Whoever has the most pets.'];\n  const COLS = [\n    { n: 'Red', hex: '#e03131', a: '#ff7a7a', c: '#ff3d7f', l: 'R' },\n    { n: 'Green', hex: '#2fb344', a: '#86eaa0', c: '#13b3a0', l: 'G' },\n    { n: 'Yellow', hex: '#e7da40', a: '#fff59a', c: '#ffb020', l: 'Y' },\n    { n: 'Blue', hex: '#1e66f5', a: '#7ab2ff', c: '#6b4dff', l: 'B' }\n  ];\n  const fitText = (c, t, maxW) => { if (c.measureText(t).width <= maxW) return t; while (t.length > 1 && c.measureText(t + '\u2026').width > maxW) t = t.slice(0, -1); return t + '\u2026'; };\n  const anim = (T, step) => new Promise(res => {\n    if (reduced()) { step(1); res( ES[i], maxW), R * 0.86, 0); cc.restore(); }\n        const pr = Math.max(1.6, R * 0.013);\n        cc.fillStyle = 'rgba(255,255,255,0.9)';\n        for (let i = 0; i < n; i++) { const a = i * span - Math.PI / 2; cc.beginPath(); cc.arc(Math.cos(a) * R * 0.955, Math.sin(a) * R * 0.955, pr, 0, TAU); cc.fill(); }\n      }\n      function size() {\n        Wd = host.clientWidth; Ht = host.clientHeight; if (!Wd || !Ht) return;\n        dpr = Math.min(2, devicePixelRatio || 1);\n        cv.width = Math.round(Wd * dpr); cv.height = Math.round(Ht * dpr);\n        R = Math.min(Wd * 0.86, Ht * 0.9); cx = Wd / 2; cy = R + Math.max(12, R * 0.12);\n        renderCache(); draw();\n      }\n      function draw() {\n        if (!R) return;\n        c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, Wd, Ht);\n        c.save(); c.translate(cx, cy);\n        c.save(); c.beginPath(); c.arc(0, 0, R + 1, 0, TAU); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = R * 0.1; c.shadowOffsetY = R * 0.02; c.fillStyle = 'rgba(12,14,20,0.42)'; c.fill(); c.restore();\n        const sp = Math.abs(omega), steps = reduced() ? 1 : clampN(Math.round(sp / 4), 1, 6), spread = Math.min(0.32, sp * 0.016), dim = 1 - 0.62 * lift, s = cache.width / dpr;\n        for (let k = 0; k < steps; k++) { c.save(); c.rotate(rot - spread * k / steps); c.globalAlpha = dim / steps; c.drawImage(cache, -s / 2, -s / 2, s, s); c.restore(); }\n        if (win >= 0 && lift > 0.01) {\n          const mid = (win + 0.5) * span, off = lift * R * 0.045;\n          c.save(); c.rotate(rot); c.translate(Math.cos(mid - Math.PI / 2) * off, Math.sin(mid - Math.PI / 2) * off);\n          c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, win * span - Math.PI / 2, (win + 1) * span - Math.PI / 2); c.closePath();\n          const g = c.createRadialGradient(0, 0, R * 0.2, 0, 0, R);\n          g.addColorStop(0, `rgba(200,245,20,${0.85 * lift})`); g.addColorStop(0.6, `rgba(222,255,40,${0.95 * lift})`); g.addColorStop(1, `rgba(240,255,100,${lift})`);\n          c.shadowColor = `rgba(220,255,50,${0.7 * lift})`; c.shadowBlur = 24 * lift; c.fillStyle = g; c.fill(); c.shadowBlur = 0;\n          c.strokeStyle = `rgba(255,255,255,${0.55 * lift})`; c.lineWidth = 1.2; c.stroke();\n          c.rotate(mid - Math.PI / 2);\n          const fs = Math.min(R * 0.078, span * R * 0.6 * 0.62) * 1.08;\n          c.font = `700 ${fs}px ${FONT}`; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = `rgba(13,20,0,${lift})`;\n          c.fillText(fitText(c, NAMES[win], R * 0.59), R * 0.86, 0);\n          c.restore();\n        }\n        c.save(); c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip();\n        const rg = c.createLinearGradient(0, -R, 0, R * 0.05); rg.addColorStop(0, 'rgba(255,255,255,0.15)'); rg.addColorStop(1, 'rgba(255,255,255,0)');\n        c.fillStyle = rg; c.beginPath(); c.ellipse(0, -R * 0.45, R * 0.95, R * 0.62, 0, 0, TAU); c.fill(); c.restore();\n        c.beginPath(); c.arc(0, 0, R, 0, TAU); c.strokeStyle = 'rgba(255,255,255,0.34)'; c.lineWidth = 1.2; c.stroke();\n        const flair = reduced() ? 0 : clampN(sp / 14, 0, 1);\n        if (flair > 0.01 && c.createConicGradient) {\n          const cg = c.createConicGradient(rot * 0.6 + phase, 0, 0);\n          [['#f2ff9a', 0], ['#d4ff3a', 0.25], ['#8cff3a', 0.5], ['#39f27a', 0.75], ['#f2ff9a', 1]].forEach(([col, st]) => cg.addColorStop(st, col));\n          c.save(); c.globalAlpha = flair; c.shadowColor = 'rgba(225,255,70,0.9)'; c.shadowBlur = R * 0.05;\n          c.beginPath(); c.arc(0, 0, R + R * 0.014, 0, TAU); c.strokeStyle = cg; c.lineWidth = R * 0.03; c.stroke(); c.restore();\n        }\n        const h = R * 0.2;\n        c.save(); c.beginPath(); c.arc(0, 0, h, 0, TAU);\n        const hg = c.createLinearGradient(0, -h, 0, h); hg.addColorStop(0, 'rgba(40,45,57,0.96)'); hg.addColorStop(1, 'rgba(16,18,24,0.97)');\n        c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = h * 0.5; c.fillStyle = hg; c.fill(); c.shadowBlur = 0;\n        c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = 1; c.stroke();\n        if (!sp) { c.fillStyle = 'rgba(246,248,252,0.92)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `700 ${h * 0.3}px ${FONT}`; c.fillText('SPIN', 0, h * 0.02); }\n        c.restore();\n        const w = R * 0.05, L = R * 0.17 + 4;\n        c.save(); c.translate(0, -R - 3);\n        c.beginPath(); c.moveTo(-w, 0); c.quadraticCurveTo(-w, -w * 1.15, 0, -w * 1.15); c.quadraticCurveTo(w, -w * 1.15, w, 0);\n        c.lineTo(w * 0.2, L); c.quadraticCurveTo(0, L + w * 0.35, -w * 0.2, L); c.closePath();\n        c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 6; c.shadowOffsetY = 2; c.fillStyle = '#c4ff36'; c.fill(); c.shadowBlur = 0; c.shadowOffsetY = 0;\n        c.beginPath(); c.arc(0, -w * 0.25, w * 0.34, 0, TAU); c.fillStyle = '#000000'; c.fill();\n        c.restore();\n        c.restore();\n      }\n      new ResizeObserver(size).observe(host);\n      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (R) { renderCache(); draw(); } });\n      return async () => {\n        const j = Math.floor(Math.random() * n);\n        const start = rot, target = -(j + 0.2 + Math.random() * 0.6) * span;\n        const D = mod(target - start, TAU) + 3 * TAU, T = 3300;\n        const lift0 = lift; let prev = rot, last = performance.now();\n        await anim(T, (u, now) => {\n          const k = 1 - u; rot = start + D * (1 - k * k * k);\n          const dt = Math.max(0.001, ((now || performance.now()) - last) / 1000); omega = (rot - prev) / dt; prev = rot; last = now || performance.now();\n          phase += dt * 1.4; lift = Math.max(0, lift0 * (1 - u * 5)); if (lift === 0) win = -1;\n          draw();\n        });\n        omega = 0; win = j;\n        await anim(420, u => { lift = u; draw(); });\n        await wait(1700);\n      };\n    },\n    /* Drum: the split-flap board */\n    drum(host) {\n      host.innerHTML = '<div class=\"wf\"><div class=\"p n2\"><span><\/span><\/div><div nter, -apple-system, 'Segoe UI', system-ui, sans-serif\";\n  const clampN = (v, a, b) => Math.max(a, Math.min(b, v));\n  const NAMES = ['Ava Thompson', 'Liam Nguyen', 'Sofia Ramirez', 'Noah Patel', 'Maya Johnson', 'Ethan Brooks', 'Zoe Kim', 'Lucas Carter', 'Isabella Reed', 'Mateo Garcia', 'Harper Lewis', 'Owen Price'];\n  const PROMPTS = ['Whoever woke up earliest today.', 'Whoever\u2019s birthday is coming up next.', 'Whoever has the most siblings.', 'Whoever has the shortest first name.', 'Whoever is the tallest.', 'Whoever has the most pets.'];\n  const COLS = [\n    { n: 'Red', hex: '#e03131', a: '#ff7a7a', c: '#ff3d7f', l: 'R' },\n    { n: 'Green', hex: '#2fb344', a: '#86eaa0', c: '#13b3a0', l: 'G' },\n    { n: 'Yellow', hex: '#e7da40', a: '#fff59a', c: '#ffb020', l: 'Y' },\n    { n: 'Blue', hex: '#1e66f5', a: '#7ab2ff', c: '#6b4dff', l: 'B' }\n  ];\n  const fitText = (c, t, maxW) => { if (c.measureText(t).width <= maxW) return t; while (t.length > 1 && c.measureText(t + '\u2026').width > maxW) t = t.slice(0, -1); return t + '\u2026'; };\n  const anim = (T, step) => new Promise(res => {\n    if (reduced()) { step(1); res(); return; }\n    const t0 = performance.now();\n    const f = now => { const u = Math.min(1, (now - t0) / T); step(u, now); if (u < 1) requestAnimationFrame(f); else res(); };\n    requestAnimationFrame(f);\n  });\n  const tickClass = el => { el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); };\n\n  const W = {\n    /* Wheel: the real wheel's look, drawn on canvas with names, pegs, pointer and the tennis-ball yellow winner */\n    wheel(host) {\n      host.innerHTML = '<canvas><\/canvas>';\n      const cv = host.firstChild, c = cv.getContext('2d');\n      const cache = document.createElement('canvas'), cc = cache.getContext('2d');\n      const n = NAMES.length, span = TAU / n;\n      let rot = -0.5 * span, omega = 0, lift = 0, win = -1, phase = 0, Wd = 0, Ht = 0, dpr = 1, R = 0, cx = 0, cy = 0;\n      function renderC inPath(); c.arc(0, 0, R + 1, 0, TAU); c.shadowColor = 'rgba(15,23,42,0.15)'; c.shadowBlur = R * 0.1; c.shadowOffsetY = R * 0.02; c.fillStyle = 'rgba(255,255,255,0.72)'; c.fill(); c.restore();\n        const sp = Math.abs(omega), steps = reduced() ? 1 : clampN(Math.round(sp / 4), 1, 6), spread = Math.min(0.32, sp * 0.016), dim = 1 - 0.62 * lift, s = cache.width / dpr;\n        for (let k = 0; k < steps; k++) { c.save(); c.rotate(rot - spread * k / steps); c.globalAlpha = dim / steps; c.drawImage(cache, -s / 2, -s / 2, s, s); c.restore(); }\n        if (win >= 0 && lift > 0.01) {\n          const mid = (win + 0.5) * span, off = lift * R * 0.045;\n          c.save(); c.rotate(rot); c.translate(Math.cos(mid - Math.PI / 2) * off, Math.sin(mid - Math.PI / 2) * off);\n          c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, win * span - Math.PI / 2, (win + 1) * span - Math.PI / 2); c.closePath();\n          const g = c.createRadialGradient(0, 0, R * 0.2, 0, 0, R);\n          g.addColorStop(0, `rgba(36,89,214,${lift})`); g.addColorStop(0.34, `rgba(42,102,228,${lift})`); g.addColorStop(0.62, `rgba(51,117,243,${lift})`); g.addColorStop(1, `rgba(74,134,247,${lift})`);\n          c.shadowColor = `rgba(36,89,214,${0.7 * lift})`; c.shadowBlur = 8 * lift; c.fillStyle = g; c.fill(); c.shadowBlur = 0;\n          c.strokeStyle = `rgba(17,24,39,${0.55 * lift})`; c.lineWidth = 1.2; c.stroke();\n          c.rotate(mid - Math.PI / 2);\n          const fs = Math.min(R * 0.078, span * R * 0.6 * 0.62) * 1.08;\n          c.font = `700 ${fs}px ${FONT}`; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = `rgba(255,255,255,${lift})`;\n          c.fillText(fitText(c, NAMES[win], R * 0.59), R * 0.86, 0);\n          c.restore();\n        }\n        c.save(); c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip();\n        const rg = c.createLinearGradient(0, -R, 0, R * 0.05); rg.addColorStop(0, 'rgba(17,24,39,0)'); rg.addColorStop(1, 'rgba(17,24,39,0)');\n        c.fillStyle = rg; c.beginPath lue<\/button><button type=\"button\" data-theme=\"sketch\" aria-pressed=\"true\"><span class=\"p\" style=\"background:linear-gradient(135deg,#fbf5e6,#f6c652 50%,#ad97da)\"><img alt=\"\" src=\"images/THUMBSelectrPlusSKETCH.png\" onerror=\"this.remove()\"><\/span>Sketchbook<\/button><\/div><\/div>\n    <\/div>\n  <\/section>\n  <div class=\"hint\">Hover to peek <i><\/i> Click to open<\/div>\n<\/div>\n\n<script>\n(() => {\n  'use strict';\n  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const wait = ms => new Promise(r => setTimeout(r, ms));\n  const mod = (a, m) => ((a % m) + m) % m;\n  const $ = s => document.querySelector(s);\n\n  // Add the wash and two pencil outlines to every sketch element\n  document.querySelectorAll('.sk').forEach((el, i) => {\n    const w = document.createElement('i'); w.className = 'wash'; w.setAttribute('aria-hidden', 'true'); w.style.filter = `url(#wc${i % 3 + 1})`;\n    const a = document.createElement('i'); a.className = 'ln'; a.setAttribute('aria-hidden', 'true'); a.style.filter = `url(#pn${i % 2 + 1})`;\n    const b = document.createElement('i'); b.className = 'ln ln2'; b.setAttribute('aria-hidden', 'true'); b.style.filter = `url(#pn${(i + 1) % 2 + 1})`;\n    el.prepend(w); el.append(a, b);\n  });\n\n  const TOOLS = [\n    { k: 'wheel', name: 'Wheel', verb: 'Spin it', desc: 'Spin to win.', c: 'var(--sky)' },\n    { k: 'drum', name: 'Drum', verb: 'Flip it', desc: 'A split-flap board that rolls through your options.', c: 'var(--sun)' },\n    { k: 'num', name: 'Numbers', verb: 'Locate it', desc: 'Select by team number, letter, or custom (desk number, question number, etc.)', c: 'var(--leaf)' },\n    { k: 'first', name: \"Who's First\", verb: 'Settle it', desc: 'Playful characteristics that decide who goes first.', c: 'var(--lilac)' },\n    { k: 'colors', name: 'Colors', verb: 'Color it', desc: 'Two to six colors, one gets picked.', c: 'var(--coral)' }\n  ];\n  const REST = { verb: 'Pick a tool', desc: 'F sEl.classList.toggle('has-live', i >= 0);\n    if (i >= 0) { tiles[i].b.classList.add('live'); tiles[i].start(); }\n    if (i !== current) { current = i; setLabels(i, true); }\n  }\n  tiles.forEach((t, i) => {\n    t.b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') setLive(i); });\n    t.b.addEventListener('focus', () => setLive(i));\n    t.b.addEventListener('click', () => open(i));\n  });\n  tilesEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !tilesEl.contains(document.activeElement)) setLive(-1); });\n  tilesEl.addEventListener('focusout', e => { if (!tilesEl.contains(e.relatedTarget)) setLive(-1); });\n\n  /* ---------- Labels ---------- */\n  const big = $('#big'), verb = $('#verb'), desc = $('#desc'), idx = $('#idx');\n  function fitBig() {\n    big.style.fontSize = '';\n    const max = big.parentElement.clientWidth;\n    let fs = parseFloat(getComputedStyle(big).fontSize);\n    while (big.offsetWidth > max && fs > 36) { fs -= 4; big.style.fontSize = fs + 'px'; }\n  }\n  let labelTimer;\n  // At rest the hero shows the app name; hovering a tile swaps in that tool\n  function setLabels(i, animate) {\n    const T = i < 0 ? REST : TOOLS[i];\n    const apply = () => {\n      if (i < 0) big.innerHTML = 'SELECT<sup>r<\/sup>'; else big.textContent = T.name;\n      verb.textContent = T.verb; desc.textContent = T.desc;\n      idx.textContent = i < 0 ? 'Five tools \u2013 Everyone answers' : `0${i + 1} / 05`;\n      big.style.setProperty('--tc', T.c);\n      fitBig();\n      if (animate && !reduced()) [big, verb, desc].forEach(el => { el.classList.remove('swap-out'); el.classList.add('swap-in'); });\n    };\n    clearTimeout(labelTimer);\n    if (animate && !reduced()) { [big, verb, desc].forEach(el => { el.classList.remove('swap-in'); el.classList.add('swap-out'); }); labelTimer = setTimeout(apply, 170); }\n    else apply();\n  }\n  addEventListener('resize', fitBig);\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBig);\n\n  /* ---------- Keyboard ---------- */\n  addEventListener('keydown', e => {\n    if (opening || e.metaKey || e.ctrlKey || e.altKey) return;\n    if (/^[1-5]$/.test(e.key)) { e.preventDefault(); open(+e.key - 1); return; }\n    const onTile = document.activeElement && document.activeElement.classList.contains('tile');\n    const at = Math.max(0, tiles.findIndex(t => t.b === document.activeElement));\n    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); tiles[onTile ? mod(at + 1, 5) : Math.max(0, current)].b.focus(); }\n    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); tiles[onTile ? mod(at - 1, 5) : Math.max(0, current)].b.focus(); }\n  });\n\n  /* ---------- Open the tool ---------- */\n  let opening = false;\n  async function open(i) {\n    if (opening) return;\n    opening = true;\n    if (current !== i) { current = i; setLabels(i, false); }\n    tiles.forEach((t, k) => t.b.classList.toggle('opening-tile', k === i));\n    document.body.classList.add('opening');\n    await wait(reduced() ? 50 : 480);\n    const tool = TOOLS[i].k === 'num' ? 'numbers' : TOOLS[i].k;\n    location.href = 'SelectorsPlus.html?tool=' + tool;\n  }\n\n  setLabels(-1, false);\n})();\n<\/script>\n<script>\n(function () {\n  var row = document.querySelector('.thr'); if (!row) return;\n  row.addEventListener('click', function (e) {\n    var b = e.target.closest('button[data-theme]'); if (!b || b.getAttribute('aria-pressed') === 'true') return;\n    row.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });\n    window.__SEL.set(b.getAttribute('data-theme'));\n  });\n})();\n<\/script>\n"
