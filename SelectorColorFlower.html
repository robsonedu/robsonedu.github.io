<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Color Selector</title>
<link rel="icon" type="image/png" href="images/FaviconCircleR.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

  body {
    margin: 0;
    min-height: 100vh;
    background-color: black;
    background-image: url('images/Purpleflower.jpg');
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    background-size: cover;
    font-family: 'Inter', sans-serif;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,0.7);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    /* Needed so that the overlay sits behind content */
    position: relative;
    z-index: 1;
  }

  /* ⭐ Background dim overlay (Option 1) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25); /* <-- adjust dim level */
    z-index: 0;
  }

  .main-content {
    padding-top: 20px;
    position: relative;
    z-index: 1; /* ensure content stays above overlay */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    text-align: center;
  }

  h2 {
    font-size: 2.5rem;
    margin-bottom: 20px;
  }

  /* Color Circles */
  .color-display {
    display: flex;
    gap: 30px;
    margin-bottom: 30px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .color-chip {
    width: 98px;
    height: 98px;
    border-radius: 50%;
    font-size: 2.3rem;
    font-weight: 700;
    box-shadow: 0 0 16px rgba(0,0,0,0.55);
    display: grid;
    place-items: center;
    transition: opacity 0.3s, transform 0.15s, box-shadow 0.25s;
    cursor: pointer;
    border: 4px solid rgba(255,255,255,0.4);
    opacity: 1;
    user-select: none;
  }
  .color-chip.selected {
    transform: scale(1.17);
    box-shadow: 0 0 32px #fff;
    border-color: #fff;
    z-index: 2;
  }
  .color-chip.dim {
    opacity: 0.33;
  }

  .color-chip.red    { background: #e03131; color: #fff; }
  .color-chip.green  { background: #2fb344; color: #fff; }
  .color-chip.yellow { background: #e7da40; color: #ffffff; }
  .color-chip.blue   { background: #1e66f5; color: #fff; }
  .color-chip.purple { background: #8b30e0; color: #fff; }

  /* GO Button */
  .go-button-row {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }
  .go-button {
    padding: 25px;
    font-size: 2rem;
    font-weight: 700;
    border: 2px solid rgba(255, 255, 255, 0.6);
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, transform 0.2s;
    backdrop-filter: blur(5px);
    color: #fff;
    text-transform: uppercase;
    width: 120px;
    height: 120px;
  }
  .go-button:hover {
    background: rgba(255,255,255,0.4);
    color: #000;
    transform: scale(1.05);
  }
  .go-button:active {
    transform: scale(0.97);
  }

  /* No Repeat + Reset */
  .secondary-controls-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
  }
  .switch-container {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: 0.4s;
    border-radius: 50px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 26px; width: 26px;
    border-radius: 50px;
    left: 4px; bottom: 4px;
    background-color: white;
    transition: 0.4s;
  }
  input:checked + .slider { background-color: #4CAF50; }
  input:checked + .slider:before { transform: translateX(26px); }

  .reset-number-history {
    padding: 12px 24px;
    font-size: 1.5rem;
    font-weight: 700;
    border: 2px solid rgba(255, 255, 255, 0.6);
    background: transparent;
    border-radius: 15px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, transform 0.2s;
    backdrop-filter: blur(5px);
    color: #fff;
    text-transform: uppercase;
    display: block;
    margin: 0 auto;
    width: auto;
    max-width: 220px;
  }

  /* Logo */
  .logo-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 96px;
    padding: 20px;
    z-index: 2; /* above overlay */
  }
  .logo-img {
    height: 56px;
  }
</style>
</head>

<body>
  <header class="logo-header">
    <a href="PageSelectors.html">
      <img src="images/SELECTr%20WH%20logo.png" alt="Logo" class="logo-img">
    </a>
  </header>

  <div class="main-content">
    <h2>Color Selector</h2>

    <div class="color-display" id="colorDisplay">
      <div class="color-chip red"    data-color="red">R</div>
      <div class="color-chip green"  data-color="green">G</div>
      <div class="color-chip yellow" data-color="yellow">Y</div>
      <div class="color-chip blue"   data-color="blue">B</div>
      <div class="color-chip purple" data-color="purple">P</div>
    </div>

    <div class="go-button-row">
      <button class="go-button" onclick="selectRandomColor()">GO!</button>
    </div>

    <div class="secondary-controls-row">
      <div class="switch-container">
        <label for="noRepeatSwitch">No Repeat</label>
        <label class="switch">
          <input type="checkbox" id="noRepeatSwitch" onclick="toggleNoRepeat()" checked>
          <span class="slider"></span>
        </label>
      </div>
      <button class="reset-number-history" onclick="resetHistory()">Reset</button>
    </div>
  </div>

  <audio id="tickingSound" src="audio/ticking.mp3" preload="auto"></audio>
  <audio id="dingSound" src="audio/ding.mp3" preload="auto"></audio>

  <script>
    const colors = ["red", "green", "yellow", "blue", "purple"];

    let selectedColors = [];
    let noRepeat = true;

    function toggleNoRepeat() {
      noRepeat = document.getElementById("noRepeatSwitch").checked;
    }

    function selectRandomColor() {
      const colorChips = document.querySelectorAll(".color-chip");
      const ding = document.getElementById("dingSound");
      const tick = document.getElementById("tickingSound");

      ding.pause();
      ding.currentTime = 0;

      let availableColors = colors.filter(c => !selectedColors.includes(c) || !noRepeat);
      if (availableColors.length === 0) {
        resetHistory();
        availableColors = [...colors];
      }

      let counter = 0;
      let chosenColor;

      const cyclingEffect = setInterval(() => {
        const randomColor = availableColors[Math.floor(Math.random() * availableColors.length)];

        colorChips.forEach(chip => {
          chip.classList.toggle('dim', chip.dataset.color !== randomColor);
          chip.classList.remove("selected");
        });

        tick.play();
        counter++;

        if (counter >= 15) {
          clearInterval(cyclingEffect);
          chosenColor = randomColor;
          selectedColors.push(chosenColor);

          colorChips.forEach(chip => {
            chip.classList.remove("selected", "dim");
            if (chip.dataset.color === chosenColor) chip.classList.add("selected");
          });

          tick.pause();
          tick.currentTime = 0;
          ding.play();
        }
      }, 100);
    }

    function resetHistory() {
      selectedColors = [];
      document.querySelectorAll(".color-chip").forEach(c => {
        c.classList.remove("selected", "dim");
      });
    }
  </script>
</body>
</html>
