<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timer Plus</title>
<link rel="icon" type="image/png" href="images/FaviconCircleR.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Slackey&family=Henny+Penny&family=Bangers&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   THEME VARIABLES — every value here is overwritten by applyTheme().
   Defaults match TimerRoad.html.
   ===================================================================== */
:root{
  --text:#fff;
  --body-shadow:0 0 8px rgba(0,0,0,0.7);
  --timer-shadow:0 0 8px rgba(0,0,0,0.7);
  --glow1:#fff; --glow2:#fff; --glow-op:0.7;
  --btn-border:rgba(255,255,255,0.6);
  --btn-color:#fff;
  --btn-hover-bg:rgba(255,255,255,0.4);
  --btn-hover-color:#000;
  --btn-blur:5px;
  --btn-shadow:0 0 8px rgba(0,0,0,0.7);
  --input-bg:rgba(255,255,255,0.9);
  --input-color:#000;
  --input-border:1px solid #ccc;
  --placeholder:#333;
  --music:#fff; --music-hover:#ccc;
  --accent:#00cdff;
  --ring:#fff;
  --font:'Inter',sans-serif;
  --timer-weight:700;
  --overlay:0.4;
  --presets-top:25px;
}

*{box-sizing:border-box;}
html,body{margin:0;}
body{
  min-height:100vh;
  background:#000;
  font-family:var(--font);
  color:var(--text);
  text-shadow:var(--body-shadow);
  font-size:1.5rem;
  font-weight:700;
  overflow-x:hidden;
}

/* ---------- Backgrounds (image, video, overlay) ---------- */
#bgImg,#bgVid,#bgOverlay{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;}
#bgImg{z-index:0;background-color:#000;overflow:hidden;}
/* The background picture is a real image element (object-fit: cover), which every browser and preview shows */
#bgPh{position:absolute;inset:-60px;background:center/cover no-repeat;filter:blur(28px);transform:scale(1.04);}
#bgPic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transition:opacity .45s ease;}
#bgPic.loading,#bgVid.loading{opacity:0;transition:none;}
#bgPic[hidden]{display:none;}
#bgVid{z-index:0;object-fit:cover;display:none;transition:opacity .45s ease;}
#bgOverlay{z-index:0;background:rgba(0,0,0,var(--overlay));}

/* ---------- Logo ---------- */
.logo-bar{position:fixed;top:20px;left:20px;display:flex;align-items:center;z-index:50;pointer-events:none;}
.logo-bar img,.logo-bar a{pointer-events:auto;}
#extraLogo{height:160px;width:auto;margin-right:18px;display:none;}
/* TIMEr PLUS logo: a vector, white or black to match the theme */
.logo-link{display:block;color:var(--logo-color,#fff);filter:var(--logo-shadow,drop-shadow(0 2px 8px rgba(0,0,0,.55)));border-radius:6px;}
.logo-link:focus-visible{outline:2px solid var(--dock-accent);outline-offset:4px;}
#logoSvg{display:block;height:44px;width:auto;}
@media (max-width:870px){ #logoSvg{height:34px;} }
.logo-bar a{text-decoration:none;}

/* ---------- TOOLS: one corner button (top right) that opens either
   a VERTICAL DOCK (hover or click) or a TOOLS PANEL (click), chosen in either menu.
   The chrome stays neutral glass so it reads on every theme. ---------- */
:root{--dock-line:rgba(255,255,255,.14);--dock-muted:rgba(232,237,247,.68);--dock-accent:#fff;--ease:cubic-bezier(.2,.8,.2,1);}
.chrome{transition:opacity .4s ease;}
.vdock svg,.corner-btn svg,.seg svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}

.corner-btn{
  position:fixed;top:20px;right:20px;z-index:46;display:grid;place-items:center;width:48px;height:48px;padding:0;
  border-radius:16px;border:1px solid var(--dock-line);background:rgba(16,16,18,.5);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  color:#f3f5f9;cursor:pointer;opacity:.6;transition:opacity .3s,background .2s;
}
.corner-btn:hover,.corner-btn.active,.corner-btn:focus-visible{opacity:1;background:rgba(16,16,18,.75);}
.corner-btn svg{width:22px;height:22px;}
.corner-btn .live-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:#2fb344;box-shadow:0 0 6px #2fb344;display:none;}
.corner-btn.has-live .live-dot{display:block;}

/* Vertical dock. Tools view by default; Themes takes over the dock at double width. */
.vdock{
  position:fixed;top:80px;right:20px;z-index:45;width:94px;display:flex;flex-direction:column;padding:7px;border-radius:22px;
  background:rgba(16,16,18,.62);border:1px solid var(--dock-line);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none;
  transition:transform .45s var(--ease),opacity .3s ease,width .35s var(--ease);font-family:'Inter',sans-serif;text-shadow:none;color:#f3f5f9;
}
.vdock.themes{width:196px;}
.vdock.open{transform:none;opacity:1;pointer-events:auto;}
.vcol{display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 114px);overflow-y:auto;scrollbar-width:none;}
.vcol::-webkit-scrollbar,.tgrid::-webkit-scrollbar{display:none;}

/* Themes view — replaces the tools, two thumbnails across */
.vdock.themes .vcol{display:none;}
.tcol{display:none;flex-direction:column;gap:8px;max-height:min(640px,calc(100vh - 114px));}
.vdock.themes .tcol{display:flex;animation:tIn .3s var(--ease);}
@keyframes tIn{from{opacity:0;transform:translateX(8px);}to{opacity:1;transform:none;}}
.tcol-head{display:flex;align-items:center;gap:6px;padding:2px 2px 0;}
.tcol-head b{font:700 14px 'Inter',sans-serif;}
.tback{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:10px;background:rgba(255,255,255,.07);color:#f3f5f9;cursor:pointer;}
.tback:hover{background:rgba(255,255,255,.14);}
.tback svg{width:18px;height:18px;}
.tcats{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--dock-line);}
.tcats button{flex:1;height:28px;padding:0;border-radius:9px;border:1.5px solid transparent;background:transparent;color:var(--dock-muted);font:600 11px 'Inter',sans-serif;cursor:pointer;}
.tcats button:hover{color:#fff;}
.tcats button[aria-selected="true"]{color:#fff;background:#0b0b0c;border-color:var(--dock-accent);}
.tgrid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;align-content:start;padding:2px 2px 6px;}
.vbtn{
  position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;
  border:1.5px solid transparent;background:transparent;color:var(--dock-muted);font:600 11px 'Inter',sans-serif;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.vbtn:hover{background:rgba(255,255,255,.1);color:#fff;}
.vbtn[aria-pressed="true"]{color:#fff;background:#0b0b0c;border-color:var(--dock-accent);}
.vbtn svg{width:22px;height:22px;}
.vsep{flex:none;height:1px;background:var(--dock-line);margin:4px 8px;}
.vgrid{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.vicon{height:38px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:#f3f5f9;cursor:pointer;}
.vicon:hover{background:rgba(255,255,255,.12);}
.vicon[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--dock-accent);}
.vicon svg{width:20px;height:20px;}
.js-mode.live::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#2fb344;box-shadow:0 0 6px #2fb344;}

/* Segmented control (theme groups, timer types in the panel, menu style) */
.seg{display:flex;padding:3px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--dock-line);}
.seg button{
  position:relative;white-space:nowrap;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1.5px solid transparent;border-radius:11px;background:transparent;font:600 14px 'Inter',sans-serif;
  color:var(--dock-muted);cursor:pointer;transition:background .25s,color .25s,border-color .25s;
}
.seg button:hover{color:#fff;}
.seg button svg{width:18px;height:18px;}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{color:#fff;background:#0b0b0c;border-color:var(--dock-accent);}

/* Tools panel (same sheet as Themes) */


body.idle .chrome{opacity:0 !important;pointer-events:none !important;}
/* ---------- Guided walkthrough (first visit, or the tour button in the dock) ---------- */
#tour{position:fixed;inset:0;z-index:120;display:none;}
#tour.on{display:block;}
.tour-block{position:absolute;inset:0;}
.tour-spot{
  position:absolute;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 0 2px var(--dock-accent),0 0 24px 4px color-mix(in srgb,var(--dock-accent) 55%,transparent);
  transition:top .35s var(--ease),left .35s var(--ease),width .35s var(--ease),height .35s var(--ease);
}
/* During the tour the dock appears in place, so the highlight lands on it immediately */
body.touring .vdock,body.touring .vdock *,body.touring .corner-btn{transition:none !important;animation:none !important;}
.tour-spot.jump,.tour-tip.jump{transition:none;}
.tour-tip{
  position:absolute;width:min(300px,calc(100vw - 32px));padding:16px 16px 12px;border-radius:18px;
  background:rgba(22,22,24,.96);border:1px solid var(--dock-line);box-shadow:0 20px 60px rgba(0,0,0,.55);
  font-family:'Inter',sans-serif;color:#f3f5f9;text-shadow:none;
  transition:top .35s var(--ease),left .35s var(--ease),opacity .2s ease;
}
.tour-tip h4{margin:0 0 6px;font:700 16px 'Inter',sans-serif;}
.tour-tip p{margin:0;font:400 14px/1.5 'Inter',sans-serif;color:rgba(243,245,249,.82);}
.tour-foot{display:flex;align-items:center;gap:8px;margin-top:14px;}
.tour-count{flex:1;font:600 12px 'Inter',sans-serif;color:var(--dock-muted);font-variant-numeric:tabular-nums;}
.tour-foot button{border:0;border-radius:10px;font:600 13.5px 'Inter',sans-serif;padding:8px 14px;cursor:pointer;}
#tourSkip{background:transparent;color:var(--dock-muted);padding:8px 6px;}
#tourSkip:hover{color:#fff;}
#tourBack{background:rgba(255,255,255,.1);color:#fff;}
#tourBack[hidden]{display:none;}
#tourNext{background:var(--dock-accent);color:#111;}
.tour-foot button:focus-visible{outline:2px solid #fff;outline-offset:2px;}
/* Background preview: drop an image or video on the page */
body.dropping::after{
  content:"Drop to preview this as the background";position:fixed;inset:14px;z-index:300;display:grid;place-items:center;
  border:3px dashed rgba(255,255,255,.75);border-radius:24px;background:rgba(0,0,0,.4);
  font:700 1.4rem 'Inter',sans-serif;color:#fff;text-shadow:none;pointer-events:none;
}
.toast{
  position:fixed;left:50%;bottom:24px;z-index:300;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:12px 18px;border-radius:14px;background:rgba(16,16,18,.85);border:1px solid var(--dock-line);
  font:600 14px 'Inter',sans-serif;color:#f3f5f9;text-shadow:none;transition:opacity .3s,transform .3s var(--ease);max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0);}
body.idle{cursor:none;}

/* ---------- Stage + panes ---------- */
#stage{
  position:relative;z-index:1;min-height:100vh;
  padding:90px 16px 60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.pane{display:none;flex-direction:column;align-items:center;width:100%;}
.pane.active{display:flex;}

/* ---------- Shared timer digits (from the standard timer) ---------- */
.timer{
  font-size:7.5rem;font-weight:var(--timer-weight);text-shadow:var(--timer-shadow);
  transition:transform .3s ease,text-shadow .4s ease;line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.timer.running{transform:scale(1.1);}
.timer.glow{animation:glowPulse 2s infinite ease-in-out;}
@keyframes glowPulse{
  0%,100%{text-shadow:0 0 10px var(--glow1),0 0 20px var(--glow2);opacity:1;}
  50%{text-shadow:0 0 30px var(--glow1),0 0 60px var(--glow2);opacity:var(--glow-op);}
}

/* ---------- Shared themed buttons + inputs ---------- */
.row{margin-top:25px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:center;}
.btn{
  padding:15px 35px;font-size:1.5rem;font-weight:700;font-family:var(--font);
  border:2px solid var(--btn-border);background:transparent;color:var(--btn-color);
  border-radius:30px;cursor:pointer;text-shadow:var(--btn-shadow);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px); /* set per theme by applyTheme() */
  transition:background .3s,color .3s,transform .2s;
}
.btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-color);transform:scale(1.05);}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.5;cursor:default;transform:none;}
.btn.icon{font-family:'Inter',sans-serif;font-size:1.275rem;}
.btn.icon[data-act="reset"]{font-family:var(--font);}
.btn.round{width:80px;height:80px;border-radius:50%;padding:0;font-size:1.3rem;}
.btn.sm{padding:8px 18px;font-size:1rem;border-radius:24px;}
.btn.sm.round{width:56px;height:56px;padding:0;border-radius:50%;}
.presets{margin-top:var(--presets-top);}
.tinput{
  width:110px;padding:10px;font-size:1.5rem;font-weight:700;font-family:var(--font);
  border-radius:8px;border:var(--input-border);text-align:center;
  background:var(--input-bg);color:var(--input-color);
}
.tinput::placeholder{color:var(--placeholder);opacity:1;}
.tinput.sm{width:100px;padding:8px;font-size:1rem;}
.err{min-height:1.2em;font:700 .95rem 'Inter',sans-serif;color:#ffd43b;text-shadow:0 0 6px #000;margin-top:8px;}

/* ---------- Neutral glass card (editors, lists) ---------- */
.glass{
  margin-top:24px;width:min(680px,100%);padding:18px 20px;border-radius:16px;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);
  font:400 1rem 'Inter',sans-serif;color:#fff;text-shadow:none;color-scheme:dark;
}
.glass[hidden]{display:none;}
.glass h3{margin:0 0 12px;font-size:1rem;font-weight:700;}
.glass .muted{color:rgba(255,255,255,0.65);font-size:.9rem;}
.glass input[type=text],.glass input[type=time],.glass input[type=number],.glass select{
  font:400 1rem 'Inter',sans-serif;color:#fff;background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.25);border-radius:8px;padding:8px 10px;min-width:0;
}
.glass select option{color:#000;}
.glass input::placeholder{color:rgba(255,255,255,0.5);}
.gbtn{
  font:700 .9rem 'Inter',sans-serif;color:#fff;background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;
}
.gbtn:hover{background:rgba(255,255,255,0.22);}
.gbtn.x{padding:6px 10px;background:transparent;border-color:transparent;color:rgba(255,255,255,0.7);}
.gbtn.x:hover{color:#fff;background:rgba(255,255,255,0.12);}
.grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.grow > input[type=text]{flex:1;}

/* ---------- TURN timer (from TurnTimer.html) ---------- */
.chip-row{display:grid;grid-auto-flow:column;gap:28px;align-items:center;justify-items:center;min-height:160px;position:relative;}
.turn-wrapper{position:relative;width:160px;height:160px;display:grid;place-items:center;}
.turn-chip{
  position:relative;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  font:700 2.5rem 'Inter',sans-serif;color:#fff;text-shadow:0 0 8px rgba(0,0,0,0.7);
  box-shadow:0 0 20px rgba(0,0,0,0.6);transition:opacity .4s,transform .18s ease;cursor:pointer;
}
.turn-chip.active{transform:scale(1.08);}
.turn-chip.dim{opacity:.25;}
.turn1{background:#e03131;} .turn2{background:#2fb344;} .turn3{background:#ffd43b;} .turn4{background:#1e66f5;}
.ring{position:absolute;inset:0;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round;}
.ring-bg{stroke:rgba(255,255,255,0.25);}
.ring-bar{stroke:var(--ring);filter:drop-shadow(0 0 6px rgba(255,255,255,0.85));transition:stroke-dashoffset .1s linear;}
#turnTimer{font-size:2.6rem;margin-top:18px;}
@keyframes chipPulse{0%,100%{transform:scale(1);opacity:1;box-shadow:0 0 12px #fff;}50%{transform:scale(1.12);opacity:.7;box-shadow:0 0 30px #fff;}}
@keyframes timerPulse{0%,100%{opacity:1;text-shadow:0 0 10px var(--glow1),0 0 20px var(--glow2);}50%{opacity:.7;text-shadow:0 0 25px var(--glow1),0 0 45px var(--glow2);}}
.chip-pulsate{animation:chipPulse 1.5s infinite ease-in-out;}
.chip2-pulse{animation-delay:.3s;} .chip3-pulse{animation-delay:.6s;} .chip4-pulse{animation-delay:.9s;}
.timer-pulsate{animation:timerPulse 1.5s infinite ease-in-out;}
@keyframes flashAdd{0%{color:#0f0;text-shadow:0 0 20px #0f0;}100%{color:var(--text);}}
.flash-add{animation:flashAdd .6s;}
.float-label{position:absolute;font:700 1.2rem 'Inter',sans-serif;color:#0f0;animation:floatUp 1s forwards;pointer-events:none;}
.float-label.sel{top:-30px;color:#00f4ff;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-25px);}}
@keyframes selectFlash{0%{box-shadow:0 0 0 #fff;transform:scale(1);}50%{box-shadow:0 0 25px #fff;transform:scale(1.1);}100%{box-shadow:0 0 0 #fff;transform:scale(1);}}
.chip-flash{animation:selectFlash .6s ease;}
#pane-turn .row{margin-top:14px;gap:16px;}
#pane-turn .btn.round{font-size:1.2rem;}

/* ---------- BAR timer (from BarTimer.html) ---------- */
#pane-bar{width:min(92vw,1000px);}
/* Same space above and below the bar panel */
#pane-bar{--bar-gap:clamp(14px,2.6vh,26px);}
#barTimer{font-size:clamp(2.4rem,6.6vh,3.6rem);line-height:1.1;margin-bottom:var(--bar-gap);}
.bars-wrap{
  width:100%;display:flex;flex-direction:column;gap:clamp(5px,1vh,9px);
  /* Glass panel behind the bars only, so they read on busy backgrounds */
  padding:clamp(10px,2vh,18px) clamp(12px,2vw,22px);border-radius:26px;
  background:var(--bar-panel);border:1px solid var(--bar-panel-edge);box-shadow:0 20px 60px rgba(0,0,0,.35);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.bar-row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:12px;}
.count-btn{
  width:clamp(40px,6.4vh,58px);height:clamp(40px,6.4vh,58px);border-radius:50%;font:800 1.6rem 'Inter',sans-serif;
  border:2px solid var(--accent);background:var(--bar-count-bg);color:var(--btn-color);cursor:pointer;
}
.count-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-color);transform:scale(1.05);}
.bar-row.row-active .count-btn{background:var(--accent);color:var(--bar-on-accent);border-color:var(--accent);box-shadow:0 0 16px var(--accent);transform:scale(1.05);}
/* Outlined bars: a light inner edge and a dark outer edge show on any background */
.bar-shell{width:100%;height:clamp(16px,2.8vh,26px);border-radius:999px;background:var(--bar-track);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--bar-edge-in),0 0 0 1.5px var(--bar-edge-out);position:relative;}
.bar-fill{
  position:absolute;inset:0;width:100%;
  background:linear-gradient(90deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 78%,#000) 100%);
  box-shadow:0 0 24px color-mix(in srgb,var(--accent) 95%,transparent);transition:width .1s linear;
}
@keyframes shellPulse{
  0%,100%{box-shadow:inset 0 0 0 1.5px var(--bar-edge-in),0 0 0 1.5px var(--bar-edge-out),0 0 10px color-mix(in srgb,var(--accent) 60%,transparent),0 0 24px color-mix(in srgb,var(--accent) 85%,transparent);}
  50%{box-shadow:inset 0 0 0 1.5px var(--bar-edge-in),0 0 0 1.5px var(--bar-edge-out),0 0 18px color-mix(in srgb,var(--accent) 85%,transparent),0 0 40px var(--accent);}
}
.row-active .bar-shell{animation:shellPulse 1.25s ease-in-out infinite;}
.bar-shell::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.35) 35%,rgba(255,255,255,.1) 50%,transparent 65%);transform:translateX(-120%);}
@keyframes shimmer{0%{transform:translateX(-120%);}100%{transform:translateX(120%);}}
.row-active .bar-shell::after{animation:shimmer 1.8s linear infinite;}
.row-dim .count-btn{opacity:.55;}
.row-done .bar-shell{background:var(--bar-track);}
#pane-bar .row{margin-top:clamp(6px,1.3vh,12px);gap:10px;}
#pane-bar .bars-wrap + .row{margin-top:var(--bar-gap);}
@media (max-height:780px){ #pane-bar .btn.sm.round{width:48px;height:48px;font-size:.85rem;} #pane-bar .btn.sm{padding:6px 14px;} }

/* ---------- ROUTINES (iOS Clock style: progress ring, round buttons, step list) ---------- */
.r-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(24px,3vw,64px);width:min(1100px,100%);flex-wrap:wrap;}
.r-main{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,28px);}
.r-ring{
  position:relative;width:min(clamp(240px,46vh,390px),78vw);aspect-ratio:1;border-radius:50%;
  background:var(--bar-panel);border:1px solid var(--bar-panel-edge);box-shadow:0 20px 60px rgba(0,0,0,.35);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.r-ring > svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.r-ring > svg circle{fill:none;stroke-width:8;stroke-linecap:round;}
.r-track{stroke:color-mix(in srgb,var(--text) 14%,transparent);}
.r-prog{stroke:var(--accent);transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 65%,transparent));}
.r-center{position:absolute;inset:13%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--text);}
.r-step{max-width:100%;font:600 clamp(1rem,2.5vh,1.4rem)/1.2 var(--font);opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:none;}
.r-time{font-size:clamp(3rem,9.5vh,5.4rem);font-weight:var(--timer-weight);line-height:1;font-variant-numeric:tabular-nums;text-shadow:var(--timer-shadow);}
.r-time.glow{animation:glowPulse 2s infinite ease-in-out;}
.r-ends{display:flex;align-items:center;gap:6px;font:500 clamp(.8rem,1.8vh,1rem) 'Inter',sans-serif;opacity:.78;text-shadow:none;}
.r-ends svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.r-step.flash{animation:glowPulse 1.2s 3 ease-in-out;}
.r-ctrls{display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);}
.r-circ,.r-mini{
  /* Same look as the Timer buttons: theme border and text, see-through, theme blur */
  position:relative;display:grid;place-items:center;padding:0;cursor:pointer;
  border:2px solid var(--btn-border);background:transparent;color:var(--btn-color);
  font:700 1.05rem var(--font);text-shadow:var(--btn-shadow);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  transition:background .3s,color .3s,transform .2s;
}
.r-circ:hover,.r-mini:hover{background:var(--btn-hover-bg);color:var(--btn-hover-color);transform:scale(1.05);}
.r-circ:active,.r-mini:active{transform:scale(.97);}
.r-circ{width:clamp(66px,9.5vh,80px);aspect-ratio:1;border-radius:50%;}
.r-mini{height:50px;min-width:50px;padding:0 14px;border-radius:30px;}
.r-mini svg{width:20px;height:20px;fill:currentColor;}
/* Step list card */
.r-list{
  width:min(290px,100%);border-radius:22px;overflow:hidden;background:rgba(16,16,18,.74);border:1px solid var(--dock-line);
  box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  font-family:'Inter',sans-serif;color:#f3f5f9;text-shadow:none;
}
.rl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 12px;}
.rl-title{font:700 22px 'Inter',sans-serif;letter-spacing:-.01em;overflow-wrap:anywhere;}
.rl-sub{font:500 13px 'Inter',sans-serif;color:var(--dock-muted);margin-top:3px;}
.rl-edit{border:0;background:transparent;color:var(--dock-accent);font:500 16px 'Inter',sans-serif;cursor:pointer;padding:2px 0;}
.rl-rows{max-height:min(44vh,420px);overflow-y:auto;}
.rl-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .15s;}
.rl-row:hover{background:rgba(255,255,255,.04);}
.rl-row.cur{background:rgba(255,255,255,.08);}
.rl-dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.28);display:grid;place-items:center;}
.rl-dot svg{width:13px;height:13px;fill:none;stroke:#0b2a12;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.rl-row.done .rl-dot{background:#30d158;border-color:#30d158;}
.rl-row.cur .rl-dot{border-color:var(--dock-accent);}
.rl-row.cur .rl-dot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dock-accent);}
.rl-row.cur.running .rl-dot::before{animation:rlPulse 1.4s infinite ease-in-out;}
@keyframes rlPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.6);opacity:.55;}}
.rl-name{flex:1;min-width:0;font:500 15.5px 'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rl-row.done .rl-name{color:var(--dock-muted);}
.rl-dur{font:500 15px 'Inter',sans-serif;color:var(--dock-muted);font-variant-numeric:tabular-nums;}
.rl-row.cur .rl-dur{color:#fff;}
.rl-foot{display:flex;justify-content:space-between;gap:10px;padding:11px 18px 14px;border-top:1px solid rgba(255,255,255,.08);font:500 13px 'Inter',sans-serif;color:var(--dock-muted);}
.rl-empty{padding:20px 18px;border-top:1px solid rgba(255,255,255,.08);color:var(--dock-muted);font:500 14px 'Inter',sans-serif;text-align:center;}
/* Edit Routine sheet (shares the Add Alarm sheet styles) */
.as-cap{margin:2px 30px 6px;font:600 12px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--dock-muted);}
.rs-step{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 8px 6px 12px;border-top:1px solid rgba(255,255,255,.09);}
.rs-step:first-child{border-top:0;}
.rs-del{flex:none;width:22px;height:22px;border-radius:50%;border:0;background:#ff3b30;display:grid;place-items:center;cursor:pointer;padding:0;}
.rs-del::before{content:"";width:10px;height:2.5px;border-radius:2px;background:#fff;}
.rs-step input{min-width:0;background:transparent;border:0;color:#fff;font:500 15.5px 'Inter',sans-serif;outline:none;padding:6px 4px;border-radius:6px;}
.rs-step input:focus{background:rgba(255,255,255,.08);}
.rs-n{flex:1;}
.rs-t{width:64px;text-align:right;color:var(--dock-muted) !important;font-variant-numeric:tabular-nums;}
.rs-mv{display:flex;}
.rs-mv button{width:26px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--dock-muted);cursor:pointer;font-size:14px;}
.rs-mv button:hover{background:rgba(255,255,255,.1);color:#fff;}
.rs-add{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 14px 6px 12px;border:0;border-top:1px solid rgba(255,255,255,.09);background:transparent;color:#f3f5f9;font:500 15.5px 'Inter',sans-serif;cursor:pointer;text-align:left;}
.rs-add .plus{width:22px;height:22px;border-radius:50%;background:#30d158;display:grid;place-items:center;}
.rs-add .plus::before{content:"+";color:#fff;font:700 17px/1 'Inter',sans-serif;margin-top:-1px;}
.as-row .switch{margin-left:auto;}
.as-full{width:100%;justify-content:center;border:0;background:transparent;color:var(--dock-accent);cursor:pointer;font:500 15.5px 'Inter',sans-serif;}
.rs-lib small{display:block;color:var(--dock-muted);font-size:12px;font-weight:500;}
.rs-lib .grow1{flex:1;min-width:0;}
.rs-msg{margin:-4px 30px 12px;font:500 13px 'Inter',sans-serif;color:#30d158;}
.rs-msg.err{color:#ff9f0a;}
.rs-msg:empty{display:none;}

/* ---------- ALARM (laid out like the iOS Clock app) ---------- */
.clock{font-size:8rem;line-height:1.1;text-shadow:var(--timer-shadow);font-weight:var(--timer-weight);font-variant-numeric:tabular-nums;}
.clock .ampm{font-size:2.4rem;margin-left:10px;}
.a-date{font-size:1.5rem;opacity:.9;}
.a-next{font-size:1.2rem;margin-top:14px;opacity:.9;text-align:center;}
.switch{position:relative;flex:none;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.36);border:0;cursor:pointer;transition:background .2s;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .2s var(--ease);}
.switch[aria-checked="true"]{background:#34c759;}
.switch[aria-checked="true"]::after{left:22px;}

/* Alarm list */
.alist{
  margin-top:24px;width:min(560px,100%);border-radius:22px;overflow:hidden;
  background:rgba(16,16,18,.74);border:1px solid var(--dock-line);box-shadow:0 20px 60px rgba(0,0,0,.4);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  font-family:'Inter',sans-serif;color:#f3f5f9;text-shadow:none;
}
.al-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0 18px;}
.al-link{border:0;background:transparent;color:var(--dock-accent);font:500 16px 'Inter',sans-serif;cursor:pointer;padding:6px 2px;}
.al-plus{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--dock-accent);display:grid;place-items:center;cursor:pointer;}
.al-plus:hover{background:rgba(255,255,255,.18);}
.al-plus svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;}
.al-title{margin:2px 18px 6px;font:700 30px 'Inter',sans-serif;letter-spacing:-.02em;}
.al-rows{max-height:44vh;overflow-y:auto;}
.al-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .15s;}
.al-row:hover{background:rgba(255,255,255,.04);}
.al-del{display:none;flex:none;width:24px;height:24px;border-radius:50%;border:0;background:#ff3b30;place-items:center;cursor:pointer;padding:0;}
.al-del::before{content:"";width:11px;height:2.5px;border-radius:2px;background:#fff;}
.alist.editing .al-del{display:grid;}
.alist.editing .switch{display:none;}
.al-main{flex:1;min-width:0;}
.al-time{font:300 46px/1 'Inter',sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.al-time small{font-size:21px;font-weight:400;margin-left:4px;letter-spacing:0;}
.al-sub{font:500 13.5px 'Inter',sans-serif;color:var(--dock-muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.al-row.off .al-time,.al-row.off .al-sub{opacity:.45;}
.al-sub .snz{color:#ff9f0a;}
.al-chev{display:none;width:16px;height:16px;fill:none;stroke:var(--dock-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.alist.editing .al-chev{display:block;}
.al-empty{padding:22px 18px 28px;border-top:1px solid rgba(255,255,255,.08);text-align:center;color:var(--dock-muted);font:500 14px 'Inter',sans-serif;}

/* Add / edit alarm sheet */
#aSheetWrap,#rSheetWrap{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);}
#aSheetWrap.show,#rSheetWrap.show{display:flex;}
.asheet{
  width:min(420px,100%);max-height:calc(100vh - 32px);overflow-y:auto;border-radius:22px;
  background:#1c1c1e;border:1px solid var(--dock-line);box-shadow:0 30px 90px rgba(0,0,0,.6);
  font-family:'Inter',sans-serif;color:#f3f5f9;text-shadow:none;animation:sheetIn .3s var(--ease);
}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.as-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#1c1c1e;}
.as-head b{font:600 16px 'Inter',sans-serif;}
.as-btn{border:0;background:transparent;color:var(--dock-accent);font:500 16px 'Inter',sans-serif;cursor:pointer;padding:6px 4px;}
.as-btn.save{font-weight:700;}
.wheel{position:relative;display:flex;justify-content:center;gap:2px;height:180px;margin:4px 16px 16px;}
.wheel::before{content:"";position:absolute;left:0;right:0;top:72px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);pointer-events:none;}
.wcol{
  position:relative;width:76px;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
  padding:72px 0;box-sizing:border-box;outline:none;border-radius:10px;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
}
.wcol::-webkit-scrollbar{display:none;}
.wcol:focus-visible{box-shadow:inset 0 0 0 2px var(--dock-accent);}
.wcol div{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font:400 23px 'Inter',sans-serif;color:rgba(255,255,255,.38);cursor:pointer;font-variant-numeric:tabular-nums;user-select:none;}
.wcol div.sel{color:#fff;}
.as-group{margin:0 16px 14px;border-radius:14px;background:#2c2c2e;overflow:hidden;}
.as-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.09);font:500 15.5px 'Inter',sans-serif;}
.as-row:first-child{border-top:0;}
.as-row.click{cursor:pointer;}
.as-row .val{flex:1;min-width:0;text-align:right;color:var(--dock-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.as-row svg.chev{width:15px;height:15px;fill:none;stroke:var(--dock-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .2s;}
.as-row.click[aria-expanded="true"] svg.chev{transform:rotate(90deg);}
.as-row input[type=text]{flex:1;min-width:0;text-align:right;background:transparent;border:0;color:#fff;font:inherit;outline:none;}
.as-row input::placeholder{color:var(--dock-muted);}
.as-row select{background:transparent;color:var(--dock-muted);border:0;font:inherit;cursor:pointer;margin-left:auto;}
.as-row select option{color:#000;}
.days{display:flex;gap:5px;margin-left:auto;}
.days button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--dock-muted);font:600 12px 'Inter',sans-serif;cursor:pointer;padding:0;}
.days button[aria-pressed="true"]{background:var(--dock-accent);border-color:transparent;color:#111;}
.qdays{display:flex;gap:6px;justify-content:flex-end;padding:0 14px 10px;}
.qdays button{border:0;background:rgba(255,255,255,.08);color:var(--dock-muted);font:600 12px 'Inter',sans-serif;border-radius:999px;padding:5px 11px;cursor:pointer;}
.qdays button:hover{color:#fff;}
.as-sounds[hidden]{display:none;}
.as-snd{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 14px 6px 18px;border-top:1px solid rgba(255,255,255,.06);font:500 14.5px 'Inter',sans-serif;cursor:pointer;}
.as-snd:hover{background:rgba(255,255,255,.04);}
.as-snd .ck{width:18px;flex:none;color:var(--dock-accent);}
.as-snd .ck svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.as-snd small{display:block;color:var(--dock-muted);font-size:12px;}
.as-del{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;border-radius:14px;border:0;background:#2c2c2e;color:#ff453a;font:600 15.5px 'Inter',sans-serif;cursor:pointer;}
.as-del[hidden]{display:none;}
.as-err{margin:-6px 16px 12px;font:500 13px 'Inter',sans-serif;color:#ff9f0a;}
.as-err:empty{display:none;}

/* Ringing: a black box with a 28px blur so it stands out on any theme */
#ringOverlay{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.3);}
#ringOverlay.show{display:flex;}
.ring-box{
  width:min(640px,100%);padding:38px 32px 32px;border-radius:32px;text-align:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 90px rgba(0,0,0,.6);
  font-family:'Inter',sans-serif;color:#fff;text-shadow:none;animation:ringIn .45s var(--ease);
}
@keyframes ringIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
.ring-bell{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,159,10,.18);color:#ff9f0a;animation:bellShake 1.2s infinite ease-in-out;}
.ring-bell svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
@keyframes bellShake{0%,50%,100%{transform:rotate(0);}10%,30%{transform:rotate(-14deg);}20%,40%{transform:rotate(14deg);}}
.ring-kicker{margin-top:14px;font:700 13px 'Inter',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ff9f0a;}
#ringLabel{margin:8px 0 4px;font:700 clamp(2.4rem,7vw,4.6rem)/1.08 'Inter',sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere;}
#ringTime{font:300 clamp(1.6rem,4vw,2.4rem) 'Inter',sans-serif;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;}
.ring-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;}
.ring-btns button{min-width:170px;padding:17px 28px;border-radius:999px;border:0;font:700 19px 'Inter',sans-serif;cursor:pointer;transition:transform .15s,filter .15s;}
.ring-btns button:active{transform:scale(.97);}
#ringSnooze{background:#ff9f0a;color:#241500;min-width:230px;}
#ringSnooze:hover{filter:brightness(1.08);}
#ringSnooze[hidden]{display:none;}
#ringStop{background:rgba(255,255,255,.16);color:#fff;}
#ringStop:hover{background:rgba(255,255,255,.24);}

/* ---------- STOPWATCH ---------- */
.laps{max-height:34vh;overflow:auto;}
.lap{display:grid;grid-template-columns:80px 1fr 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,0.1);font-variant-numeric:tabular-nums;}
.lap:first-child{border-top:0;}
.lap .tot{color:rgba(255,255,255,0.6);text-align:right;}


/* ---------- Theme thumbnails (inside the dock) ---------- */
.thumb{display:flex;flex-direction:column;justify-content:flex-start;background:none;border:0;padding:0;cursor:pointer;color:#f3f5f9;text-align:center;font:600 10.5px 'Inter',sans-serif;line-height:1.25;}
.thumb .pic{
  display:block;width:100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;
  background:#333 center/cover no-repeat;border:2px solid transparent;transition:transform .2s,border-color .2s;
}
.thumb .pic img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb:hover .pic{transform:scale(1.04);}
.thumb[aria-pressed="true"] .pic{border-color:var(--dock-accent);}
.thumb .nm{display:block;margin-top:3px;}

/* ---------- MUSIC MINI BAR (YouTube) — left of the stacks button ----------
   A 256 x 88 bar. While music plays, the YouTube player drops down under it
   (YouTube requires its player to be visible and at least 200 x 200). */
.mbar{
  position:fixed;top:80px;right:20px;z-index:47;width:256px;padding:10px;border-radius:18px;
  background:rgba(16,16,18,.74);border:1px solid var(--dock-line);
  box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  font-family:'Inter',sans-serif;color:#f3f5f9;text-shadow:none;
  transform:translateX(16px);opacity:0;pointer-events:none;
  transition:transform .35s var(--ease),opacity .25s ease,right .35s var(--ease);
}
.mbar.open{transform:none;opacity:1;pointer-events:auto;}
/* Close button: appears when you point at the music bar (always shown on touch screens) */
.mb-close{
  position:absolute;top:-9px;left:-9px;z-index:3;width:24px;height:24px;border-radius:50%;padding:0;cursor:pointer;
  display:grid;place-items:center;border:1px solid var(--dock-line);background:rgba(44,44,48,.96);color:#f3f5f9;
  box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s var(--ease);
}
.mb-close svg{width:12px;height:12px;stroke-width:2.4;}
.mbar:hover .mb-close,.mbar:focus-within .mb-close{opacity:1;transform:none;}
.mb-close:hover{background:#ff453a;border-color:#ff453a;}
@media (hover:none){ .mb-close{opacity:1;transform:none;} }
/* Sits under the menu button; slides left when the menu panel (or the wider Themes panel) opens */
body.dock-open .mbar{right:126px;}
body.dock-open.themes-open .mbar{right:228px;}
#pane-bar .bars-wrap{margin-left:auto;margin-right:auto;transition:max-width .35s var(--ease);}
body.music-video #pane-bar .bars-wrap{max-width:calc(100vw - 580px);}
.mbar svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.mb-top{display:flex;gap:10px;height:68px;}
.mb-thumb{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;flex:none;background:#3a3427;display:grid;place-items:center;color:#e8dcb5;}
.mb-thumb svg{width:26px;height:26px;}
.mb-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.mb-eq{position:absolute;left:6px;bottom:6px;display:none;gap:2px;align-items:flex-end;height:14px;padding:2px 3px;border-radius:4px;background:rgba(0,0,0,.55);}
.mb-eq i{width:3px;height:4px;border-radius:1px;background:#fff;animation:mbEq .9s infinite ease-in-out;}
.mb-eq i:nth-child(2){animation-delay:.2s;} .mb-eq i:nth-child(3){animation-delay:.4s;}
@keyframes mbEq{0%,100%{height:3px;}50%{height:11px;}}
.mbar.playing .mb-eq{display:flex;}
.mb-info{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.mb-song{font:600 12.5px 'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mb-sub{font:500 11px 'Inter',sans-serif;color:var(--dock-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.mb-ctrls{display:flex;gap:2px;margin-left:-4px;}
.mb-b{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#f3f5f9;cursor:pointer;padding:0;}
.mb-b:hover{background:rgba(255,255,255,.12);}
.mb-b.main{background:rgba(255,255,255,.16);}
.mb-b[aria-expanded="true"]{background:rgba(255,255,255,.18);color:var(--dock-accent);}
.mb-b svg{width:17px;height:17px;}
.mb-b.main svg{fill:currentColor;stroke:none;}
.mb-drop{height:0;overflow:hidden;transition:height .35s var(--ease),margin .35s var(--ease);}
.mbar.dropped .mb-drop{height:200px;margin-top:10px;}
.btn .ic-play{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:currentColor;}
.mb-player{width:236px;height:200px;border-radius:12px;overflow:hidden;background:#000;}
.mb-player iframe{width:100%;height:100%;border:0;display:block;}
.mb-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);padding:8px;border-radius:14px;
  background:rgba(16,16,18,.94);border:1px solid var(--dock-line);box-shadow:0 16px 40px rgba(0,0,0,.45);font:500 12.5px 'Inter',sans-serif;}
.mb-pop[hidden]{display:none;}
.mb-vol{display:flex;align-items:center;gap:10px;padding:4px 6px;}
.mb-vol svg{width:18px;height:18px;flex:none;}
/* Volume opens beside the bar (to its left), so it never lands on or below the video */
#mbVolPop{left:auto;right:calc(100% + 8px);top:10px;width:220px;}
.mb-vol input{flex:1;accent-color:var(--dock-accent);}
.mb-vol output{width:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dock-muted);}
.mb-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;}
.mb-row:hover{background:rgba(255,255,255,.08);}
.mb-row .nm{flex:1;min-width:0;}
.mb-row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mb-row .nm small{display:block;color:var(--dock-muted);font-size:11px;}
.mb-row svg{width:16px;height:16px;}
.mb-row .chk{color:var(--dock-accent);}
.mb-x{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:var(--dock-muted);cursor:pointer;}
.mb-x:hover{background:rgba(255,255,255,.12);color:#fff;}
.mb-add{border-top:1px solid var(--dock-line);margin-top:4px;padding-top:4px;}
.mb-form{display:flex;flex-direction:column;gap:6px;padding:6px 4px 2px;}
.mb-form[hidden]{display:none;}
.mb-form input{font:400 12.5px 'Inter',sans-serif;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 9px;min-width:0;}
.mb-form input::placeholder{color:rgba(255,255,255,.5);}
.mb-form button{align-self:flex-end;font:600 12.5px 'Inter',sans-serif;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 14px;cursor:pointer;}
.mb-msg{font:500 11.5px 'Inter',sans-serif;color:#ffd43b;padding:6px 4px 0;}
.mb-msg:empty{display:none;}

/* ---------- Responsive (mirrors the originals' breakpoints) ---------- */

  .row{gap:12px;margin-top:15px;}
  .clock{font-size:4.5rem;} .clock .ampm{font-size:1.6rem;}
  .al-time{font-size:38px;} .ring-btns button{min-width:0;flex:1;}

}

  #turnTimer{font-size:2rem;}

}

  .bar-shell{height:22px;}

}
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem('robsonTimers.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('robsonTimers.'+k, JSON.stringify(v)); }catch(e){} }
};
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = String(sec%60).padStart(2,'0');
  return h ? `${h}:${String(m).padStart(2,'0')}:${s}` : `${m}:${s}`;
}
const fmtMs = ms => fmt(Math.ceil(Math.max(0,ms)/1000));
/* Accepts 5 (minutes), 5:00, :45, 1:02:00. Returns seconds or null. */
function parseTime(str){
  str = String(str||'').trim(); if(!str) return null;
  if(/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str)*60);
  const m = str.match(/^(?:(\d+):)?(\d*):(\d{1,2})$/);
  if(!m) return null;
  const h = +(m[1]||0), mm = +(m[2]||0), ss = +m[3];
  if(ss > 59) return null;
  return h*3600 + mm*60 + ss;
}
function strictMMSS(str){ /* same rule as your original Set box */
  const m = String(str).trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return {err:'Enter time as MM:SS'};
  if(+m[2] >= 60) return {err:'Seconds must be 00–59'};
  return {sec: +m[1]*60 + +m[2]};
}
function flashErr(el, msg){ el.textContent = msg; clearTimeout(el._t); el._t = setTimeout(()=>el.textContent='', 2500); }
function floatLabel(parent, text, cls){
  const d = document.createElement('div'); d.className = 'float-label' + (cls ? ' '+cls : ''); d.textContent = text;
  parent.appendChild(d); setTimeout(()=>d.remove(), 1000);
}

const endS = $('#endSound'), warnS = $('#warnSound'), turnS = $('#turnSound'), finalS = $('#finalSound');
turnS.src = AUD('TurnAlert.mp3'); finalS.src = AUD('ac-bel-105874.mp3');
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked = true;
  [endS, warnS, turnS, finalS, $('#alarmSound')].forEach(a=>{
    if(!a.src) return; a.muted = true;
    const p = a.play(); if(p) p.then(()=>{ a.pause(); a.currentTime = 0; a.muted = false; }).catch(()=>{ a.muted = false; });
  });
}
document.addEventListener('pointerdown', unlockAudio, {once:true});
document.addEventListener('keydown', unlockAudio, {once:true});
function safePlay(a, vol){ try{ if(vol!=null) a.volume = vol; a.currentTime = 0; a.play().catch(()=>{}); }catch(e){} }
let endToken = 0;
/* Same as playSoundThreeTimes() in your timers, but uses the theme's repeat/cutoff. */
function playThemeEnd(){
  const t = theme, my = ++endToken; let count = 0; endS.volume = t.endVolume;
  (function next(){
    if(my !== endToken || count >= t.endRepeat) return;
    endS.currentTime = 0;
    endS.play().then(()=>{
      const d = (isFinite(endS.duration) ? endS.duration : 2) * t.endCutoff;
      setTimeout(()=>{ if(my !== endToken) return; endS.pause(); endS.currentTime = 0; count++; next(); }, d*1000);
    }).catch(()=>{});
  })();
}
function stopThemeSounds(){ endToken++; [endS, warnS].forEach(a=>{ try{ a.pause(); a.currentTime = 0; }catch(e){} }); }
function stopAllSounds(){ stopThemeSounds(); [turnS, finalS].forEach(a=>{ try{ a.pause(); a.currentTime = 0; }catch(e){} }); }

/* Blur: the theme's button blur is applied to the buttons, the dock, and the corner button.
   Written out as plain values (not a CSS variable) and with the -webkit- prefix, because
   Safari and Mac WebKit previews ignore backdrop-filter without it. */
const blurStyle = document.createElement('style'); document.head.appendChild(blurStyle);
/* The dock's highlight uses the theme accent, unless that accent is too dark to see on the dark glass. */
function isLightColor(c){
  try{
    const x = document.createElement('canvas').getContext('2d'); x.fillStyle = '#000'; x.fillStyle = c;
    const v = x.fillStyle; if(v[0] !== '#') return false;
    const ch = i => { const n = parseInt(v.slice(i,i+2),16)/255; return n <= .03928 ? n/12.92 : Math.pow((n+.055)/1.055,2.4); };
    return (.2126*ch(1) + .7152*ch(3) + .0722*ch(5)) > .3;
  }catch(e){ return true; }
}
function dockAccent(c){
  try{
    const x = document.createElement('canvas').getContext('2d'); x.fillStyle = '#fff'; x.fillStyle = c;
    const v = x.fillStyle; let r, g, b;
    if(v[0] === '#'){ r = parseInt(v.slice(1,3),16); g = parseInt(v.slice(3,5),16); b = parseInt(v.slice(5,7),16); }
    else [r, g, b] = v.match(/[\d.]+/g).map(Number);
    return (0.299*r + 0.587*g + 0.114*b)/255 < 0.4 ? '#ffffff' : v;
  }catch(e){ return '#ffffff'; }
}

function setBgPreview(id){ const ph = BG_PREVIEW[id]; bgPh.style.backgroundImage = ph ? `url("${ph}")` : 'none'; }
function setBgPicture(src){
  if(src){
    if(bgPic.getAttribute('src') !== src){
      bgPic.classList.add('loading');
      bgPic.onload = () => bgPic.classList.remove('loading');
      bgPic.src = src;
      if(bgPic.complete && bgPic.naturalWidth) bgPic.classList.remove('loading');
    }
    bgPic.hidden = false;
  } else { bgPic.hidden = true; bgPic.removeAttribute('src'); bgPic.classList.remove('loading'); }
}
bgVid.addEventListener('loadeddata', () => bgVid.classList.remove('loading'));
/* Start downloading a theme's background while the pointer rests on its thumbnail, so the click feels instant */
const preloaded = new Set();
function preloadTheme(id){
  const t = THEMES.find(x=>x.id === id); if(!t || preloaded.has(id)) return; preloaded.add(id);
  if(t.image){ const im = new Image(); im.decoding = 'async'; im.src = IMG(t.image); }
  else if(t.video){ const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.src = IMG(t.video); v.load(); preloadTheme.keep = (preloadTheme.keep || []).concat(v).slice(-3); }
}
function applyTheme(id){
  const def = THEMES.find(t=>t.id===id) || THEMES.find(t=>t.id===DEFAULT_THEME);
  const t = Object.assign({}, BASE, def);
  const prev = theme; theme = t;
  const v = {
    '--text':t.text, '--body-shadow':t.bodyShadow, '--timer-shadow':t.timerShadow || t.bodyShadow,
    '--glow1':t.glow1, '--glow2':t.glow2, '--glow-op':t.glowOp,
    '--btn-border':t.btnBorder, '--btn-color':t.btnColor, '--btn-hover-bg':t.btnHoverBg, '--btn-hover-color':t.btnHoverColor,
    '--btn-blur':t.btnBlur, '--btn-shadow':t.btnShadow || t.bodyShadow,
    '--input-bg':t.inputBg, '--input-color':t.inputColor, '--input-border':t.inputBorder, '--placeholder':t.placeholder,
    '--music':t.music, '--music-hover':t.musicHover, '--accent':t.accent, '--ring':t.ring || t.text,
    '--font':t.font, '--timer-weight':t.timerWeight, '--overlay':t.overlay, '--presets-top':t.presetsTop
  };
  for(const k in v) root.style.setProperty(k, v[k]);
  const bl = `blur(${t.btnBlur})`;
  blurStyle.textContent = `.btn,.r-circ,.r-mini,.vdock,.corner-btn,.mbar,.alist,.bars-wrap,.r-ring,.r-list{backdrop-filter:${bl};-webkit-backdrop-filter:${bl};}`;
  root.style.setProperty('--dock-accent', dockAccent(t.accent));
  /* Bar timer panel: dark glass on most themes, light glass where the button text is dark (black or deep blue) */
  const lightBars = !isLightColor(t.btnColor);
  const bars = lightBars
    ? {'--bar-panel':'rgba(255,255,255,.55)','--bar-panel-edge':'rgba(0,0,0,.12)','--bar-track':'rgba(255,255,255,.7)','--bar-edge-in':'rgba(0,0,0,.35)','--bar-edge-out':'rgba(255,255,255,.6)','--bar-count-bg':'rgba(255,255,255,.5)'}
    : {'--bar-panel':'rgba(10,10,12,.55)','--bar-panel-edge':'rgba(255,255,255,.12)','--bar-track':'rgba(0,0,0,.42)','--bar-edge-in':'rgba(255,255,255,.38)','--bar-edge-out':'rgba(0,0,0,.55)','--bar-count-bg':'rgba(0,0,0,.35)'};
  for(const k in bars) root.style.setProperty(k, bars[k]);
  /* Number on the active circle: black on light bar colors, white on dark ones */
  root.style.setProperty('--bar-on-accent', isLightColor(t.accent) ? '#000' : '#fff');

  // Background
  bgImg.style.backgroundColor = t.bgColor;
  setBgPreview(t.id);
  /* Optional per-theme zoom (e.g. Halloween: 30% larger, anchored left, so the cat and ghost sit clear of the controls) */
  const z = t.bgZoom || 1, zo = t.bgOrigin || 'center';
  bgPic.style.transform = z !== 1 ? `scale(${z})` : ''; bgPic.style.transformOrigin = z !== 1 ? zo : '';
  bgPh.style.transform = `scale(${(1.04 * z).toFixed(3)})`; bgPh.style.transformOrigin = zo;
  if(t.video){
    setBgPicture(null);
    const src = IMG(t.video);
    if(bgVid.getAttribute('src') !== src){ bgVid.classList.add('loading'); bgVid.setAttribute('src', src); bgVid.load(); }
    bgVid.style.display = 'block'; bgVid.play().catch(()=>{});
  } else {
    bgVid.pause(); bgVid.style.display = 'none';
    if(bgVid.getAttribute('src')){ bgVid.removeAttribute('src'); bgVid.load(); }
    setBgPicture(t.image ? IMG(t.image) : null);
  }

  // Logos
  const xl = $('#extraLogo');
  if(t.extraLogo){ xl.src = IMG(t.extraLogo); xl.style.display = 'block'; } else { xl.style.display = 'none'; xl.removeAttribute('src'); }
  updateLogo();

  // Sounds (only swap if changed so nothing restarts)
  if(!prev || prev.endSound !== t.endSound){ stopThemeSounds(); endS.src = AUD(t.endSound); }
  if(!prev || prev.warnSound !== t.warnSound){ warnS.src = AUD(t.warnSound); }
  const alS = $('#alarmSound'); if(alS && alS.paused) alS.src = AUD(t.endSound);   /* ready for the browser's sound unlock */

  $$('.thumb').forEach(b=>b.setAttribute('aria-pressed', b.dataset.id === t.id));
  store.set('theme', t.id); syncUrl();
}
function updateLogo(){
  if(!theme) return;
  /* Themes with dark text (Crumpled Paper, Neon, Spring) get the black logo */
  const dark = theme.logo === 'BK';
  root.style.setProperty('--logo-color', dark ? '#000' : '#fff');
  root.style.setProperty('--logo-shadow', dark ? 'drop-shadow(0 0 6px rgba(255,255,255,.6))' : 'drop-shadow(0 2px 8px rgba(0,0,0,.55))');
}

/* ---------- Theme drawer ---------- */
const drawer = $('#drawer'), grid = $('#themeGrid');
let drawerCat = 'static';
function renderGrid(){
  grid.innerHTML = '';
  THEMES.filter(t=>t.cat === drawerCat).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'thumb'; b.dataset.id = t.id; b.setAttribute('aria-pressed', theme && theme.id === t.id);
    const pic = document.createElement('span'); pic.className = 'pic';
    const swatch = Object.assign({}, BASE, t);
    pic.style.backgroundColor = swatch.bgColor !== '#000' ? swatch.bgColor : '#333';
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = IMG(t.thumb);
    img.onerror = () => img.remove();
    pic.appendChild(img);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = t.name;
    b.append(pic, nm);
    b.onclick = () => applyTheme(t.id);
    let hoverT;
    b.addEventListener('pointerenter', ()=>{ hoverT = setTimeout(()=>preloadTheme(t.id), 120); });
    b.addEventListener('pointerleave', ()=>clearTimeout(hoverT));
    b.addEventListener('focus', ()=>preloadTheme(t.id));
    b.addEventListener('touchstart', ()=>preloadTheme(t.id), {passive:true});
    grid.appendChild(b);
  });
  $$('#catBar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.cat === drawerCat));
}
/* Themes takes over the dock (double width, two thumbnails across). The back arrow returns to the tools. */
function openDrawer(open){
  const isOpen = open == null ? !drawer.classList.contains('open') : open;
  if(isOpen){ drawerCat = theme.cat; renderGrid(); openDock(); }
  drawer.classList.toggle('open', isOpen); drawer.setAttribute('aria-hidden', !isOpen);
  vdock.classList.toggle('themes', isOpen);
  document.body.classList.toggle('themes-open', isOpen);
  $('#themeBtn').setAttribute('aria-pressed', isOpen);
  if(isOpen) setTimeout(()=>{ const sel = grid.querySelector('.thumb[aria-pressed="true"]'); if(sel) grid.scrollTop = sel.offsetTop - grid.clientHeight/2 + sel.offsetHeight/2; }, 50);
}
$$('#catBar button').forEach(b=>b.onclick = ()=>{ drawerCat = b.dataset.cat; renderGrid(); grid.scrollTop = 0; });
$('#themeBtn').onclick = ()=>openDrawer();
$('#themeBack').onclick = ()=>openDrawer(false);

/* =====================================================================
   TIMER › STANDARD  (logic from TimerRoad.html)
   ===================================================================== */
const Standard = (()=>{
  const el = $('#stdTimer'), pane = $('#pane-standard');
  let duration = store.get('std.duration', 300), remaining = duration, endTime = 0, running = false, iv = null, warned = false;
  const upd = () => el.textContent = fmt(remaining);
  function tick(){
    if(!running) return;
    remaining = Math.round((endTime - Date.now())/1000);
    if(remaining <= theme.warnAt && remaining > 0 && !warned){ warned = true; safePlay(warnS, 0.5); }
    if(remaining <= 0){
      remaining = 0; upd(); clearInterval(iv); iv = null; running = false;
      el.classList.remove('running'); el.classList.add('glow'); playThemeEnd();
    } else upd();
  }
  function start(){ if(running) return; if(remaining <= 0) return; el.classList.add('running'); endTime = Date.now() + remaining*1000; running = true; warned = remaining <= theme.warnAt; iv = setInterval(tick, 250); }
  function pause(){ if(!running) return; clearInterval(iv); iv = null; running = false; remaining = Math.round((endTime - Date.now())/1000); el.classList.remove('running'); }
  function reset(){ clearInterval(iv); iv = null; running = false; remaining = duration; warned = false; upd(); el.classList.remove('running','glow'); stopThemeSounds(); }
  function setTime(sec, autostart){
    pause(); duration = sec; remaining = sec; warned = false; store.set('std.duration', sec);
    upd(); el.classList.remove('glow'); stopThemeSounds(); if(autostart) start();
  }
  function add(){
    remaining += 30; if(running) endTime += 30000;
    if(remaining > theme.warnAt) warned = false;
    el.classList.remove('glow'); upd();
  }
  pane.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.m != null) return setTime((+b.dataset.m)*60 + (+(b.dataset.s||0)), true); // presets start right away (as before)
    const a = b.dataset.act;
    if(a==='start') start(); else if(a==='pause') pause(); else if(a==='reset') reset(); else if(a==='add') add();
    else if(a==='set'){ const r = strictMMSS($('#stdCustom').value); if(r.err) flashErr($('#stdErr'), r.err); else setTime(r.sec, false); }
  });
  $('#stdCustom').addEventListener('keydown', e=>{ if(e.key==='Enter') pane.querySelector('[data-act=set]').click(); });
  upd();
  return { start, pause, reset, toggle(){ running ? pause() : start(); }, running:()=>running };
})();
