   ===================================================================== */
const Turn = (()=>{
  const chipRow = $('#chipRow'), el = $('#turnTimer'), pane = $('#pane-turn');
  const R = 68, C = 2*Math.PI*R;
  let totalTurns = 4, currentTurn = 1, durationMs = store.get('turn.duration', 30)*1000, startTime = 0, elapsedBefore = 0, rafId = null, running = false;
  const bars = () => $$('.ring-bar', chipRow), chips = () => $$('.turn-chip', chipRow);
  function build(){
    chipRow.innerHTML = '';
    for(let i=1;i<=4;i++){
      const wrap = document.createElement('div'); wrap.className = 'turn-wrapper';
      wrap.style.display = i > totalTurns ? 'none' : 'grid';
      const chip = document.createElement('div'); chip.className = 'turn-chip turn'+i; chip.textContent = i; chip.dataset.turn = i;
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','ring'); svg.setAttribute('viewBox','0 0 160 160'); svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
      ['ring-bg','ring-bar'].forEach(cls=>{
        const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('class',cls); c.setAttribute('cx','80'); c.setAttribute('cy','80'); c.setAttribute('r',R);
        if(cls==='ring-bar'){ c.style.strokeDasharray = C; c.style.strokeDashoffset = C; }
        svg.appendChild(c);
      });
      wrap.append(svg, chip); chipRow.appendChild(wrap);
    }
  }
  const upd = ms => el.textContent = fmtMs(ms);
  function setActive(turn){
    currentTurn = turn; chips().forEach(c=>c.classList.remove('active')); bars().forEach(b=>b.style.strokeDashoffset = C);
    const c = chips()[turn-1]; if(c){ c.classList.add('active'); c.classList.remove('dim'); }
  }
  function markDone(turn){ const c = chips()[turn-1]; if(c) c.classList.add('dim'); const b = bars()[turn-1]; if(b) b.style.strokeDashoffset = C; }
  function tick(){
    if(!running) return;
    const elapsed = elapsedBefore + performance.now() - startTime;
    upd(durationMs - elapsed);
    const bar = bars()[currentTurn-1]; if(bar) bar.style.strokeDashoffset = C*(elapsed/durationMs);
    if(elapsed >= durationMs){
      if(currentTurn < totalTurns){
        safePlay(turnS); markDone(currentTurn); setActive(currentTurn+1);
        startTime = performance.now(); elapsedBefore = 0; rafId = requestAnimationFrame(tick);
      } else {
        if(bar) bar.style.strokeDashoffset = C;
        safePlay(finalS); running = false; rafId = null;
        el.classList.add('timer-pulsate');
        chips().forEach((c,i)=>c.classList.add('chip-pulsate','chip'+(i+1)+'-pulse'));
      }
    } else rafId = requestAnimationFrame(tick);
  }
  function start(){
    if(running) return;
    if(el.classList.contains('timer-pulsate')) reset();
    running = true; chips().forEach((c,i)=>{ if(i+1 !== currentTurn) c.classList.add('dim'); });
    chips()[currentTurn-1].classList.add('active'); chips()[currentTurn-1].classList.remove('dim');
    startTime = performance.now(); rafId = requestAnimationFrame(tick);
  }
  function pause(){ if(!running) return; running = false; cancelAnimationFrame(rafId); elapsedBefore += performance.now() - startTime; }
  function reset(){
    running = false; cancelAnimationFrame(rafId); stopAllSounds(); elapsedBefore = 0;
    totalTurns = 4; currentTurn = 1; build(); el.classList.remove('timer-pulsate','flash-add'); upd(durationMs);
  }
  function setDuration(sec){ durationMs = sec*1000; store.set('turn.duration', sec); if(!running && elapsedBefore === 0) upd(durationMs); }
  chipRow.addEventListener('click', e=>{
    const chip = e.target.closest('.turn-chip'); if(!chip || running) return;
    totalTurns = +chip.dataset.turn; currentTurn = 1; elapsedBefore = 0;
    chips().forEach((c,i)=>{ c.parentElement.style.display = (i+1 > totalTurns) ? 'none' : 'grid'; c.classList.remove('dim','active','chip-pulsate','chip1-pulse','chip2-pulse','chip3-pulse','chip4-pulse'); });
    bars().forEach(b=>b.style.strokeDashoffset = C); el.classList.remove('timer-pulsate'); upd(durationMs);
    chip.classList.add('chip-flash'); setTimeout(()=>chip.classList.remove('chip-flash'), 600);
    floatLabel(chipRow, `${totalTurns} turn${totalTurns>1?'s':''} selected`, 'sel');
  });
  pane.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.m != null) return setDuration((+b.dataset.m)*60 + (+b.dataset.s));
    const a = b.dataset.act;
    if(a==='start') start(); else if(a==='pause') pause(); else if(a==='reset') reset();
    else if(a==='add'){
      durationMs += 15000;
      const elapsed = elapsedBefore + (running ? performance.now() - startTime : 0);
      upd(durationMs - elapsed);
      el.classList.add('flash-add'); setTimeout(()=>el.classList.remove('flash-add'), 600);
      floatLabel($('#turnControls'), '+15s');
      b.disabled = true; setTimeout(()=>b.disabled = false, 1000);
    }
    else if(a==='set'){ const r = strictMMSS($('#turnCustom').value); if(r.err) flashErr($('#turnErr'), r.err); else setDuration(r.sec); }
  });
  $('#turnCustom').addEventListener('keydown', e=>{ if(e.key==='Enter') pane.querySelector('[data-act=set]').click(); });
  build(); upd(durationMs);
  return { start, pause, reset, toggle(){ running ? pause() : start(); }, running:()=>running };
})();

/* =====================================================================
   TIMER › BAR  (logic from BarTimer.html)
   ===================================================================== */
const Bar = (()=>{
  const wrap = $('#barsWrap'), el = $('#barTimer'), pane = $('#pane-bar');
  let totalBars = 6, currentTurn = 1, durationMs = store.get('bar.duration', 30)*1000, running = false, rafId = null, startTime = 0, elapsedBefore = 0;
  const rows = () => $$('.bar-row', wrap), fills = () => $$('.bar-fill', wrap);
  const upd = ms => el.textContent = fmtMs(ms);
  function build(){
    wrap.innerHTML = '';
    for(let i=1;i<=6;i++){
      const row = document.createElement('div'); row.className = 'bar-row';
      const btn = document.createElement('button'); btn.className = 'count-btn'; btn.textContent = i; btn.dataset.value = i;
      const shell = document.createElement('div'); shell.className = 'bar-shell';
      const fill = document.createElement('div'); fill.className = 'bar-fill'; fill.style.width = '100%';
      shell.appendChild(fill); row.append(btn, shell); wrap.appendChild(row);
    }
    paint();
  }
  function paint(){
    rows().forEach((r,i)=>{
      r.style.display = (i+1) <= totalBars ? 'grid' : 'none';
      r.classList.remove('row-active','row-dim','row-done');
      r.classList.add(i+1 === currentTurn ? 'row-active' : 'row-dim');
    });
    if(!running) fills().forEach((f,i)=>f.style.width = (i+1 < currentTurn) ? '0%' : '100%');
  }
  function tick(){
    if(!running) return;
    const elapsed = elapsedBefore + performance.now() - startTime;
    upd(durationMs - elapsed);
    const f = fills()[currentTurn-1];
    if(f) f.style.width = `${Math.max(0, 100 - (elapsed/durationMs)*100)}%`;
    if(elapsed >= durationMs){
      const r = rows()[currentTurn-1];
      if(r){ r.classList.remove('row-active'); r.classList.add('row-done','row-dim'); if(f) f.style.width = '0%'; }
      if(currentTurn < totalBars){
        safePlay(turnS); currentTurn++;
        rows()[currentTurn-1].classList.replace('row-dim','row-active');
        startTime = performance.now(); elapsedBefore = 0; rafId = requestAnimationFrame(tick);
      } else { safePlay(finalS); running = false; el.classList.add('timer-pulsate'); rafId = null; }
    } else rafId = requestAnimationFrame(tick);
  }
  function start(){
    if(running) return;
    if(el.classList.contains('timer-pulsate')) reset();
    running = true; el.classList.remove('timer-pulsate');
    rows().forEach((r,i)=>r.classList.toggle('row-active', i+1 === currentTurn));
    startTime = performance.now(); rafId = requestAnimationFrame(tick);
  }
  function pause(){ if(!running) return; running = false; if(rafId){ cancelAnimationFrame(rafId); rafId = null; } elapsedBefore += performance.now() - startTime; }
  function reset(){ if(rafId) cancelAnimationFrame(rafId); running = false; elapsedBefore = 0; totalBars = 6; currentTurn = 1; build(); upd(durationMs); el.classList.remove('timer-pulsate'); stopAllSounds(); }
  function setDuration(sec){ durationMs = sec*1000; store.set('bar.duration', sec); if(!running && elapsedBefore === 0) upd(durationMs); }
  wrap.addEventListener('click', e=>{
    const b = e.target.closest('.count-btn'); if(!b || running) return;
    totalBars = +b.dataset.value; currentTurn = 1; elapsedBefore = 0; el.classList.remove('timer-pulsate'); build(); upd(durationMs);
  });
  pane.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b || b.classList.contains('count-btn')) return;
    if(b.dataset.m != null) return setDuration((+b.dataset.m)*60 + (+b.dataset.s));
    const a = b.dataset.act;
    if(a==='start') start(); else if(a==='pause') pause(); else if(a==='reset') reset();
    else if(a==='add'){ durationMs += 15000; upd(durationMs - elapsedBefore - (running ? performance.now() - startTime : 0)); }
    else if(a==='set'){ const r = strictMMSS($('#barCustom').value); if(r.err) flashErr($('#barErr'), r.err); else setDuration(r.sec); }
  });
  $('#barCustom').addEventListener('keydown', e=>{ if(e.key==='Enter') pane.querySelector('[data-act=set]').click(); });
  build(); upd(durationMs);
  return { start, pause, reset, toggle(){ running ? pause() : start(); }, running:()=>running };
})();

/* =====================================================================
   ROUTINES — a chain of named timed steps
   ===================================================================== */
const STARTER_ROUTINES = {
  'Lesson block': [['Warm-up',300],['Mini-lesson',600],['Work time',1200],['Clean up',180],['Exit ticket',300]],
  'Four centers': [['Center 1',720],['Rotate',60],['Center 2',720],['Rotate',60],['Center 3',720],['Rotate',60],['Center 4',720]],
  'Think-pair-share': [['Think',60],['Pair',120],['Share',180]],
  'Morning routine': [['Unpack',300],['Bell work',600],['Morning meeting',900]],
  'Focus sprints': [['Focus',1500],['Break',300]],
  'Partner talk': [['Partner A talks',60],['Partner B talks',60]],
  'Stations': [['Station',600],['Rotate',60]],
  'PE circuit': [['Move',45],['Switch',15]]
};
/* Starters that repeat (everything else runs once) */
const STARTER_REPEAT = {'Focus sprints':4, 'Partner talk':2, 'Stations':4, 'PE circuit':8};
const Routines = (()=>{
  const pane = $('#pane-routines'), elT = $('#rTimer'), elName = $('#rName'), elEnds = $('#rEnds'), prog = $('#rProg'), rowsEl = $('#rSteps');
  const C = 2*Math.PI*92; prog.style.strokeDasharray = C;
  const BELL = '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  const CHECK = '<svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>';
  const toSteps = arr => arr.map(([name,sec])=>({name,sec}));
  const hadSaved = !!store.get('routine.current', null);
  let steps = store.get('routine.current', null) || toSteps(STARTER_ROUTINES['Lesson block']);
  let rname = store.get('routine.name', hadSaved ? 'My routine' : 'Lesson block');
  let saved = store.get('routine.saved', {});
  let auto = store.get('routine.auto', true), repeat = store.get('routine.repeat', 1);
  let idx = 0, round = 1, remaining = (steps[0]?.sec||0)*1000, endTime = 0, running = false, iv = null, done = false;
  const clockAt = ms => { const d = new Date(Date.now() + ms); let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(d.getMinutes()).padStart(2,'0')} ${ap}`; };
  const total = () => steps.reduce((a,s)=>a + s.sec, 0);
  const durTxt = sec => sec >= 3600 ? `${Math.floor(sec/3600)} hr ${Math.round(sec%3600/60)} min` : sec >= 60 ? `${Math.round(sec/60)} min` : `${sec} sec`;
  function msLeftInRoutine(){
    let ms = remaining;
    for(let k = idx + 1; k < steps.length; k++) ms += steps[k].sec*1000;
    return ms + (repeat - round) * total() * 1000;
  }

  /* ----- Ring + time (updated every tick) ----- */
  function renderTime(){
    const cur = steps[Math.min(idx, steps.length - 1)];
    elT.textContent = fmtMs(remaining);
    const frac = done || !cur ? 0 : Math.max(0, Math.min(1, remaining / (cur.sec*1000)));
    prog.style.strokeDashoffset = C * (1 - frac);
    const roundTxt = repeat > 1 ? ` · Round ${Math.min(round, repeat)} of ${repeat}` : '';
    if(done) elEnds.textContent = 'Routine complete';
    else if(running) elEnds.innerHTML = BELL + `<span>${clockAt(remaining)}${roundTxt}</span>`;
    else if(cur && remaining < cur.sec*1000) elEnds.textContent = 'Paused' + roundTxt;
    else elEnds.textContent = steps.length ? `Step ${idx + 1} of ${steps.length}${roundTxt}` : '';
    $('#rFoot').innerHTML = steps.length
      ? `<span>${running ? 'Routine ends ' + clockAt(msLeftInRoutine()) : (auto ? 'Auto-advance on' : 'Auto-advance off')}</span><span>${repeat > 1 ? `Round ${Math.min(round, repeat)} of ${repeat}` : ''}</span>` : '';
  }
  /* ----- Everything else (on step changes) ----- */
  function render(){
    if(!steps.length){
      elName.textContent = 'Add a step to begin'; elT.textContent = '0:00'; prog.style.strokeDashoffset = C; elEnds.textContent = '';
      rowsEl.innerHTML = '<div class="rl-empty">This routine has no steps. Press Edit to add some.</div>';
      $('#rTitle').textContent = rname; $('#rSub').textContent = ''; $('#rFoot').innerHTML = ''; setGo(); return;
    }
    const cur = steps[Math.min(idx, steps.length - 1)];
    elName.textContent = done ? 'All done' : cur.name;
    $('#rTitle').textContent = rname;
    $('#rSub').textContent = `${steps.length} step${steps.length > 1 ? 's' : ''} · ${durTxt(total())}` + (repeat > 1 ? ` · ${repeat} rounds` : '');
    rowsEl.innerHTML = '';
    steps.forEach((s,k)=>{
      const r = document.createElement('div');
      const isDone = done || k < idx, isCur = !done && k === idx;
      r.className = 'rl-row' + (isDone ? ' done' : '') + (isCur ? ' cur' : '') + (isCur && running ? ' running' : '');
      r.dataset.i = k; r.setAttribute('role','button'); r.tabIndex = 0;
      r.innerHTML = `<span class="rl-dot">${isDone ? CHECK : ''}</span><span class="rl-name"></span><span class="rl-dur">${fmt(s.sec)}</span>`;
      r.querySelector('.rl-name').textContent = s.name;
      rowsEl.appendChild(r);
    });
    setGo(); renderTime();
  }
  function setGo(){
    const b = $('#rGo'), cur = steps[idx];
    b.classList.toggle('pause', running); b.classList.toggle('go', !running);
    b.textContent = running ? 'Pause' : done ? 'Restart' : (cur && remaining < cur.sec*1000) ? 'Resume' : 'Start';
  }

  /* ----- Timing ----- */
  function tick(){
    if(!running) return;
    remaining = endTime - Date.now();
    if(remaining <= 0) stepDone(); else renderTime();
  }
  function stepDone(){
    const more = idx < steps.length - 1 || round < repeat;
    if(more){
      if(idx < steps.length - 1) idx++; else { idx = 0; round++; }
      safePlay(turnS); remaining = steps[idx].sec*1000;
      elName.classList.remove('flash'); void elName.offsetWidth; elName.classList.add('flash');
      if(auto) endTime = Date.now() + remaining;
      else { running = false; clearInterval(iv); iv = null; }
    } else {
      running = false; clearInterval(iv); iv = null; remaining = 0; done = true;
      elT.classList.add('glow'); playThemeEnd();
    }
    render();
  }
  function start(){
    if(running || !steps.length) return;
    if(done) reset();
    running = true; endTime = Date.now() + remaining; elT.classList.remove('glow');
    iv = setInterval(tick, 200); render();
  }
  function pause(){ if(!running) return; running = false; clearInterval(iv); iv = null; remaining = endTime - Date.now(); render(); }
  function reset(){ running = false; clearInterval(iv); iv = null; idx = 0; round = 1; done = false; remaining = (steps[0]?.sec||0)*1000; elT.classList.remove('glow'); stopThemeSounds(); render(); }
  function jump(k){
    if(k < 0 || k >= steps.length) return;
    const was = running; if(running){ running = false; clearInterval(iv); iv = null; }
    done = false; elT.classList.remove('glow'); stopThemeSounds();
    idx = k; remaining = steps[k].sec*1000; render(); if(was) start();
  }
  function add(){ if(done || !steps.length) return; remaining += 30000; if(running) endTime += 30000; renderTime(); }

  pane.addEventListener('click', e=>{
    const row = e.target.closest('.rl-row'); if(row) return jump(+row.dataset.i);
    const b = e.target.closest('button[data-act]'); if(!b) return;
    ({toggle:()=> running ? pause() : start(), reset, add, next:()=>jump(idx + 1), prev:()=>jump(idx - 1)})[b.dataset.act]?.();
  });
  rowsEl.addEventListener('keydown', e=>{ const row = e.target.closest('.rl-row'); if(row && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.stopPropagation(); jump(+row.dataset.i); } });

  /* ----- Edit Routine sheet ----- */
  const wrap = $('#rSheetWrap'), msg = $('#rsMsg');
  let draft = null;
  function say(t, isErr){ msg.textContent = t; msg.classList.toggle('err', !!isErr); clearTimeout(say._t); if(t) say._t = setTimeout(()=>msg.textContent = '', 3500); }
  function renderSheet(){
    $('#rsName').value = draft.name;
    $('#rsAuto').setAttribute('aria-checked', draft.auto);
    $('#rsRepeat').value = String(draft.repeat);
    const box = $('#rsSteps'); box.innerHTML = '';
    draft.steps.forEach((st,k)=>{
      const r = document.createElement('div'); r.className = 'rs-step';
      r.innerHTML = `<button class="rs-del" type="button" aria-label="Delete step"></button>
        <input class="rs-n" type="text" maxlength="40" aria-label="Step name">
        <input class="rs-t" type="text" inputmode="numeric" aria-label="Step time">
        <span class="rs-mv"><button type="button" data-mv="-1" aria-label="Move up">↑</button><button type="button" data-mv="1" aria-label="Move down">↓</button></span>`;
      const [n, t] = $$('input', r);
      n.value = st.name; t.value = fmt(st.sec);
      n.oninput = () => { st.name = n.value; };
      t.onchange = () => { const sec = parseTime(t.value); if(sec == null || sec <= 0){ say('Type a time like 5, 5:00, or :45.', true); t.value = fmt(st.sec); return; } st.sec = sec; t.value = fmt(sec); };
      r.querySelector('.rs-del').onclick = () => { draft.steps.splice(k,1); renderSheet(); };
      $$('[data-mv]', r).forEach(b=>b.onclick = ()=>{ const m = k + (+b.dataset.mv); if(m < 0 || m >= draft.steps.length) return; [draft.steps[k], draft.steps[m]] = [draft.steps[m], draft.steps[k]]; renderSheet(); });
      box.appendChild(r);
    });
    const add = document.createElement('button'); add.type = 'button'; add.className = 'rs-add';
    add.innerHTML = '<span class="plus"></span>Add Step';
    add.onclick = () => { draft.steps.push({name:`Step ${draft.steps.length + 1}`, sec:300}); renderSheet(); const ins = $$('#rsSteps .rs-n'); const last = ins[ins.length - 1]; last.focus(); last.select(); };
    box.appendChild(add);
    /* Library: your routines, then starters */
    const lib = $('#rsLib'); lib.innerHTML = '';
    const row = (name, sub, onLoad, onDel) => {
      const r = document.createElement('div'); r.className = 'as-row click rs-lib'; r.setAttribute('role','button'); r.tabIndex = 0;
      r.innerHTML = `${onDel ? '<button class="rs-del" type="button" aria-label="Delete saved routine"></button>' : ''}<span class="grow1"><span class="nm"></span><small>${sub}</small></span><svg class="chev" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5"/></svg>`;
      r.querySelector('.nm').textContent = name;
      r.onclick = e => { if(e.target.closest('.rs-del')) return; onLoad(); };
      r.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); onLoad(); } };
      if(onDel) r.querySelector('.rs-del').onclick = e => { e.stopPropagation(); onDel(); };
      lib.appendChild(r);
    };
    Object.keys(saved).forEach(name=>{
      const v = saved[name], st = Array.isArray(v) ? v : v.steps, rp = Array.isArray(v) ? 1 : (v.repeat || 1);
      row(name, `My routine · ${st.length} steps${rp > 1 ? ` · ${rp} rounds` : ''}`,
        () => { draft = {name, steps: st.map(x=>({...x})), auto: draft.auto, repeat: rp}; renderSheet(); say(`Loaded ${name}. Press Done to use it.`); },
        () => { delete saved[name]; store.set('routine.saved', saved); renderSheet(); say(`Deleted ${name}.`); });
    });
    Object.keys(STARTER_ROUTINES).forEach(name=>{
      const st = STARTER_ROUTINES[name], rp = STARTER_REPEAT[name] || 1;
      row(name, `Starter · ${st.length} steps${rp > 1 ? ` · ${rp} rounds` : ''}`,
        () => { draft = {name, steps: toSteps(st), auto: draft.auto, repeat: rp}; renderSheet(); say(`Loaded ${name}. Press Done to use it.`); });
    });
  }
  function openSheet(){
    draft = {name: rname, steps: steps.map(s=>({...s})), auto, repeat};
    msg.textContent = ''; renderSheet(); wrap.classList.add('show');
    setTimeout(()=>$('#rsName').focus({preventScroll:true}), 50);
  }
  function closeSheet(){ wrap.classList.remove('show'); draft = null; }
  $('#rEditBtn').onclick = openSheet;
  $('#rsCancel').onclick = closeSheet;
  wrap.addEventListener('pointerdown', e=>{ if(e.target === wrap) closeSheet(); });
  $('#rsName').oninput = e => { draft.name = e.target.value; };
  $('#rsAuto').onclick = () => { draft.auto = !draft.auto; $('#rsAuto').setAttribute('aria-checked', draft.auto); };
  $('#rsRepeat').onchange = e => { draft.repeat = +e.target.value; };
  $('#rsSave').onclick = () => {
    const name = draft.name.trim();
    if(!name) return say('Give the routine a name first.', true);
    if(!draft.steps.length) return say('Add at least one step first.', true);
    saved[name] = {steps: draft.steps.map(x=>({name: x.name.trim() || 'Step', sec: x.sec})), repeat: draft.repeat};
    store.set('routine.saved', saved); renderSheet(); say(`Saved ${name} to My Routines.`);
  };
  $('#rsDone').onclick = () => {
    if(!draft.steps.length) return say('Add at least one step first.', true);
    steps = draft.steps.map(x=>({name: x.name.trim() || 'Step', sec: x.sec}));
    rname = draft.name.trim() || 'My routine'; auto = draft.auto; repeat = draft.repeat;
    store.set('routine.current', steps); store.set('routine.name', rname); store.set('routine.auto', auto); store.set('routine.repeat', repeat);
    closeSheet(); reset();
  };

  render();
  return { start, pause, reset, toggle(){ running ? pause() : start(); }, running:()=>running,
           sheetOpen:()=>wrap.classList.contains('show'), closeSheet };
})();

const Alarm = (()=>{

        <button class="switch" type="button" role="switch" aria-checked="${a.on}" aria-label="Alarm on"></button>
        <svg class="al-chev" viewBox="0 0 20 20"><path d="M8 5l5 5-5 5"/></svg>`;
      const sub = r.querySelector('.al-sub'), rep = repeatText(a.days);
      sub.textContent = (a.label || 'Alarm') + (rep ? ', ' + rep : '');
      if(a.snoozeAt){ const sn = document.createElement('span'); sn.className = 'snz'; sn.textContent = ' · Snoozed until ' + fmtClock(a.snoozeAt); sub.appendChild(sn); }

  function minutesUntil(a, now){

      if(a.snoozeAt && Date.now() >= a.snoozeAt){ a.snoozeAt = null; save(); ring(a); }

  $('#ringSnooze').onclick = snooze;

  /* ----- Scroll-wheel time picker ----- */
  const ROW = 36;
  const cols = {h:$('#wH'), m:$('#wM'), p:$('#wP')};
  const values = {h:[...Array(12)].map((_,i)=>String(i+1)), m:[...Array(60)].map((_,i)=>String(i).padStart(2,'0')), p:['AM','PM']};
  for(const k in cols){
    const col = cols[k];
    values[k].forEach((v,i)=>{ const d = document.createElement('div'); d.textContent = v; d.setAttribute('role','option'); d.onclick = () => setIdx(k, i, true); col.appendChild(d); });

    col.addEventListener('keydown', e=>{

    });

  function getIdx(k){ return Math.max(0, Math.min(values[k].length - 1, Math.round(cols[k].scrollTop / ROW))); }
  function setIdx(k, i, smooth){
    i = Math.max(0, Math.min(values[k].length - 1, i));

  /* ----- Add / edit sheet ----- */
  function renderDraft(){

  function closeSheet(){ wrap.classList.remove('show'); editing = null; draft = null; try{ prevS.pause(); }catch(e){} }
  $('#aAddBtn').onclick = () => openSheet(null);
  $('#aEdit').onclick = () => { editMode = !editMode; renderList(); };
  $('#asCancel').onclick = closeSheet;
  wrap.addEventListener('pointerdown', e=>{ if(e.target === wrap) closeSheet(); });
  $$('#asDays button').forEach(b=>b.onclick = ()=>{ const d = +b.dataset.d; draft.days = draft.days.includes(d) ? draft.days.filter(x=>x!==d) : [...draft.days, d]; renderDraft(); });

/* =====================================================================
   STOPWATCH
   ===================================================================== */
const Stopwatch = (()=>{
  const el = $('#swTimer'), pane = $('#pane-stopwatch'), lapsEl = $('#swLaps');
  let acc = 0, startAt = 0, running = false, iv = null, laps = [];
  const now = () => acc + (running ? performance.now() - startAt : 0);
  const f = ms => { const t = Math.floor(ms/100), d = t % 10, s = Math.floor(t/10); return fmt(s) + '.' + d; };
  const upd = () => el.textContent = f(now());
  function start(){ if(running) return; running = true; startAt = performance.now(); el.classList.add('running'); iv = setInterval(upd, 50); }
  function pause(){ if(!running) return; acc = now(); running = false; clearInterval(iv); el.classList.remove('running'); upd(); }
  function reset(){ pause(); acc = 0; laps = []; renderLaps(); upd(); }
  function lap(){ const t = now(); if(!t) return; const prev = laps.length ? laps[laps.length-1].total : 0; laps.push({total:t, split:t-prev}); renderLaps(); }
  function renderLaps(){
    lapsEl.hidden = !laps.length; lapsEl.innerHTML = '';
    laps.slice().reverse().forEach((l,i)=>{
      const r = document.createElement('div'); r.className = 'lap';
      r.innerHTML = `<span>Lap ${laps.length - i}</span><span>${f(l.split)}</span><span class="tot">${f(l.total)}</span>`;
      lapsEl.appendChild(r);
    });
  }
  pane.addEventListener('click', e=>{
    const b = e.target.closest('button[data-act]'); if(!b) return;
    ({start, pause, reset, lap})[b.dataset.act]?.();
  });
  upd();
  return { start, pause, reset, toggle(){ running ? pause() : start(); }, running:()=>running };
})();

  if(Alarm.sheetOpen()){ if(e.key === 'Escape') Alarm.closeSheet(); return; }
  if(Routines.sheetOpen()){ if(e.key === 'Escape') Routines.closeSheet(); return; }

  if(e.target.closest('input,textarea,select')) return;

function ytParse(link){
  try{
    const u = new URL(String(link).trim());
    if(!/(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com)$/.test(u.hostname)) return null;
    const list = u.searchParams.get('list');
    if(list) return {kind:'list', id:list};
    let v = u.searchParams.get('v');
    const parts = u.pathname.split('/').filter(Boolean);
    if(!v && u.hostname.endsWith('youtu.be')) v = parts[0];
    if(!v && ['embed','shorts','live'].includes(parts[0])) v = parts[1];
    return v ? {kind:'video', id:v} : null;
  }catch(e){ return null; }
}

  if(yt && ytReady){
    try{
      const d = yt.getVideoData() || {};
      if(d.title) song = d.title;
      const pl = yt.getPlaylist && yt.getPlaylist();
      if(l.kind === 'list') sub = l.name + (pl && pl.length ? ` · ${yt.getPlaylistIndex() + 1} of ${pl.length}` : '');

    }catch(e){}

function loadYT(cb){
  if(window.YT && YT.Player) return cb();

function makePlayer(){
  const l = curList();
  const vars = {playsinline:1, rel:0};
  if(l.kind === 'list'){ vars.listType = 'playlist'; vars.list = l.id; }
  const opts = {
    host:'https://www.youtube-nocookie.com', width:'100%', height:'100%', playerVars: vars,
    events:{
      onReady: () => { ytReady = true; yt.setVolume(mVol); renderBar(); if(wantPlay) yt.playVideo(); },
      onStateChange: e => {
        if(e.data === 1){ mPlaying = true; wantPlay = false; setDrop(true); clearTimeout(startT); mbMsg(''); }
        else if(e.data === 2 || e.data === 0){ mPlaying = false; if(!wantPlay) setDrop(false); }
        renderBar();
      },
      onError: () => { mPlaying = false; wantPlay = false; renderBar(); mbMsg('That video or playlist can’t be played here. Try another link.', 6000); }
    }
  };
  /* Only pass videoId for single videos: YouTube now rejects an empty videoId ("Invalid video id") and the player never starts */
  if(l.kind === 'video') opts.videoId = l.id;
  yt = new YT.Player('ytHost', opts);
}
function musicPlay(){
  wantPlay = true; setDrop(true);
  clearTimeout(startT);
  /* Some browsers (iPad Safari) need the first press inside the video itself */
  startT = setTimeout(()=>{ if(!mPlaying && wantPlay) mbMsg('Press play in the video to start.', 0); }, 3000);
  if(!yt) loadYT(makePlayer);
  else if(ytReady) yt.playVideo();
}
function musicPause(){
  wantPlay = false; clearTimeout(startT); mbMsg('');
  if(yt && ytReady) yt.pauseVideo();
  mPlaying = false; setDrop(false); renderBar();
}
function switchList(key){
  curKey = key; store.set('musicCur', key);
  const l = curList(), go = mPlaying || wantPlay;
  if(yt && ytReady){
    if(l.kind === 'list') yt[go ? 'loadPlaylist' : 'cuePlaylist']({list:l.id, listType:'playlist'});
    else yt[go ? 'loadVideoById' : 'cueVideoById'](l.id);
  }
  $('#mbThumb').hidden = true; renderBar(); setTimeout(renderBar, 1200);
}
function setMusic(open){
  if(!open && (mPlaying || wantPlay)) musicPause();
  mbar.classList.toggle('open', open); mbar.setAttribute('aria-hidden', !open);
  $('#musicBtn').setAttribute('aria-pressed', open);
  if(!open) closeMbPops();
  syncVideoRoom();
}
function closeMbPops(){ ['#mbVolPop','#mbListPop'].forEach(s=>$(s).hidden = true); $('#mbVolB').setAttribute('aria-expanded', false); $('#mbListB').setAttribute('aria-expanded', false); $('#mbForm').hidden = true; }
function togglePop(which){
  const pop = $(which === 'vol' ? '#mbVolPop' : '#mbListPop'), btn = $(which === 'vol' ? '#mbVolB' : '#mbListB');
  const show = pop.hidden; closeMbPops(); pop.hidden = !show; btn.setAttribute('aria-expanded', show);
  if(show && which === 'list') renderRows();
}
function renderRows(){
  const box = $('#mbRows'); box.innerHTML = '';
  allLists().forEach(l=>{
    const r = document.createElement('div'); r.className = 'mb-row'; r.setAttribute('role','button'); r.tabIndex = 0;
    const on = keyOf(l) === curKey;
    r.innerHTML = `<span class="chk">${on ? '<svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>' : '<svg viewBox="0 0 20 20"></svg>'}</span>
      <span class="nm"><b></b><small>${l.builtin ? 'Built in' : (l.kind === 'list' ? 'Your playlist' : 'Your video')}</small></span>`;
    r.querySelector('b').textContent = l.name;
    if(!l.builtin){
      const x = document.createElement('button'); x.className = 'mb-x'; x.type = 'button'; x.title = 'Remove'; x.setAttribute('aria-label','Remove ' + l.name);
      x.innerHTML = '<svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></svg>';
      x.onclick = ev => { ev.stopPropagation(); userLists = userLists.filter(u => u !== l); store.set('musicLists', userLists); if(on) switchList(keyOf(MUSIC_BUILTIN[0])); renderRows(); };
      r.appendChild(x);
    }
    r.onclick = () => { switchList(keyOf(l)); renderRows(); };
    r.onkeydown = e => { if(e.key === 'Enter') r.click(); };
    box.appendChild(r);
  });
}
/* One tap: opening Music from the dock starts the last playlist used (the built-in Classroom list the first time) */
/* Start loading YouTube as soon as the pointer reaches the Music button, so playback starts sooner */
$('#musicBtn').addEventListener('pointerenter', ()=>{ if(!window.YT) loadYT(()=>{}); });
/* Opening Music gets the last playlist used (Classroom the first time) loaded and ready, without playing it,
   so the teacher can switch playlists first; pressing Play then starts right away */
$('#musicBtn').onclick = () => { const open = !mbar.classList.contains('open'); setMusic(open); if(open && !yt) loadYT(makePlayer); };
$('#mbClose').onclick = () => setMusic(false);
$('#mbPlay').onclick = () => (mPlaying || wantPlay) ? musicPause() : musicPlay();
$('#mbPrev').onclick = () => { if(yt && ytReady) yt.previousVideo(); };
$('#mbNext').onclick = () => { if(yt && ytReady) yt.nextVideo(); };
$('#mbVolB').onclick = () => togglePop('vol');
$('#mbListB').onclick = () => togglePop('list');
$('#mbVol').value = mVol; $('#mbVolOut').textContent = mVol;
$('#mbVol').oninput = e => { mVol = Math.round(+e.target.value); $('#mbVolOut').textContent = mVol; store.set('musicVol', mVol); if(yt && ytReady) yt.setVolume(mVol); };
$('#mbAddRow').onclick = () => { const f = $('#mbForm'); f.hidden = !f.hidden; if(!f.hidden) $('#mbUrl').focus(); };
$('#mbAddRow').onkeydown = e => { if(e.key === 'Enter') $('#mbAddRow').click(); };
$('#mbForm').addEventListener('submit', e=>{
  e.preventDefault();
  const p = ytParse($('#mbUrl').value);
  if(!p){ mbMsg('Paste a YouTube link, like youtube.com/playlist?list=… or youtu.be/…'); return; }
  if(allLists().some(l => keyOf(l) === keyOf(p))){ switchList(keyOf(p)); renderRows(); $('#mbForm').hidden = true; return; }
  const name = $('#mbName').value.trim() || (p.kind === 'list' ? 'My playlist' : 'My video');
  userLists.push({kind:p.kind, id:p.id, name}); store.set('musicLists', userLists);
  $('#mbUrl').value = ''; $('#mbName').value = ''; $('#mbForm').hidden = true;
  switchList(keyOf(p)); renderRows(); mbMsg(`Added ${name}.`, 2500);
});
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.mb-pop,#mbVolB,#mbListB')) closeMbPops(); });
renderBar();

/* =====================================================================
   DOCK — opened from the stacks button in the top-right corner.
   Mouse: point at the button and the dock drops down; it tucks away when
          you move off it. Touch: tap the button. Pin keeps it open.
   Themes takes over the dock at double width. D toggles the dock.
   ===================================================================== */
const vdock = $('#vdock'), corner = $('#cornerBtn');
let dockPinned = store.get('dockPinned', false), dockT = null;

let dockOpenedAt = 0;
function setDock(open){
  if(open && !vdock.classList.contains('open')) dockOpenedAt = Date.now();
  clearTimeout(dockT); dockT = null;
  vdock.classList.toggle('open', open);
  document.body.classList.toggle('dock-open', open);
  corner.classList.toggle('active', open); corner.setAttribute('aria-expanded', open);
  if(!open) openDrawer(false);
}
function openDock(){ if(!vdock.classList.contains('open')) setDock(true); else { clearTimeout(dockT); dockT = null; } }
function hideDockSoon(ms = 1200){
  if(dockPinned || dockT || Tour.active()) return;
  dockT = setTimeout(()=>{
    dockT = null;
    const keep = vdock.matches(':hover') || corner.matches(':hover') ||
      (vdock.contains(document.activeElement) && document.activeElement.matches(':focus-visible'));
    if(keep) hideDockSoon(800); else if(!dockPinned) setDock(false);
  }, ms);
}
function peekDock(ms = 1800){ openDock(); hideDockSoon(ms); }
function setPinned(v){
  dockPinned = v; store.set('dockPinned', v);
  const b = $('#pinBtn'); b.setAttribute('aria-pressed', v);
  b.title = v ? 'Let the dock hide' : 'Keep the dock open'; b.setAttribute('aria-label', b.title);
  if(v) openDock(); else hideDockSoon(1000);
}
function closeTools(){ if(dockPinned) openDrawer(false); else setDock(false); }
function toggleTools(){
  if(dockPinned) setPinned(false);
  else if(vdock.classList.contains('open')) setDock(false);
  else { openDock(); hideDockSoon(5000); }
}
$('#pinBtn').onclick = () => setPinned(!dockPinned);

corner.addEventListener('pointerenter', e=>{ if(e.pointerType === 'mouse') openDock(); });
corner.addEventListener('pointerleave', e=>{ if(e.pointerType === 'mouse') hideDockSoon(); });
vdock.addEventListener('pointerleave', e=>{ if(e.pointerType === 'mouse') hideDockSoon(drawer.classList.contains('open') ? 1800 : 1200); });
vdock.addEventListener('pointerenter', ()=>{ clearTimeout(dockT); dockT = null; });
/* Click the stack button: opens the dock, or closes it when it's already open.
   (A click right after pointing at the button keeps the dock open, since pointing opened it.) */
corner.addEventListener('click', ()=>{
  const touch = matchMedia('(hover: none)').matches;
  if(vdock.classList.contains('open') && (touch || Date.now() - dockOpenedAt > 600)){
    if(dockPinned){ dockPinned = false; store.set('dockPinned', false); $('#pinBtn').setAttribute('aria-pressed', false); }
    return setDock(false);
  }
  openDock(); if(touch) hideDockSoon(5000);
});
/* Clicking or tapping anywhere else closes the dock */
document.addEventListener('pointerdown', e=>{
  if(e.target.closest('#cornerBtn,#vdock,#tour')) return;
  if(vdock.classList.contains('open')) closeTools();
});
/* Touch: picking a tool tucks the dock away after a moment (not while choosing a theme) */
vdock.addEventListener('click', e=>{
  if(!e.target.closest('button') || dockPinned || e.target.closest('#drawer,#themeBtn')) return;
  if(matchMedia('(hover: none)').matches){ clearTimeout(dockT); dockT = null; hideDockSoon(2000); }
});
$('#pinBtn').setAttribute('aria-pressed', dockPinned);

/* =====================================================================
   BACKGROUND PREVIEW — drag any image or video file onto the page to see the
   current theme's styling over it. Nothing is saved; pick a theme to go back.
   ===================================================================== */
let previewURL = null;
function toast(msg, ms = 3500){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), ms); }
function previewBackground(file){
  if(!file || !/^(image|video)\//.test(file.type)) return toast('Drop an image or video file.');
  if(previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(file);
  bgPh.style.backgroundImage = 'none';
  if(file.type.startsWith('video/')){
    setBgPicture(null);
    bgVid.setAttribute('src', previewURL); bgVid.style.display = 'block'; bgVid.load(); bgVid.play().catch(()=>{});
  } else {
    bgVid.pause(); bgVid.style.display = 'none'; bgVid.removeAttribute('src');
    setBgPicture(previewURL);
  }
  toast(`Previewing ${file.name} with the ${theme.name} theme. Pick any theme to go back.`, 5000);
}
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragover', e=>{ if(hasFiles(e)){ e.preventDefault(); document.body.classList.add('dropping'); } });
document.addEventListener('dragleave', e=>{ if(!e.relatedTarget) document.body.classList.remove('dropping'); });
document.addEventListener('drop', e=>{
  if(!hasFiles(e)) return; e.preventDefault(); document.body.classList.remove('dropping');
  previewBackground(e.dataTransfer.files[0]);
});

/* Test one known file; if the local images/ folder is missing, switch to the live site */
function checkAssetFolder(){
  if(assetBase === SITE_BASE) return;
  const probe = new Image();
  probe.onerror = () => {
    assetBase = SITE_BASE;
    endS.src = AUD(theme.endSound); warnS.src = AUD(theme.warnSound);
    turnS.src = AUD('TurnAlert.mp3'); finalS.src = AUD('ac-bel-105874.mp3');
    $('#alarmSound').src = AUD(theme.endSound);
    const id = theme.id; theme = null; applyTheme(id);
    if(drawer.classList.contains('open')) renderGrid();
  };
  probe.src = IMG('TIMEr%20Wh%20Logo.png');
}

/* =====================================================================
   GUIDED WALKTHROUGH — runs once on a teacher's first visit, and any time
   from the ? button in the dock (or the ? key). Skip or Esc ends it.
   ===================================================================== */
const noTourParam = new URLSearchParams(location.search).has('notour');
const Tour = (()=>{
  const el = $('#tour'), spot = $('#tourSpot'), tip = $('#tourTip');
  const toStandard = () => { if(paneKey() !== 'standard'){ state.mode = 'timer'; state.type = 'standard'; show(); } };
  const toolsOnly = () => { openDrawer(false); if(!dockPinned) setDock(false); };
  /* Go to a tool (Timer types use mode "timer") and keep the dock out of the way */
  const toTool = key => () => {
    if(paneKey() !== key){ if(['standard','turn','bar'].includes(key)){ state.mode = 'timer'; state.type = key; } else state.mode = key; show(); }
    toolsOnly();
  };
  const TOURS = {};
  TOURS.standard = [
    {title:'Start a timer in one tap', text:'Tap a number to start a timer right away. The numbers are minutes; :15 and :30 are seconds.',
     target:'#stdPresets', before(){ toStandard(); toolsOnly(); }},
    {title:'Need more time?', text:'+30 sec adds 30 seconds, even while the timer is running.',
     target:'#pane-standard [data-act=add]', before(){ toStandard(); toolsOnly(); }},
    {title:'Reset', text:'Stops the alarm sound and puts the time back.',
     target:'#pane-standard [data-act=reset]', before(){ toStandard(); toolsOnly(); }},
    {title:'Any time you want', text:'Type a time like 7:30 in the box, then press Set.',
     target:()=>$('#stdCustom').parentElement, before(){ toStandard(); toolsOnly(); }},
    {title:'All your timers live here', text:'The stack button in the corner opens this dock: Turn, Bar, Routines, Alarm, and Stopwatch. Click the stack again to close it.',
     target:()=>[$('#cornerBtn'), $('#vdock')], side:'left', before(){ openDrawer(false); openDock(); }},
    {title:'Pick a theme', text:'Themes change the background, colors, and sounds. Tap any picture to try it.',
     target:'#vdock', before(){ openDock(); openDrawer(true); }},
    {title:'Music', text:'Play the Classroom playlist, or add your own YouTube playlist link.',
     target:'#musicBtn', side:'left', when:()=>!matchMedia('(max-width:600px)').matches, before(){ openDrawer(false); openDock(); }}
  ];
  /* Short tours for the other tools. Each runs the first time a teacher opens that tool. */
  TOURS.turn = [
    {title:'How many people?', text:'Tap a colored circle to choose how many people take turns, from 1 to 4.', target:'#chipRow', before:toTool('turn')},
    {title:'Time for each turn', text:'Pick how long each turn lasts. Every person gets the same time.', target:'#turnPresets', before:toTool('turn')},
    {title:'Start the turns', text:'Press play. When a turn ends, a sound plays and the next person’s turn starts on its own. +15 sec gives the current turn more time.', target:'#turnControls', before:toTool('turn')},
    {title:'A different length', text:'Type a time like 1:15 in the box, then press Set.', target:()=>$('#turnCustom').parentElement, before:toTool('turn')}
  ];
  TOURS.bar = [
    {title:'One bar per turn', text:'Each bar is one turn; tap a number to choose how many turns, 1–6.', target:'#barsWrap', before:toTool('bar')},
    {title:'Time for each turn', text:'Pick how long each turn lasts, or type a time and press Set.', target:()=>[$('#barPresets'), $('#barCustom').parentElement], before:toTool('bar')},
    {title:'Watch the bars', text:'Press play. The glowing bar shrinks as time runs out, then the next bar starts on its own.', target:()=>$('#pane-bar [data-act=start]').parentElement, before:toTool('bar')}
  ];
  TOURS.routines = [
    {title:'Your routine', text:'A routine is a list of steps, each with its own time. Tap any step to jump to it.', target:'.r-list', before:toTool('routines')},
    {title:'Make it yours', text:'Press Edit to rename steps, change times, add steps, or load a ready-made routine like Stations or a PE circuit.', target:'#rEditBtn', before:toTool('routines')},
    {title:'Run it', text:'Start runs the whole routine, step after step. The arrows skip back or ahead, and +30 adds time to the current step.', target:'.r-ctrls', before:toTool('routines')},
    {title:'See what’s left', text:'The ring shows the time left in this step. While it runs, the bell shows when the step ends.', target:'.r-ring', before:toTool('routines')}
  ];
  TOURS.alarm = [
    {title:'Add an alarm', text:'Press + to add an alarm. Pick a time, the days it repeats, a label, and a sound.', target:'#aAddBtn', before:toTool('alarm')},
    {title:'Your alarms', text:'Turn each alarm on or off with its switch. Tap an alarm to change it, or press Edit to delete one.', target:'#aCard', before:toTool('alarm')},
    {title:'Keep this page open', text:'The next alarm shows here. Alarms ring only while Timer PLUS is open in a tab.', target:'#aNext', before:toTool('alarm')}
  ];
  TOURS.stopwatch = [
    {title:'Count up', text:'Play starts counting up, pause stops it, and Reset puts it back to zero.', target:()=>$('#pane-stopwatch [data-act=start]').parentElement, before:toTool('stopwatch')},
    {title:'Laps', text:'Lap saves the current time to a list without stopping. Handy for timing each group or round.', target:'#pane-stopwatch [data-act=lap]', before:toTool('stopwatch')}
  ];
  const doneKey = k => k === 'standard' ? 'tourDone' : 'tourDone.' + k;
  let STEPS = TOURS.standard, which = 'standard';
  let i = -1, on = false, t = null;
  function rectOf(step){
    let nodes = typeof step.target === 'function' ? step.target() : $(step.target);
    nodes = (Array.isArray(nodes) ? nodes : [nodes]).filter(Boolean);
    if(!nodes.length) return null;
    const rs = nodes.map(n=>n.getBoundingClientRect());
    const left = Math.min(...rs.map(r=>r.left)), top = Math.min(...rs.map(r=>r.top)),
          right = Math.max(...rs.map(r=>r.right)), bottom = Math.max(...rs.map(r=>r.bottom));
    return {left, top, right, bottom, width:right-left, height:bottom-top};
  }
  function place(){
    if(!on) return;
    const r = rectOf(STEPS[i]); if(!r) return;
    const pad = 8, vw = innerWidth, vh = innerHeight;
    Object.assign(spot.style, {left:(r.left - pad)+'px', top:(r.top - pad)+'px', width:(r.width + pad*2)+'px', height:(r.height + pad*2)+'px'});
    const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 16;
    let left, top;
    if(STEPS[i].side === 'left' && r.left - gap - tw > 8){ left = r.left - gap - tw; top = r.top + r.height/2 - th/2; } /* left of the dock */
    else if(r.bottom + gap + th < vh - 8){ top = r.bottom + gap; left = r.left + r.width/2 - tw/2; }       /* below */
    else if(r.top - gap - th > 8){ top = r.top - gap - th; left = r.left + r.width/2 - tw/2; }         /* above */
    else { left = r.left - gap - tw; top = r.top + r.height/2 - th/2; if(left < 8) left = r.right + gap; } /* beside */
    left = Math.max(12, Math.min(vw - tw - 12, left)); top = Math.max(12, Math.min(vh - th - 12, top));
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  function go(n){
    if(n < 0) return;
    if(n >= STEPS.length) return end(true);
    const dir = n >= i ? 1 : -1;
    i = n; const st = STEPS[i];
    st.before && st.before();
    /* Skip a step that doesn't apply on this screen (Music is hidden on phones) */
    if(st.when && !st.when()){ return (n + dir < 0) ? go(n + 1) : go(n + dir); }
    $('#tourTitle').textContent = st.title; $('#tourText').textContent = st.text;
    const visible = STEPS.map(x=>!x.when || x.when());
    const pos = visible.slice(0, i + 1).filter(Boolean).length, count = visible.filter(Boolean).length;
    $('#tourCount').textContent = `${pos} of ${count}`;
    $('#tourBack').hidden = i === 0;
    $('#tourNext').textContent = pos === count ? 'Done' : 'Next';
    clearTimeout(t);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ place(); t = setTimeout(place, 120); }));
    $('#tourNext').focus({preventScroll:true});
  }
  function start(key){
    if(on) return;
    which = TOURS[key] ? key : (TOURS[paneKey()] ? paneKey() : 'standard'); STEPS = TOURS[which]; i = -1;
    if(Alarm.sheetOpen()) Alarm.closeSheet();
    on = true; document.body.classList.add('touring');
    spot.classList.add('jump'); tip.classList.add('jump');           /* first spot appears in place */
    setTimeout(()=>{ spot.classList.remove('jump'); tip.classList.remove('jump'); }, 120);
    el.classList.add('on'); el.setAttribute('aria-hidden', false);
    document.body.classList.remove('idle');
    go(0);
  }
  function end(finished){
    on = false; clearTimeout(t); el.classList.remove('on'); el.setAttribute('aria-hidden', true);
    document.body.classList.remove('touring');
    store.set(doneKey(which), true);
    openDrawer(false); if(!dockPinned) setDock(false);
    if(finished) toast('You can take the tour again from the ? button in the stack.', 4000);
  }
  $('#tourNext').onclick = () => go(i + 1);
  $('#tourBack').onclick = () => go(i - 1);
  $('#tourSkip').onclick = () => end(false);
  $('#tourBtn').onclick = () => start(paneKey());
  addEventListener('resize', ()=>place());
  function key(e){
    if(e.key === 'Escape'){ e.preventDefault(); end(false); }
    else if(e.key === 'ArrowRight' || (e.key === 'Enter' && !e.target.closest('#tourBack,#tourSkip'))){ e.preventDefault(); go(i + 1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); go(i - 1); }
  }
  /* First time a teacher opens a tool, show its tour (not while a timer is running or an alarm is ringing) */
  let autoT = null;
  function maybeAuto(delay = 600){
    clearTimeout(autoT);
    if(on || noTourParam) return;
    autoT = setTimeout(()=>{
      const k = paneKey();
      if(on || !TOURS[k] || store.get(doneKey(k), false)) return;
      if(Object.values(CTRL).some(c=>c.running()) || Alarm.sheetOpen() || document.querySelector('#ringOverlay.show, #rSheetWrap.show')) return;
      start(k);
    }, delay);
  }
  return { start, end, key, maybeAuto, active:()=>on, seen:k=>store.get(doneKey(k), false) };
})();

/* =====================================================================
   Start up: URL first (?mode=timer&type=bar&theme=road), then last used
   ===================================================================== */
(function init(){
  const p = new URLSearchParams(location.search);
  const m = p.get('mode'), t = p.get('type'), th = p.get('theme');
  state.mode = MODES.includes(m) ? m : (MODES.includes(store.get('mode')) ? store.get('mode') : 'timer');
  state.type = TYPES.includes(t) ? t : (TYPES.includes(store.get('type')) ? store.get('type') : 'standard');
  const themeId = THEMES.some(x=>x.id === th) ? th : (THEMES.some(x=>x.id === store.get('theme')) ? store.get('theme') : DEFAULT_THEME);
  applyTheme(themeId);
  checkAssetFolder();
  show();
  const firstVisit = !Tour.seen(paneKey());
  if(dockPinned) setPinned(true);
  else if(!firstVisit) peekDock(2500);
  /* Each tool's tour runs the first time a teacher opens it (?notour turns this off) */
  Tour.maybeAuto(700);
  wake();
})();
</script>
