  purple: "<title>SELECTr Plus<\/title>\n<\!-- Favicons -->\n<link rel=\"icon\" type=\"image/png\" href=\"images/FaviconCircleR.png\">\n<link rel=\"icon\" type=\"image/svg+xml\" href=\"images/FaviconCircleR.svg\">\n<link rel=\"shortcut icon\" href=\"images/FaviconCircleR.ico\" type=\"image/x-icon\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\">\n<style>\n/* Layout: full-bleed dark stage, wheel centered, floating glass dock at bottom, sheets slide in from the right.\n   Deliberately single-theme (dark glass) to match the RobsonEDU tools. */\n:root{\n  --bg:#060509;\n  --glass:rgba(255,255,255,.07);\n  --glass-2:rgba(255,255,255,.12);\n  --glass-3:rgba(255,255,255,.18);\n  --sheet:rgba(17,14,28,.82);\n  --line:rgba(255,255,255,.14);\n  --fg:#f3f5f9;\n  --muted:rgba(232,237,247,.60);\n  --accent:#a99bff;          /* keep in sync with ACCENT in the script */\n  --accent-ink:#120c2c;\n  /* Lilac-to-blue gradient from the reference \"Sign in\" button */\n  --grad:linear-gradient(90deg,#dcbcff 0%,#b29dff 38%,#8a9cff 66%,#5b9bff 100%);\n  /* Hot gradient for highlights, like the Smart Chat card */\n  --grad-hot:linear-gradient(135deg,#c9a9ff 0%,#8a9cff 55%,#5b9bff 100%);\n  --grad-warm:linear-gradient(90deg,#e2c6ff 0%,#b29dff 45%,#6fa6ff 100%);\n  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;\n  --ease:cubic-bezier(.2,.8,.2,1);\n  color-scheme:dark;\n}\n[hidden]{display:none!important}\nhtml,body{height:100%}\nbody{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}\nbutton,select,textarea,input{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n/* Backdrop. On your site, swap these gradients for your photo or video background. */\n.backdrop{position:fixed;inset:0;z-index:0;background:\n  radial-gradient(50% 55% at 8% 18%,rgba(92,40,230,.55) 0,transparent 70%),\n  radial-gradient(45% 50% at 95% 75%,rgba(120,50,255,.50) 0,transparent 70%),\n  radial-gradient(35% 30% at 60% 0%,rgba(40,50,200,.35) 0,transparent 70%),\n  radial-gradient(40% 35% at 40% 105%,rgba(70,30,190,.45) 0,transparent 70%),\n  linear-gradient(#08060f,#050408)}\n\n/* Spin flair: pop colors swirl behind the stage while spinning */\n.spin-aura{position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:0;mix-blend-mode:screen;filter:blur(90px);\n  background:conic-gradient(from var(--ang,0deg) at 50% 58%,rgba(220,188,255,.5),rgba(178,157,255,.55),rgba(120,110,255,.5),rgba(91,155,255,.55),rgba(150,170,255,.45),rgba(220,188,255,.5))}\n@media (prefers-reduced-motion:reduce){.spin-aura{display:none}}\n/* Timer panel (top left) */\n.timer-panel{position:fixed;z-index:22;top:calc(70px + env(safe-area-inset-top,0px));right:20px;width:236px;box-sizing:border-box;padding:14px 14px 14px;border-radius:22px;\n  background:rgba(14,11,26,.72);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);\n  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;\n  animation:tpIn .35s var(--ease)}\n@keyframes tpIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}\n.tp-time{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;text-align:center;font-variant-numeric:tabular-nums;padding:4px 0 2px;\n  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}\n.timer-panel.running .tp-time{background:linear-gradient(180deg,#fff,#efe3ff);-webkit-background-clip:text;background-clip:text}\n.timer-panel.warn .tp-time{background:linear-gradient(135deg,#ffb36 r(--muted)}\n.logo-slot{display:flex;align-items:center;height:40px;text-decoration:none}\n.logo-img{height:40px;width:auto;display:block}\n/* Keep the class chip centered on screen no matter how wide the logo is */\n.topbar .class-chip{position:absolute;left:50%;transform:translateX(-50%);top:calc(17px + env(safe-area-inset-top,0px))}\n.class-chip{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-weight:600;font-size:14px;white-space:nowrap}\n.class-chip:hover{background:var(--glass-2)}\n.class-chip .count{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}\n.class-chip .sample{color:#c7b6ff;font-weight:500}\n.top-right{display:flex;align-items:center;gap:8px}\n.status{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--muted);white-space:nowrap}\n.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}\n.icon-btn:hover{background:var(--glass-2)}\n.icon-btn svg,.dbtn svg{width:20px;height:20px;flex:none}\n\n/* Stage */\n#stage{position:fixed;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(108px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:flex;align-items:center;justify-content:center;z-index:1}\n.wrap{position:relative;flex:none}\n.wrap canvas,.tw canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}\n.glass-disc{position:absolute;inset:6%;border-radius:50%;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);background:rgba(255,255,255,.02);transition:inset .6s var(--ease),border-radius .6s var(--ease)}\n.drum-mode .glass-disc{opacity:0}\n#taskWrap{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px}\n.cap-row{display:flex;align-items:center;gap:8px}\n.task-x{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;transition:color .2s,background .2s,border-color .2s}\n.task-x svg{width:12px;height:12px}\n.task-x:hover{color:var(--accent-ink);border-color:transparent;background:var(--grad)}\n#taskWrap .cap{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}\n#taskWrap .tw{position:relative}\n\n/* Reveal card */\n.reveal{background:rgba(16,12,30,.6)!important;position:absolute;left:50%;top:50%;z-index:5;width:min(80%,660px);transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity .35s ease,transform .55s cubic-bezier(.2,.9,.25,1.15);padding:24px 28px 38px;border-radius:28px;background:rgba(13,15,21,.62);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}\n.reveal.show{opacity:1;transform:translate(-50%,-50%) scale(1)}\n.reveal-eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}\n.reveal-name{font-size:clamp(40px,10vmin,128px);font-weight:800;letter-spacing:-.035em;line-height:1.04;white-space:nowrap;max-width:100%;animation:glow 2.6s ease-in-out infinite;text-wrap:balance}\n.reveal-name.done{font-size:clamp(28px,5vmin,52px);white-space:normal}\n@keyframes glow{0%,100%{text-shadow:0 0 16px rgba(255,255,255,.30),0 0 50px rgba(140,150,255,.25)}50%{text-shadow:0 0 34px rgba(255,255,255,.55),0 0 80px rgba(140,160,255,.5)}}\n.reveal-task{font-size:clamp(18px,3.2vmin,30px);font-weight:700;background:var(--grad-warm); <\/div><\/div>\n    <div class=\"num-result\">\n      <div class=\"reveal-eyebrow\" id=\"numEyebrow\"><\/div>\n      <div id=\"numHint\">Press Space or Spin to pick a number<\/div>\n      <div class=\"reveal-task alt-task\" id=\"numTask\" hidden><\/div>\n    <\/div>\n    <div class=\"num-pick\">\n      <span>Pick from<\/span>\n      <div class=\"seg\" id=\"numSeg\" role=\"group\" aria-label=\"Number range\"><\/div>\n      <div class=\"letter-step\" id=\"letterStep\" hidden role=\"group\" aria-label=\"Letters\">\n        <button type=\"button\" id=\"letterMinus\" aria-label=\"Remove a letter\">\u2212<\/button>\n        <output id=\"letterRange\">A\u2013B<\/output>\n        <button type=\"button\" id=\"letterPlus\" aria-label=\"Add a letter\">+C<\/button>\n      <\/div>\n      <div class=\"num-custom\" id=\"numCustom\" hidden>\n        <input type=\"number\" id=\"numInput\" min=\"2\" max=\"999\" inputmode=\"numeric\" aria-label=\"Highest number\">\n        <button class=\"pill small outline-purple\" id=\"numSet\" type=\"button\" style=\"height:40px\">Set<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n  <section id=\"firstStage\" hidden aria-label=\"Who's first\" style=\"display:flex;flex-direction:column;align-items:center;gap:clamp(26px,5vh,48px);width:100%\">\n    <div class=\"num-wrap\" id=\"firstWrap\"><div class=\"num-card wide\" id=\"firstCard\"><div class=\"num-value phrase idle\" id=\"firstValue\" aria-live=\"polite\">Who goes first?<\/div><\/div><\/div>\n    <div class=\"num-result\">\n      <div class=\"reveal-eyebrow\" id=\"firstEyebrow\"><\/div>\n      <div id=\"firstHint\" style=\"font-size:15px;color:var(--muted);font-weight:500\">Press Space or Spin to pick who goes first<\/div>\n      <div class=\"reveal-task alt-task\" id=\"firstTask\" hidden><\/div>\n    <\/div>\n  <\/section>\n  <section id=\"colorStage\" hidden aria-label=\"Color selector\">\n    <div class=\"orbs\" id=\"orbs\"><\/div>\n    <div class=\"color-result\">\n      <div class=\"reveal-eyebrow\" id=\"colorEyebrow\"><\/div>\n      <div id=\"colorName\" aria-live=\"polite\"><\/div>\n      <div id=\"colorHint\">Press Space or Spin to pick a color<\/div>\n      <div class=\"reveal-task alt-task\" id=\"colorTask\" hidden><\/div>\n    <\/div>\n    <div class=\"count-pick\"><span>How many colors?<\/span><div class=\"seg\" id=\"countSeg\" role=\"group\" aria-label=\"Number of colors\"><\/div><\/div>\n  <\/section>\n<\/main>\n\n<div class=\"hint\" id=\"hint\" hidden>Big class? <b role=\"button\" tabindex=\"0\" id=\"hintDrum\">Try Drum view<\/b> for larger names<\/div>\n\n<nav class=\"dock\" aria-label=\"Controls\">\n  <button class=\"dbtn\" id=\"btnRoster\" type=\"button\" title=\"Roster and attendance (R)\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"7.5\" cy=\"6.5\" r=\"3\"/><path d=\"M2 17c0-3 2.5-5 5.5-5s5.5 2 5.5 5\"/><circle cx=\"14.5\" cy=\"6\" r=\"2.2\"/><path d=\"M14 11c2.4 0 4 1.6 4 4.4\"/><\/svg>\n    <span class=\"lbl\">Roster<\/span>\n  <\/button>\n  <div class=\"seg\" role=\"group\" aria-label=\"View\">\n    <button id=\"modeWheel\" type=\"button\" aria-pressed=\"true\" title=\"Wheel view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"10\" cy=\"10\" r=\"7.5\"/><path d=\"M10 2.5v15M3.5 6.25l13 7.5M3.5 13.75l13-7.5\"/><\/svg><span class=\"lbl\">Wheel<\/span>\n    <\/button>\n    <button id=\"modeDrum\" type=\"button\" aria-pressed=\"false\" title=\"Drum view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"3.5\" y=\"2.5\" width=\"13\" height=\"15\" rx=\"3\"/><path d=\"M6.5 7h7M5.5 10h9M6.5 13h7\"/><\/svg><span class=\"lbl\">Drum<\/span>\n    <\/button>\n    <button id=\"modeNumbers\" type=\"button\" aria-pressed=\"false\" title=\"Numbers view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M7.5 3L6 17M14 3l-1.5 14M3.5 7.5h14M2.5 12.5h14\"/><\/svg><span class=\"lbl\">Numbers<\/span>\n    <\/button>\n    <button id=\"modeFirst\" type=\"button\" aria-pressed=\"false\" title=\"Who's First view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 7.2a3 3 0 115.6 1.5c-.6 1-1.6 1.4-2.2 2.1-.3.4-.4.9-.4 1.5\"/><circle cx=\"10\" cy=\"16\" r=\".4\" fill=\"currentColor\"/><\/svg><span class=\"lbl\">Who's First<\/span>\n    <\/button>\n    <button id=\"modeColors\" type=\"button\" aria-pressed=\"false\" title=\"Colors view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"7\" cy=\"7.5\" r=\"4\"/><circle cx=\"13\" cy=\"7.5\" r=\"4\"/><circle cx=\"10\" cy=\"12.5\" r=\"4\"/><\/svg><span class=\"lbl\">Colors<\/span>\n    <\/button>\n  <\/div>\n  <button class=\"dbtn spin\" id=\"btnSpin\" type=\"button\">Spin<\/button>\n  <button class=\"dbtn\" id=\"btnGroups\" type=\"button\" title=\"Make random groups (G)\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"6\" cy=\"6\" r=\"2.6\"/><circle cx=\"14\" cy=\"6\" r=\"2.6\"/><circle cx=\"6\" cy=\"14\" r=\"2.6\"/><circle cx=\"14\" cy=\"14\" r=\"2.6\"/><\/svg>\n    <span class=\"lbl\">Random Groups<\/span>\n  <\/button>\n  <button class=\"dbtn\" id=\"btnHistory\" type=\"button\" title=\"Who has been called\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"10\" cy=\"10\" r=\"7.5\"/><path d=\"M10 5.5V10l3 2\"/><\/svg>\n    <span class=\"lbl\">History<\/span>\n  <\/button>\n  <button class=\"dbtn\" id=\"btnSettings\" type=\"button\" title=\"Settings\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 6h8M15 6h2M3 14h2M9 14h8\"/><circle cx=\"13\" cy=\"6\" r=\"2\"/><circle cx=\"7\" cy=\"14\" r=\"2\"/><\/svg>\n    <span class=\"lbl\">Settings<\/span>\n  <\/button>\n  <span class=\"sep\" aria-hidden=\"true\"><\/span>\n  <button class=\"dbtn\" id=\"btnThemes\" type=\"button\" title=\"Themes\" aria-label=\"Themes\" aria-haspopup=\"dialog\" aria-expanded=\"false\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 17.5a7.5 7.5 0 1 1 7.5-7.5c0 1.8-1.5 2.9-3.2 2.9h-1.8a1.6 1.6 0 0 0-1.2 2.8 1.1 1.1 0 0 1-1.3 1.8z\"/><circle cx=\"6.3\" cy=\"8.8\" r=\".8\"/><circle cx=\"10\" cy=\"6.2\" r=\".8\"/><circle cx=\"13.7\" cy=\"8.8\" r=\".8\"/><\/svg>\n  <\/button>\n  <button class=\"dbtn\" id=\"btnFS\" type=\"button\" title=\"Full screen (F)\" aria-label=\"Full screen\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5\"/><\/svg>\n  <\/button>\n<\/nav>\n<div class=\"thp\" id=\"thPanel\" role=\"dialog\" aria-label=\"Themes\" aria-hidden=\"true\"><div class=\"thp-head\"><b>Themes<\/b><button class=\"thp-x\" type=\"button\" id=\"thClose\" aria-label=\"Close themes\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/div><div class=\"thp-grid\"><button class=\"thp-pick\" type=\"button\" data-theme=\"purple\" aria-pressed=\"true\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#120c2c,#6b4dff 60%,#5b9bff)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlus.png\"><\/span><span class=\"thp-nm\">Purple<\/span><\/button><button class=\"thp-pick\" type=\"button\" data-theme=\"neon\" aria-pressed=\"false\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#0b0b0c,#a6ff2e 70%,#f2ff8a)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlusNEON.png\"><\/span><span class=\"thp-nm\">Neon<\/span><\/button><button class=\"thp-pick\" type=\"button\" data-theme=\"blue\" aria-pressed=\"false\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#ffffff,#d9e4fb 45%,#3375f3)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlusBlue.png\"><\/span><span class=\"thp-nm\">Light Blue<\/span><\/button><button class=\"thp-pick\" type=\"button\" data-theme=\"sketch\" aria-pressed=\"false\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#fbf5e6,#f6c652 50%,#ad97da)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlusSKETCH.png\"><\/span><span class=\"thp-nm\">Sketchbook<\/span><\/button><\/div><\/div>\n<div id=\"tour\" aria-hidden=\"true\">\n  <div class=\"tour-block\"><\/div>\n  <div class=\"tour-spot\" id=\"tourSpot\"><\/div>\n  <div class=\"tour-tip\" id=\"tourTip\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tourTitle\" aria-describedby=\"tourText\">\n    <h4 id=\"tourTitle\"><\/h4>\n    <p id=\"tourText\"><\/p>\n    <div class=\"tour-foot\">\n      <span class=\"tour-count\" id=\"tourCount\"><\/span>\n      <button type=\"button\" id=\"tourSkip\">Skip<\/button>\n      <button type=\"button\" id=\"tourBack\">Back<\/button>\n      <button type=\"button\" id=\"tourNext\">Next<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- Roster sheet -->\n<aside class=\"sheet\" id=\"sheetRoster\" aria-label=\"Roster\" inert>\n  <header><h2>Roster<\/h2><button class=\"icon-btn\" data-close type=\"button\" aria-label=\"Close\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/header>\n  <div class=\"body\">\n    <div class=\"field\">\n      <h3>Class<\/h3>\n      <div class=\"row\" id=\"classRow\" style=\"flex-wrap:nowrap\">\n        <select class=\"input\" id=\"classSelect\" style=\"flex:1;min-width:0\"><\/select>\n        <button class=\"pill small\" id=\"btnRename\" type=\"button\">Rename<\/button>\n      <\/div>\n      <div id=\"renameRow\" class=\"field\" hidden>\n        <input class=\"input\" id=\"renameInput\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" placeholder=\"Class name, like 3rd Period Science\" aria-label=\"Class name\">\n        <div class=\"row\">\n          <button class=\"pill small primary\" id=\"btnRenameSave\" type=\"button\">Save name<\/button>\n          <button class=\"pill small\" id=\"btnRenameCancel\" type=\"button\">Cancel<\/button>\n        <\/div>\n        <p class=\"note\">Leave it blank to go back to the default name. Your names and history stay with the class.<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Names, one per line<\/h3>\n      <textarea class=\"input\" id=\"rosterText\" spellcheck=\"false\" placeholder=\"Enter names, one per line, or upload a TXT or CSV file.\"><\/textarea>\n      <div class=\"row\">\n        <label for=\"fileInput\" class=\"pill small\" style=\"display:inline-flex;align-items:center;cursor:pointer\">Upload file<\/label>\n        <input type=\"file\" id=\"fileInput\" accept=\".txt,.csv\">\n        <button class=\"pill small primary\" id=\"btnSaveNames\" type=\"button\">Save names<\/button>\n      <\/div>\n      <p class=\"note\">Names save to this browser and are shared with the Name Selector. Keep a backup file of your lists, since clearing browser data removes them.<\/p>\n    <\/div>\n    <div class=\"field\">\n      <div class=\"row\" style=\"justify-content:space-between\">\n        <h3 style=\"margin:0\">Here today<\/h3>\n        <button class=\"pill small\" id=\"btnAllHere\" type=\"button\">Mark all here<\/button>\n      <\/div>\n      <p class=\"note\">Tap a name to mark them absent for this session. Your saved list does not change.<\/p>\n      <div class=\"chips\" id=\"chips\"><\/div>\n    <\/div>\n  <\/div>\n<\/aside>\n\n<\!-- History sheet -->\n<aside class=\"sheet\" id=\"sheetHistory\" aria-label=\"History\" inert>\n  <header><h2>History<\/h2><button class=\"icon-btn\" data-close type=\"button\" aria-label=\"Close\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/header>\n  <div class=\"body\">\n    <div class=\"field\">\n      <h3>Called in the last 7 days<\/h3>\n      <p class=\"note\" id=\"histNote\"><\/p>\n      <div class=\"hist-table\" id=\"histTable\"><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Recent picks<\/h3>\n      <div class=\"recent\" id=\"histRecent\"><\/div>\n    <\/div>\n    <div class=\"row\"><button class=\"pill small\" id=\"btnClearHist\" type=\"button\">Clear history for this class<\/button><\/div>\n  <\/div>\n<\/aside>\n\n<\!-- Settings sheet -->\n<aside class=\"sheet\" id=\"sheetSettings\" aria-label=\"Settings\" inert>\n  <header><h2>Settings<\/h2><button class=\"icon-btn\" data-close type=\"button\" aria-label=\"Close\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/header>\n  <div class=\"body\">\n    <div>\n      <div class=\"toggle-row\"><div><b>No repeat<\/b><span>Picked names leave the wheel until you start a new round.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optNoRepeat\" aria-label=\"No repeat\"><i><\/i><\/label><\/div>\n      <div class=\"toggle-row\"><div><b>Fair mode<\/b><span>Students called less this week get a bigger slice, so their chance is higher. You can see it on the wheel.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optFair\" aria-label=\"Fair mode\"><i><\/i><\/label><\/div>\n      <div class=\"toggle-row\"><div><b>Task Spinner<\/b><span>A small drum picks a role or prompt after each name.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optTask\" aria-label=\"Task Spinner\"><i><\/i><\/label><\/div>\n      <div class=\"toggle-row\"><div><b>Sounds<\/b><span>Peg clicks and the reveal chime.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optSound\" aria-label=\"Sounds\"><i><\/i><\/label><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Text size<\/h3>\n      <div class=\"choice textsize\" role=\"group\" aria-label=\"Text size\" id=\"textSizeChoice\">\n        <button type=\"button\" data-z=\"1\"><b style=\"font-size:13px\">A<\/b><span>Standard<\/span><\/button>\n        <button type=\"button\" data-z=\"1.15\"><b style=\"font-size:16px\">A<\/b><span>Large<\/span><\/button>\n        <button type=\"button\" data-z=\"1.3\"><b style=\"font-size:19px\">A<\/b><span>Larger<\/span><\/button>\n        <button type=\"button\" data-z=\"1.45\"><b style=\"font-size:22px\">A<\/b><span>Largest<\/span><\/button>\n      <\/div>\n      <p class=\"note\">Makes menus, buttons and labels easier to read from the back of the room. Names and numbers on screen stay the same size.<\/p>\n    <\/div>\n    <div class=\"field\">\n      <h3>Suspense<\/h3>\n      <div class=\"choice\" role=\"group\" aria-label=\"Suspense\" id=\"suspenseChoice\">\n        <button type=\"button\" data-s=\"low\"><b>Low<\/b><span>about 3 sec<\/span><\/button>\n        <button type=\"button\" data-s=\"medium\"><b>Medium<\/b><span>about 5 sec<\/span><\/button>\n        <button type=\"button\" data-s=\"high\"><b>High<\/b><span>about 8 sec<\/span><\/button>\n      <\/div>\n      <p class=\"note\">How long the wheel and drum spin before landing. Hard flicks run a little longer.<\/p>\n    <\/div>\n    <div class=\"field\">\n      <h3>Tasks, one per line<\/h3>\n      <textarea class=\"input\" id=\"taskText\" spellcheck=\"false\" style=\"min-height:140px\"><\/textarea>\n      <div class=\"row\"><button class=\"pill small primary\" id=\"btnSaveTasks\" type=\"button\">Save tasks<\/button><button class=\"pill small\" id=\"btnNewRound\" type=\"button\">Start a new round<\/button><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Who's First prompts, one per line<\/h3>\n      <textarea class=\"input\" id=\"firstText\" spellcheck=\"false\" style=\"min-height:160px\"><\/textarea>\n      <div class=\"row\"><button class=\"pill small primary\" id=\"btnSaveFirsts\" type=\"button\">Save prompts<\/button><button class=\"pill small\" id=\"btnResetFirsts\" type=\"button\">Restore the original list<\/button><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Backup<\/h3>\n      <p class=\"note\">Save your classes, class names, tasks, prompts, keep-apart pairs, and pick history to a file. Load it on another computer or after clearing your browser.<\/p>\n      <div class=\"row\">\n        <button class=\"pill small\" id=\"btnBackup\" type=\"button\">Download backup<\/button>\n        <label for=\"restoreInput\" class=\"pill small\" style=\"display:inline-flex;align-items:center;cursor:pointer\">Restore from file<\/label>\n        <input type=\"file\" id=\"restoreInput\" accept=\".json,application/json\" hidden>\n      <\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Tour<\/h3>\n      <p class=\"note\">A quick look at the roster, the five tools, themes, and settings.<\/p>\n      <div class=\"row\"><button class=\"pill small\" id=\"btnTour\" type=\"button\">Take the tour<\/button><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Keyboard and clickers<\/h3>\n      <div class=\"keys\">\n        <span><kbd>Space<\/kbd><\/span><span>Spin, or spin the Task Spinner<\/span>\n        <span><kbd>\u2190<\/kbd> <kbd>\u2192<\/kbd><\/span><span>Close the result<\/span>\n        <span><kbd>\u2191<\/kbd> <kbd>\u2193<\/kbd><\/span><span>Switch between Wheel, Drum, Numbers, Who's First, and Colors<\/span>\n        <span><kbd>T<\/kbd><\/span><span>Show or hide the timer<\/span>\n        <span><kbd>R<\/kbd><\/span><span>Open or close the roster<\/span>\n        <span><kbd>G<\/kbd><\/span><span>Make random groups<\/span>\n        <span><kbd>F<\/kbd><\/span><span>Full screen<\/span>\n        <span><kbd>M<\/kbd><\/span><span>Mute<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/aside>\n\n<\!-- Groups overlay -->\n<section class=\"overlay\" id=\"groups\" hidden aria-label=\"Groups\">\n  <button class=\"ov-close\" id=\"gClose\" type=\"button\" aria-label=\"Close groups\" title=\"Close (Esc)\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5.5 5.5l9 9M14.5 5.5l-9 9\"/><\/svg><\/button>\n  <div class=\"ov-head\">\n    <div><h2 id=\"groupsTitle\">Groups \u2013 3 per group<\/h2><p id=\"groupsSub\"><\/p><div class=\"swap-row\"><div class=\"seg\" id=\"swapSeg\" role=\"group\" aria-label=\"Swap mode\"><button type=\"button\" data-m=\"auto\" aria-pressed=\"true\">Auto swap<\/button><button type=\"button\" data-m=\"manual\" aria-pressed=\"false\">Manual swap<\/button><\/div><p class=\"swap-hint\" id=\"swapHint\"><\/p><\/div>\n    <div class=\"row g-controls\">\n      <button class=\"hover-outline\" id=\"gShuffle\" type=\"button\">Shuffle<\/button>\n      <div class=\"letter-step\" role=\"group\" aria-label=\"Group size\"><button type=\"button\" id=\"gMinus\" aria-label=\"Smaller groups\">\u2212<\/button><output id=\"gSize\">3 per group<\/output><button type=\"button\" id=\"gPlus\" aria-label=\"Larger groups\">+<\/button><\/div>\n      <button class=\"hover-outline round-btn\" id=\"gApartBtn\" type=\"button\" aria-expanded=\"false\" aria-label=\"Group notes\" title=\"Group notes\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"3.5\" width=\"11\" height=\"14\" rx=\"2\"/><path d=\"M7.5 3.5V3a1 1 0 011-1h3a1 1 0 011 1v.5\"/><path d=\"M7.5 8.5h5M7.5 11.5h5M7.5 14.5h3\"/><\/svg><\/button>\n    <\/div>\n    <div class=\"apart-panel\" id=\"apartPanel\" hidden>\n      <div class=\"apart-add\">\n        <select class=\"input\" id=\"apartA\" aria-label=\"First student\"><\/select>\n        <span class=\"apart-x\" aria-hidden=\"true\">and<\/span>\n        <select class=\"input\" id=\"apartB\" aria-label=\"Second student\"><\/select>\n        <button class=\"hover-outline\" id=\"apartAdd\" type=\"button\">Add<\/button>\n      <\/div>\n      <div class=\"apart-list\" id=\"apartList\"><\/div>\n      <p class=\"apart-note\">Each pair is placed in different groups when you shuffle or auto swap. Saved for each class.<\/p>\n    <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"groups-grid\" id=\"groupsGrid\"><\/div>\n<\/section>\n\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script>\n(() => {\n'use strict';\nconst TAU = Math.PI * 2;\nconst ACCENT = [169, 155, 255];\nconst FONT = \"Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif\";\nconst mod = (a, m) => ((a % m) + m) % m;\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst $ = s => document.querySelector(s);\nconst rm = window.matchMedia('(prefers-reduced-motion: reduce)');\nconst reduced = () => rm.matches;\nconst acc = a => `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${a})`;\n\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\n\nconst CLASSES = Array.from({ length: 10 }, (_, i) => `Class ${i + 1}`);\nconst SAMPLE = ['Ava Thompson','Liam Nguyen','Sofia Ramirez','Noah Patel','Maya Johnson','Ethan Brooks','Zoe Kim','Lucas Carter','Isabella Reed','Mateo Garcia','Harper Lewis','Elijah Scott','Amara Okafor','Jackson Hayes','Chloe Bennett','Aiden Murphy','Layla Hassan','Caleb Foster','Nora Sullivan','Owen Price','Priya Shah','Wyatt Collins','Ella Morgan','Gabriel Diaz'];\nconst DEFAULT_TASKS = ['Summarize', 'Predict', 'Ask a question', 'Make a connection', 'Clarify', 'Visualize'];\n\n// Same storage key and shape as the Name Selector, so saved classes appear in both tools.\nconst saved = store.get('names', null) || {};\nCLASSES.forEach(c => { if (!Array.isArray(saved[c])) saved[c] = []; });\nconst settings = Object.assign({ noRepeat: true, fair: false, sound: true, task: false, mode: 'wheel', cls: 'Class 1', groupSize: 3, swapMode: 'auto', suspense: 'low', textSize: 1.15, colorCount: 4, numPreset: '4', numCustom: 30, numBoard: true, numLetters: 2 }, store.get('spinrSettings', {}));\n// Spin length multiplier for each suspense level\nconst SUSPENSE = { low: 0.35, medium: 0.6, high: 1 };\nconst suspense = () => SUSPENSE[settings.suspense] || 1;\nif (!CLASSES.includes(settings.cls)) settings.cls = 'Class 1';\nlet tasks = store.get('spinrTasks', DEFAULT_TASKS);\nconst history = store.get('spinrHistory', {});\nconst absentBy = {};\nlet entries = [];\nlet taskEntries = [];\nlet isSample = false;\nlet hintDismissed = false;\nconst app = { state: 'idle', current: null, task: null, token: 0 };\nconst saveSettings = () => store.set('spinrSettings', settings);\n// Custom class names live under their own key, so the saved lists keep the keys the Name Selector uses.\nconst classLabels = store.get('classNames', {}) || {};\nconst clsName = k => (classLabels[k] || '').trim() || k;\n\n/* ---------- Sound (synthesized so clicks line up exactly with the pegs) ---------- */\nconst Sound = {\n  ctx: null, noise: null, last: 0,\n  ensure() {\n    if (!this.ctx) {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return null;\n      this.ctx = new AC();\n      const len = Math.floor(this.ctx.sampleRate * 0.03);\n      const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n      const d = b.getChannelData(0);\n      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);\n      this.noise = b;\n    }\n    if (this.ctx.state === 'suspended') this.ctx.resume();\n    return this.ctx;\n  },\n  click(intensity = 0.7) {\n    if (!settings.sound) return;\n    const c = this.ensure(); if (!c) return;\n    const now = c.currentTime;\n    if (now - this.last < 0.018) return;\n    this.last = now;\n    const k = clamp(intensity, 0.3, 1);\n    const src = c.createBufferSource(); src.buffer = this.noise; src.playbackRate.value = 0.85 + Math.random() * 0.3;\n    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400 + k * 1200; bp.Q.value = 1.3;\n    const g = c.createGain();\n    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.32 * k, now + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);\n    src.connect(bp).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.06);\n    const o = c.createOscillator(); o.type = 'sine';\n    o.frequency.setValueAtTime(380, now); o.frequency.exponentialRampToValueAtTime(170, now + 0.04);\n    const og = c.createGain();\n    og.gain.setValueAtTime(0.0001, now); og.gain.exponentialRampToValueAtTime(0.10 * k, now + 0.003); og.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);\n    o.connect(og).connect(c.destination); o.start(now); o.stop(now + 0.07);\n  },\n  chime(soft) {\n    if (!settings.sound) return;\n    const c = this.ensure(); if (!c) return;\n    const now = c.currentTime;\n    const notes = soft ? [[988, 0, 0.07]] : [[784, 0, 0.10], [1175, 0.07, 0.08], [1568, 0.14, 0.05]];\n    notes.forEach(([f, t, v]) => {\n      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;\n      const g = c.createGain();\n      g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(v, now + t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 1.4);\n      o.connect(g).connect(c.destination); o.start(now + t); o.stop(now + t + 1.5);\n    });\n  }\n};\n\n/* ---------- Shared drawing helper ---------- */\nfunction rr(c, x, y, w, h, r) {\n  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);\n  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();\n}\nfunction fitText(c, text, maxW) {\n  if (c.measureText(text).width <= maxW) return text;\n  let t = text;\n  while (t.length > 1 && c.measureText(t + '\u2026').width > maxW) t = t.slice(0, -1);\n  return t + '\u2026';\n}\n\n/* ---------- Wheel ---------- */\nclass Wheel {\n  constructor(canvas, opts) {\n    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.opts = opts;\n    this.cache = document.createElement('canvas'); this.cctx = this.cache.getContext('2d');\n    this.rot = 0; this.omega = 0; this.anim = null; this.segs = [];\n    this.pa = 0; this.pv = 0; this.lastIdx = -1; this.lift = 0; this.winner = null;\n    this.size = 0; this.dpr = 1; this.drag = null; this.hubHover = false; this.spinT = 0;\n    this.needsLayout = true; this.dirty = true;\n    this.bind();\n  }\n  get R() { return this.size / 2 - this.size * 0.06; }\n  get hubR() { return this.R * 0.2; }\n  resize(css) {\n    if (css <= 0) return;\n    this.dpr = Math.min(2, window.devicePixelRatio || 1, 2800 / css);\n    this.size = css;\n    const px = Math.round(css * this.dpr);\n    this.cv.width = this.cv.height = px;\n    this.cache.width = this.cache.height = px;\n    this.needsLayout = true; this.dirty = true;\n  }\n  layout() {\n    const its = this.opts.items().filter(e => e.w > 0.0005);\n    const total = its.reduce((s, e) => s + e.w, 0);\n    let a = 0;\n    this.segs = its.map(e => { const span = total ? e.w / total * TAU : 0; const s = { item: e, s: a, e: a + span }; a += span; return s; });\n    this.renderCache();\n    this.needsLayout = false; this.dirty = true;\n  }\n  segIndexAt(theta) {\n    for (let i = 0; i < this.segs.length; i++) if (theta >= this.segs[i].s && theta < this.segs[i].e) return i;\n    return this.segs.length - 1;\n  }\n  labelSize(span) {\n    const R = this.R;\n    return Math.min(R * 0.078, span * R * 0.6 * 0.62);\n  }\n  drawLabel(c, text, mid, fs, color, weight) {\n    const R = this.R;\n    c.save(); c.rotate(mid - Math.PI / 2);\n    c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = color;\n    const maxW = R * 0.86 - this.hubR * 1.35;\n    c.font = `${weight} ${fs}px ${FONT}`;\n    const w = c.measureText(text).width;\n    if (w > maxW) { fs = Math.max(fs * 0.74, fs * maxW / w); c.font = `${weight} ${fs}px ${FONT}`; }\n    c.fillText(fitText(c, text, maxW), R * 0.86, 0);\n    c.restore();\n  }\n  renderCache() {\n    const c = this.cctx, s = this.size, R = this.R, n = this.segs.length;\n    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);\n    c.clearRect(0, 0, s, s);\n    c.translate(s / 2, s / 2);\n    const tones = ['rgba(150,120,255,0.08)', 'rgba(170,140,255,0.17)', 'rgba(160,130,255,0.12)'];\n    if (!n) {\n      c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fillStyle = tones[0]; c.fill(); return;\n    }\n    this.segs.forEach((g, i) => {\n      let t = i % 2; if (n % 2 && n > 1 && i === n - 1) t = 2;\n      c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, g.s - Math.PI / 2, g.e - Math.PI / 2); c.closePath();\n      c.fillStyle = tones[t]; c.fill();\n    });\n    if (n > 1) {\n      c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = 1;\n      this.segs.forEach(g => {\n        const a = g.s - Math.PI / 2;\n        c.beginPath(); c.moveTo(Math.cos(a) * this.hubR, Math.sin(a) * this.hubR); c.lineTo(Math.cos(a) * R, Math.sin(a) * R); c.stroke();\n      });\n    }\n    this.segs.forEach(g => {\n      const span = g.e - g.s; const fs = this.labelSize(span);\n      if (fs < 7) return;\n      const alpha = clamp((fs - 7) / 4, 0, 1) * 0.94;\n      this.drawLabel(c, g.item.label, (g.s + g.e) / 2, fs, `rgba(246,248,252,${alpha})`, 600);\n    });\n    // Pegs on every segment edge\n    const pr = Math.max(2, R * 0.013);\n    this.segs.forEach(g => {\n      const a = g.s - Math.PI / 2;\n      c.beginPath(); c.arc(Math.cos(a) * R * 0.955, Math.sin(a) * R * 0.955, pr, 0, TAU);\n      c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill();\n    });\n  }\n  spin(v0   neon: "<title>SELECTr Plus<\/title>\n<\!-- Favicons -->\n<link rel=\"icon\" type=\"image/png\" href=\"images/FaviconCircleR.png\">\n<link rel=\"icon\" type=\"image/svg+xml\" href=\"images/FaviconCircleR.svg\">\n<link rel=\"shortcut icon\" href=\"images/FaviconCircleR.ico\" type=\"image/x-icon\">\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\">\n<style>\n/* Layout: full-bleed dark stage, wheel centered, floating glass dock at bottom, sheets slide in from the right.\n   Deliberately single-theme (dark glass) to match the RobsonEDU tools. */\n:root{\n  --bg:#060607;\n  --glass:rgba(255,255,255,.07);\n  --glass-2:rgba(255,255,255,.12);\n  --glass-3:rgba(255,255,255,.18);\n  --sheet:rgba(18,18,20,.82);\n  --line:rgba(255,255,255,.14);\n  --fg:#f3f5f9;\n  --muted:rgba(232,237,247,.60);\n  --accent:#c8ff2e;          /* keep in sync with ACCENT in the script */\n  --accent-ink:#101800;\n  /* Lilac-to-blue gradient from the reference \"Sign in\" button */\n  --grad:linear-gradient(90deg,#f2ff8a 0%,#dcff3c 38%,#a6ff2e 66%,#39f27a 100%);\n  /* Hot gradient for highlights, like the Smart Chat card */\n  --grad-hot:linear-gradient(135deg,#eaff6a 0%,#a6ff2e 55%,#39f27a 100%);\n  --grad-warm:linear-gradient(90deg,#f6ffa0 0%,#d4ff3a 45%,#4cf58a 100%);\n  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;\n  --ease:cubic-bezier(.2,.8,.2,1);\n  color-scheme:dark;\n}\n[hidden]{display:none!important}\nhtml,body{height:100%}\nbody{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}\nbutton,select,textarea,input{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n/* Backdrop. On your site, swap these gradients for your photo or video background. */\n.backdrop{position:fixed;inset:0;z-index:0;background:\n  radial-gradient(50% 55% at 8% 18%,rgba(150,155,165,0.16) 0,transparent 70%),\n  radial-gradient(45% 50% at 95% 75%,rgba(120,125,135,0.14) 0,transparent 70%),\n  radial-gradient(35% 30% at 60% 0%,rgba(170,175,185,0.10) 0,transparent 70%),\n  radial-gradient(40% 35% at 40% 105%,rgba(110,115,125,0.13) 0,transparent 70%),\n  linear-gradient(#0b0b0c,#050505)}\n\n/* Spin flair: pop colors swirl behind the stage while spinning */\n.spin-aura{position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:0;mix-blend-mode:screen;filter:blur(90px);\n  background:conic-gradient(from var(--ang,0deg) at 50% 58%,rgba(240,255,140,.5),rgba(210,255,70,.55),rgba(140,240,50,.5),rgba(60,240,130,.55),rgba(180,255,90,.45),rgba(240,255,140,.5))}\n@media (prefers-reduced-motion:reduce){.spin-aura{display:none}}\n/* Timer panel (top left) */\n.timer-panel{position:fixed;z-index:22;top:calc(70px + env(safe-area-inset-top,0px));right:20px;width:236px;box-sizing:border-box;padding:14px 14px 14px;border-radius:22px;\n  background:rgba(16,16,18,.72);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);\n  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;\n  animation:tpIn .35s var(--ease)}\n@keyframes tpIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}\n.tp-time{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;text-align:center;font-variant-numeric:tabular-nums;padding:4px 0 2px;\n  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}\n.timer-panel.running .tp-time{background:linear-gradient(180deg,#fff,#f4ffd9);-webkit-background-clip:text;background-clip:text}\n.timer-panel.warn .tp-time{background:linear-gradient(135deg,#ffb36b,#ff6a3d);-webkit-background-clip:text;background-clip:text}\n.timer-panel.done{border-color:rgba(200,255,50,.7);animation:tpDone 1.4s ease-in-out infinite}\n.timer-panel.done .tp-time{background:linear-gradient(135deg,#ffffff,#e6ff9a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(220,255,50,.6))}\n@keyframes tpDone{0%,100%{box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 0 rgba(220,255,50,0)}50%{box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 34px 4px rgba(220,255,50,.55)}}\n.tp-adjust{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.tp-step{display:flex;align-items:center;height:36px;border-radius:11px;border:1.5px solid var(--line);background:rgba(0,0,0,.25);overflow:hidden}\n.tp-step span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}\n.tp-step button{height:calc(100% - 6px);min-width:28px;margin:3px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:700 16px var(--sans);cursor:pointer;transition:background .2s,color .2s}\n.tp-step:hover{border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,linear-gradient(135deg,#b6ef2e,#e2ff3a) border-box}\n.tp-step:hover button{background:var(--grad);color:var(--accent-ink)}\n.tp-step:hover button:hover{filter:brightness(1.1)}\n.tp-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.tp-actions button{height:40px;border-radius:12px;font:700 14px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:filter .2s,background .2s,border-color .2s}\n.tp-play{border:0;background:var(--grad);color:var(--accent-ink);box-shadow:0 6px 18px rgba(220,255,50,.35)}\n.tp-play:hover{filter:brightness(1.08)}\n.tp-play svg{width:16px;height:16px}\n.tp-reset{border:1.5px solid var(--line);background:rgba(0,0,0,.25);color:var(--fg)}\n.tp-reset:hover{border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,linear-gradient(135deg,#b6ef2e,#e2ff3a) border-box}\n#btnTask[aria-pressed=\"true\"],#btnTimer[aria-pressed=\"true\"]{border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,linear-gradient(135deg,#b6ef2e,#e2ff3a) border-box}\n#btnTimer.ticking{color:#e4ffb0}\n@media (max-width:760px){.timer-panel{right:12px;width:200px;padding:10px}.tp-time{font-size:48px}}\n@media (prefers-reduced-motion:reduce){.timer-panel.done{animation:none;box-shadow:0 0 0 2px rgba(200,255,50,.7)}}\n/* Dock view buttons that aren't selected are tinted green */\n.dock .seg button[aria-pressed=\"false\"]{color:#c4ff36}\n.dock .seg button[aria-pressed=\"false\"]:hover{color:#e6ff9a}\n/* Text size: scales menus, labels and controls, not the big display text */\n.topbar,.dock,.sheet,.toast,.hint,.timer-panel,.reveal-eyebrow,.reveal-actions,.reveal-minor,.num-pick,.count-pick,#numHint,#colorHint,#firstHint,.num-board,#taskWrap .cap-row,.ov-head,.ov-close,.reveal-task.pending{zoom:var(--uiz,1)}\n.textsize button b{line-height:1}\n/* When larger text makes the dock too wide, labels step down to icons */\n.dk1 .dock .seg button[aria-pressed=\"false\"] .lbl{display:none}\n.dk2 .dock #btnHistory .lbl,.dk2 .dock #btnSettings .lbl,.dk2 .dock #btnRoster .lbl{display:none}\n.dk3 .dock #btnGroups .lbl{display:none}\n.dk3 .dock .sep{display:none}\n.ov-head{max-width:calc(1200px / var(--uiz,1))!important}\n/* Top bar */\n.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0;pointer-events:none}\n.topbar>*{pointer-events:auto}\n.mark{display:flex;align-items:baseline;gap:10px;white-space:nowrap}\n.mark b{font-size:26px;font-weight:800;letter-spacing:-.03em}\n.mark b i{font-style:normal;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}\n.mark small{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n.logo-slot{display:flex;align-items:center;height:40px;text-decoration:none}\n.logo-img{height:40px;width:auto;display:block}\n/* Keep the class chip centered on screen no matter how wide the logo is */\n.topbar .class-chip{position:absolute;left:50%;transform:translateX(-50%);top:calc(17px + env(safe-area-inset-top,0px))}\n.class-chip{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-weight:600;font-size:14px;white-space:nowrap}\n.class-chip:hover{background:var(--glass-2)}\n.class-chip .count{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}\n.class-chip .sample{color:#d4ff8a;font-weight:500}\n.top-right{display:flex;align-items:center;gap:8px}\n.status{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--muted);white-space:nowrap}\n.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}\n.icon-btn:hover{background:var(--glass-2)}\n.icon-btn svg,.dbtn svg{width:20px;height:20px;flex:none}\n\n/* Stage */\n#stage{position:fixed;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(108px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:flex;align-items:center;justify-content:center;z-index:1}\n.wrap{position:relative;flex:none}\n.wrap canvas,.tw canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}\n.glass-disc{position:absolute;inset:6%;border-radius:50%;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);background:rgba(255,255,255,.02);transition:inset .6s var(--ease),border-radius .6s var(--e span>min<\/span><button type=\"button\" data-d=\"60\" aria-label=\"Add one minute\">+<\/button>\n    <\/div>\n    <div class=\"tp-step\" role=\"group\" aria-label=\"Seconds\">\n      <button type=\"button\" data-d=\"-15\" aria-label=\"Subtract 15 seconds\">\u2212<\/button><span>15 s<\/span><button type=\"button\" data-d=\"15\" aria-label=\"Add 15 seconds\">+<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"tp-actions\">\n    <button type=\"button\" class=\"tp-play\" id=\"tpPlay\" aria-label=\"Start timer\"><\/button>\n    <button type=\"button\" class=\"tp-reset\" id=\"tpReset\" title=\"Reset. Tap twice for the 1:00 default.\">Reset<\/button>\n  <\/div>\n<\/section>\n\n<main id=\"stage\">\n  <div class=\"wrap\" id=\"mainWrap\">\n    <div class=\"glass-disc\" aria-hidden=\"true\"><\/div>\n    <canvas id=\"wheelCanvas\" aria-label=\"Name wheel. Drag and flick to spin, or press Space.\"><\/canvas>\n    <canvas id=\"drumCanvas\" hidden aria-label=\"Name drum. Drag and flick to spin, or press Space.\"><\/canvas>\n  <\/div>\n    <div class=\"reveal\" id=\"reveal\" hidden aria-live=\"polite\">\n      <div class=\"reveal-eyebrow\" id=\"revealEyebrow\"><\/div>\n      <div class=\"reveal-name\" id=\"revealName\"><\/div>\n      <div class=\"reveal-task\" id=\"revealTask\"><\/div>\n      <div class=\"reveal-actions\">\n        <button class=\"pill\" id=\"revealSecondary\" type=\"button\">Done<\/button>\n        <button class=\"pill primary\" id=\"revealPrimary\" type=\"button\">Next name<\/button>\n      <\/div>\n      <div class=\"reveal-minor\" id=\"revealMinor\">\n        <button type=\"button\" id=\"revealPass\" title=\"Can't answer or stepped out. They stay in for later this round.\">Pass<\/button>\n        <span aria-hidden=\"true\">\u00b7<\/span>\n        <button type=\"button\" id=\"revealAbsent\" title=\"Mark absent in the roster for today and spin again\">Absent<\/button>\n      <\/div>\n    <\/div>\n  <div id=\"taskWrap\" hidden>\n    <div class=\"cap-row\"><div class=\"cap\">Task Spinner<\/div><button class=\"task-x\" id=\"taskClose\" type=\"button\" aria-label=\"Turn off the Task Spinner\" title=\"Turn off the Task Spinner\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l8 8M14 6l-8 8\"/><\/svg><\/button><\/div>\n    <div class=\"tw\" id=\"taskInner\">\n      <div class=\"glass-disc\" aria-hidden=\"true\"><\/div>\n      <canvas id=\"taskCanvas\" aria-label=\"Task Spinner. Tap, flick, or press Space to spin.\"><\/canvas>\n    <\/div>\n  <\/div>\n  <section id=\"numberStage\" hidden aria-label=\"Number selector\">\n    <div class=\"num-board\"><div class=\"num-tokens\" id=\"numTokens\"><\/div><button class=\"board-toggle\" id=\"numBoardBtn\" type=\"button\"><\/button><\/div>\n    <div class=\"num-wrap\" id=\"numWrap\"><div class=\"num-card\"><div class=\"num-value idle\" id=\"numValue\" aria-live=\"polite\">?<\/div><\/div><\/div>\n    <div class=\"num-result\">\n      <div class=\"reveal-eyebrow\" id=\"numEyebrow\"><\/div>\n      <div id=\"numHint\">Press Space or Spin to pick a number<\/div>\n      <div class=\"reveal-task alt-task\" id=\"numTask\" hidden><\/div>\n    <\/div>\n    <div class=\"num-pick\">\n      <span>Pick from<\/span>\n      <div class=\"seg\" id=\"numSeg\" role=\"group\" aria-label=\"Number range\"><\/div>\n      <div class=\"letter-step\" id=\"letterStep\" hidden role=\"group\" aria-label=\"Letters\">\n        <button type=\"button\" id=\"letterMinus\" aria-label=\"Remove a letter\">\u2212<\/button>\n        <output id=\"letterRange\">A\u2013B<\/output>\n        <button type=\"button\" id=\"letterPlus\" aria-label=\"Add a letter\">+C<\/button>\n      <\/div>\n      <div class=\"num-custom\" id=\"numCustom\" hidden>\n        <input type=\"number\" id=\"numInput\" min=\"2\" max=\"999\" inputmode=\"numeric\" aria-label=\"Highest number\">\n        <button class=\"pill small outline-purple\" id=\"numSet\" type=\"button\" style=\"height:40px\">Set<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n  <section id=\"firstStage\" hidden aria-label=\"Who's first\" style=\"display:flex;flex-direction:column;align-items:center;gap:clamp(26px,5vh,48px);width:100%\">\n    <div class=\"num-wrap\" id=\"firstWrap\"><div class=\"num-card wide\" id=\"firstCard\"><div class=\"num-value phrase idle\" id=\"firstValue\" aria-live=\"polite\">Who goes first?<\/div><\/div><\/div>\n    <div class=\"num-result\">\n      <div class=\"reveal-eyebrow\" id=\"firstEyebrow\"><\/div>\n      <div id=\"firstHint\" style=\"font-size:15px;color:var(--muted);font-weight:500\">Press Space or Spin to pick who goes first<\/div>\n      <div class=\"reveal-task alt-task\" id=\"firstTask\" hidden><\/div>\n    <\/div>\n  <\/section>\n  <section id=\"colorStage\" hidden aria-label=\"Color selector\">\n    <div class=\"orbs\" id=\"orbs\"><\/div>\n    <div class=\"color-result\">\n      <div class=\"reveal-eyebrow\" id=\"colorEyebrow\"><\/div>\n      <div id=\"colorName\" aria-live=\"polite\"><\/div>\n      <div id=\"colorHint\">Press Space or Spin to pick a color<\/div>\n      <div class=\"reveal-task alt-task\" id=\"colorTask\" hidden><\/div>\n    <\/div>\n    <div class=\"count-pick\"><span>How many colors?<\/span><div class=\"seg\" id=\"countSeg\" role=\"group\" aria-label=\"Number of colors\"><\/div><\/div>\n  <\/section>\n<\/main>\n\n<div class=\"hint\" id=\"hint\" hidden>Big class? <b role=\"button\" tabindex=\"0\" id=\"hintDrum\">Try Drum view<\/b> for larger names<\/div>\n\n<nav class=\"dock\" aria-label=\"Controls\">\n  <button class=\"dbtn\" id=\"btnRoster\" type=\"button\" title=\"Roster and attendance (R)\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"7.5\" cy=\"6.5\" r=\"3\"/><path d=\"M2 17c0-3 2.5-5 5.5-5s5.5 2 5.5 5\"/><circle cx=\"14.5\" cy=\"6\" r=\"2.2\"/><path d=\"M14 11c2.4 0 4 1.6 4 4.4\"/><\/svg>\n    <span class=\"lbl\">Roster<\/span>\n  <\/button>\n  <div class=\"seg\" role=\"group\" aria-label=\"View\">\n    <button id=\"modeWheel\" type=\"button\" aria-pressed=\"true\" title=\"Wheel view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"10\" cy=\"10\" r=\"7.5\"/><path d=\"M10 2.5v15M3.5 6.25l13 7.5M3.5 13.75l13-7.5\"/><\/svg><span class=\"lbl\">Wheel<\/span>\n    <\/button>\n    <button id=\"modeDrum\" type=\"button\" aria-pressed=\"false\" title=\"Drum view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"3.5\" y=\"2.5\" width=\"13\" height=\"15\" rx=\"3\"/><path d=\"M6.5 7h7M5.5 10h9M6.5 13h7\"/><\/svg><span class=\"lbl\">Drum<\/span>\n    <\/button>\n    <button id=\"modeNumbers\" type=\"button\" aria-pressed=\"false\" title=\"Numbers view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M7.5 3L6 17M14 3l-1.5 14M3.5 7.5h14M2.5 12.5h14\"/><\/svg><span class=\"lbl\">Numbers<\/span>\n    <\/button>\n    <button id=\"modeFirst\" type=\"button\" aria-pressed=\"false\" title=\"Who's First view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 7.2a3 3 0 115.6 1.5c-.6 1-1.6 1.4-2.2 2.1-.3.4-.4.9-.4 1.5\"/><circle cx=\"10\" cy=\"16\" r=\".4\" fill=\"currentColor\"/><\/svg><span class=\"lbl\">Who's First<\/span>\n    <\/button>\n    <button id=\"modeColors\" type=\"button\" aria-pressed=\"false\" title=\"Colors view\">\n      <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"7\" cy=\"7.5\" r=\"4\"/><circle cx=\"13\" cy=\"7.5\" r=\"4\"/><circle cx=\"10\" cy=\"12.5\" r=\"4\"/><\/svg><span class=\"lbl\">Colors<\/span>\n    <\/button>\n  <\/div>\n  <button class=\"dbtn spin\" id=\"btnSpin\" type=\"button\">Spin<\/button>\n  <button class=\"dbtn\" id=\"btnGroups\" type=\"button\" title=\"Make random groups (G)\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"6\" cy=\"6\" r=\"2.6\"/><circle cx=\"14\" cy=\"6\" r=\"2.6\"/><circle cx=\"6\" cy=\"14\" r=\"2.6\"/><circle cx=\"14\" cy=\"14\" r=\"2.6\"/><\/svg>\n    <span class=\"lbl\">Random Groups<\/span>\n  <\/button>\n  <button class=\"dbtn\" id=\"btnHistory\" type=\"button\" title=\"Who has been called\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"10\" cy=\"10\" r=\"7.5\"/><path d=\"M10 5.5V10l3 2\"/><\/svg>\n    <span class=\"lbl\">History<\/span>\n  <\/button>\n  <button class=\"dbtn\" id=\"btnSettings\" type=\"button\" title=\"Settings\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 6h8M15 6h2M3 14h2M9 14h8\"/><circle cx=\"13\" cy=\"6\" r=\"2\"/><circle cx=\"7\" cy=\"14\" r=\"2\"/><\/svg>\n    <span class=\"lbl\">Settings<\/span>\n  <\/button>\n  <span class=\"sep\" aria-hidden=\"true\"><\/span>\n  <button class=\"dbtn\" id=\"btnThemes\" type=\"button\" title=\"Themes\" aria-label=\"Themes\" aria-haspopup=\"dialog\" aria-expanded=\"false\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 17.5a7.5 7.5 0 1 1 7.5-7.5c0 1.8-1.5 2.9-3.2 2.9h-1.8a1.6 1.6 0 0 0-1.2 2.8 1.1 1.1 0 0 1-1.3 1.8z\"/><circle cx=\"6.3\" cy=\"8.8\" r=\".8\"/><circle cx=\"10\" cy=\"6.2\" r=\".8\"/><circle cx=\"13.7\" cy=\"8.8\" r=\".8\"/><\/svg>\n  <\/button>\n  <button class=\"dbtn\" id=\"btnFS\" type=\"button\" title=\"Full screen (F)\" aria-label=\"Full screen\">\n    <svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5\"/><\/svg>\n  <\/button>\n<\/nav>\n<div class=\"thp\" id=\"thPanel\" role=\"dialog\" aria-label=\"Themes\" aria-hidden=\"true\"><div class=\"thp-head\"><b>Themes<\/b><button class=\"thp-x\" type=\"button\" id=\"thClose\" aria-label=\"Close themes\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/div><div class=\"thp-grid\"><button class=\"thp-pick\" type=\"button\" data-theme=\"purple\" aria-pressed=\"false\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#120c2c,#6b4dff 60%,#5b9bff)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlus.png\"><\/span><span class=\"thp-nm\">Purple<\/span><\/button><button class=\"thp-pick\" type=\"button\" data-theme=\"neon\" aria-pressed=\"true\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#0b0b0c,#a6ff2e 70%,#f2ff8a)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlusNEON.png\"><\/span><span class=\"thp-nm\">Neon<\/span><\/button><button class=\"thp-pick\" type=\"button\" data-theme=\"blue\" aria-pressed=\"false\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#ffffff,#d9e4fb 45%,#3375f3)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlusBlue.png\"><\/span><span class=\"thp-nm\">Light Blue<\/span><\/button><button class=\"thp-pick\" type=\"button\" data-theme=\"sketch\" aria-pressed=\"false\"><span class=\"thp-pic\" style=\"background:linear-gradient(135deg,#fbf5e6,#f6c652 50%,#ad97da)\"><img alt=\"\" data-src=\"images/THUMBSelectrPlusSKETCH.png\"><\/span><span class=\"thp-nm\">Sketchbook<\/span><\/button><\/div><\/div>\n<div id=\"tour\" aria-hidden=\"true\">\n  <div class=\"tour-block\"><\/div>\n  <div class=\"tour-spot\" id=\"tourSpot\"><\/div>\n  <div class=\"tour-tip\" id=\"tourTip\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tourTitle\" aria-describedby=\"tourText\">\n    <h4 id=\"tourTitle\"><\/h4>\n    <p id=\"tourText\"><\/p>\n    <div class=\"tour-foot\">\n      <span class=\"tour-count\" id=\"tourCount\"><\/span>\n      <button type=\"button\" id=\"tourSkip\">Skip<\/button>\n      <button type=\"button\" id=\"tourBack\">Back<\/button>\n      <button type=\"button\" id=\"tourNext\">Next<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- Roster sheet -->\n<aside class=\"sheet\" id=\"sheetRoster\" aria-label=\"Roster\" inert>\n  <header><h2>Roster<\/h2><button class=\"icon-btn\" data-close type=\"button\" aria-label=\"Close\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/header>\n  <div class=\"body\">\n    <div class=\"field\">\n      <h3>Class<\/h3>\n      <div class=\"row\" id=\"classRow\" style=\"flex-wrap:nowrap\">\n        <select class=\"input\" id=\"classSelect\" style=\"flex:1;min-width:0\"><\/select>\n        <button class=\"pill small\" id=\"btnRename\" type=\"button\">Rename<\/button>\n      <\/div>\n      <div id=\"renameRow\" class=\"field\" hidden>\n        <input class=\"input\" id=\"renameInput\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" placeholder=\"Class name, like 3rd Period Science\" aria-label=\"Class name\">\n        <div class=\"row\">\n          <button class=\"pill small primary\" id=\"btnRenameSave\" type=\"button\">Save name<\/button>\n          <button class=\"pill small\" id=\"btnRenameCancel\" type=\"button\">Cancel<\/button>\n        <\/div>\n        <p class=\"note\">Leave it blank to go back to the default name. Your names and history stay with the class.<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Names, one per line<\/h3>\n      <textarea class=\"input\" id=\"rosterText\" spellcheck=\"false\" placeholder=\"Enter names, one per line, or upload a TXT or CSV file.\"><\/textarea>\n      <div class=\"row\">\n        <label for=\"fileInput\" class=\"pill small\" style=\"display:inline-flex;align-items:center;cursor:pointer\">Upload file<\/label>\n        <input type=\"file\" id=\"fileInput\" accept=\".txt,.csv\">\n        <button class=\"pill small primary\" id=\"btnSaveNames\" type=\"button\">Save names<\/button>\n      <\/div>\n      <p class=\"note\">Names save to this browser and are shared with the Name Selector. Keep a backup file of your lists, since clearing browser data removes them.<\/p>\n    <\/div>\n    <div class=\"field\">\n      <div class=\"row\" style=\"justify-content:space-between\">\n        <h3 style=\"margin:0\">Here today<\/h3>\n        <button class=\"pill small\" id=\"btnAllHere\" type=\"button\">Mark all here<\/button>\n      <\/div>\n      <p class=\"note\">Tap a name to mark them absent for this session. Your saved list does not change.<\/p>\n      <div class=\"chips\" id=\"chips\"><\/div>\n    <\/div>\n  <\/div>\n<\/aside>\n\n<\!-- History sheet -->\n<aside class=\"sheet\" id=\"sheetHistory\" aria-label=\"History\" inert>\n  <header><h2>History<\/h2><button class=\"icon-btn\" data-close type=\"button\" aria-label=\"Close\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/header>\n  <div class=\"body\">\n    <div class=\"field\">\n      <h3>Called in the last 7 days<\/h3>\n      <p class=\"note\" id=\"histNote\"><\/p>\n      <div class=\"hist-table\" id=\"histTable\"><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Recent picks<\/h3>\n      <div class=\"recent\" id=\"histRecent\"><\/div>\n    <\/div>\n    <div class=\"row\"><button class=\"pill small\" id=\"btnClearHist\" type=\"button\">Clear history for this class<\/button><\/div>\n  <\/div>\n<\/aside>\n\n<\!-- Settings sheet -->\n<aside class=\"sheet\" id=\"sheetSettings\" aria-label=\"Settings\" inert>\n  <header><h2>Settings<\/h2><button class=\"icon-btn\" data-close type=\"button\" aria-label=\"Close\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg><\/button><\/header>\n  <div class=\"body\">\n    <div>\n      <div class=\"toggle-row\"><div><b>No repeat<\/b><span>Picked names leave the wheel until you start a new round.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optNoRepeat\" aria-label=\"No repeat\"><i><\/i><\/label><\/div>\n      <div class=\"toggle-row\"><div><b>Fair mode<\/b><span>Students called less this week get a bigger slice, so their chance is higher. You can see it on the wheel.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optFair\" aria-label=\"Fair mode\"><i><\/i><\/label><\/div>\n      <div class=\"toggle-row\"><div><b>Task Spinner<\/b><span>A small drum picks a role or prompt after each name.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optTask\" aria-label=\"Task Spinner\"><i><\/i><\/label><\/div>\n      <div class=\"toggle-row\"><div><b>Sounds<\/b><span>Peg clicks and the reveal chime.<\/span><\/div><label class=\"switch\"><input type=\"checkbox\" id=\"optSound\" aria-label=\"Sounds\"><i><\/i><\/label><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Text size<\/h3>\n      <div class=\"choice textsize\" role=\"group\" aria-label=\"Text size\" id=\"textSizeChoice\">\n        <button type=\"button\" data-z=\"1\"><b style=\"font-size:13px\">A<\/b><span>Standard<\/span><\/button>\n        <button type=\"button\" data-z=\"1.15\"><b style=\"font-size:16px\">A<\/b><span>Large<\/span><\/button>\n        <button type=\"button\" data-z=\"1.3\"><b style=\"font-size:19px\">A<\/b><span>Larger<\/span><\/button>\n        <button type=\"button\" data-z=\"1.45\"><b style=\"font-size:22px\">A<\/b><span>Largest<\/span><\/button>\n      <\/div>\n      <p class=\"note\">Makes menus, buttons and labels easier to read from the back of the room. Names and numbers on screen stay the same size.<\/p>\n    <\/div>\n    <div class=\"field\">\n      <h3>Suspense<\/h3>\n      <div class=\"choice\" role=\"group\" aria-label=\"Suspense\" id=\"suspenseChoice\">\n        <button type=\"button\" data-s=\"low\"><b>Low<\/b><span>about 3 sec<\/span><\/button>\n        <button type=\"button\" data-s=\"medium\"><b>Medium<\/b><span>about 5 sec<\/span><\/button>\n        <button type=\"button\" data-s=\"high\"><b>High<\/b><span>about 8 sec<\/span><\/button>\n      <\/div>\n      <p class=\"note\">How long the wheel and drum spin before landing. Hard flicks run a little longer.<\/p>\n    <\/div>\n    <div class=\"field\">\n      <h3>Tasks, one per line<\/h3>\n      <textarea class=\"input\" id=\"taskText\" spellcheck=\"false\" style=\"min-height:140px\"><\/textarea>\n      <div class=\"row\"><button class=\"pill small primary\" id=\"btnSaveTasks\" type=\"button\">Save tasks<\/button><button class=\"pill small\" id=\"btnNewRound\" type=\"button\">Start a new round<\/button><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Who's First prompts, one per line<\/h3>\n      <textarea class=\"input\" id=\"firstText\" spellcheck=\"false\" style=\"min-height:160px\"><\/textarea>\n      <div class=\"row\"><button class=\"pill small primary\" id=\"btnSaveFirsts\" type=\"button\">Save prompts<\/button><button class=\"pill small\" id=\"btnResetFirsts\" type=\"button\">Restore the original list<\/button><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Backup<\/h3>\n      <p class=\"note\">Save your classes, class names, tasks, prompts, keep-apart pairs, and pick history to a file. Load it on another computer or after clearing your browser.<\/p>\n      <div class=\"row\">\n        <button class=\"pill small\" id=\"btnBackup\" type=\"button\">Download backup<\/button>\n        <label for=\"restoreInput\" class=\"pill small\" style=\"display:inline-flex;align-items:center;cursor:pointer\">Restore from file<\/label>\n        <input type=\"file\" id=\"restoreInput\" accept=\".json,application/json\" hidden>\n      <\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Tour<\/h3>\n      <p class=\"note\">A quick look at the roster, the five tools, themes, and settings.<\/p>\n      <div class=\"row\"><button class=\"pill small\" id=\"btnTour\" type=\"button\">Take the tour<\/button><\/div>\n    <\/div>\n    <div class=\"field\">\n      <h3>Keyboard and clickers<\/h3>\n      <div class=\"keys\">\n        <span><kbd>Space<\/kbd><\/span><span>Spin, or spin the Task Spinner<\/span>\n        <span><kbd>\u2190<\/kbd> <kbd>\u2192<\/kbd><\/span><span>Close the result<\/span>\n        <span><kbd>\u2191<\/kbd> <kbd>\u2193<\/kbd><\/span><span>Switch between Wheel, Drum, Numbers, Who's First, and Colors<\/span>\n        <span><kbd>T<\/kbd><\/span><span>Show or hide the timer<\/span>\n        <span><kbd>R<\/kbd><\/span><span>Open or close the roster<\/span>\n        <span><kbd>G<\/kbd><\/span><span>Make random groups<\/span>\n        <span><kbd>F<\/kbd><\/span><span>Full screen<\/span>\n        <span><kbd>M<\/kbd><\/span><span>Mute<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/aside>\n\n<\!-- Groups overlay -->\n<section class=\"overlay\" id=\"groups\" hidden aria-label=\"Groups\">\n  <button class=\"ov-close\" id=\"gClose\" type=\"button\" aria-label=\"Close groups\" title=\"Close (Esc)\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5.5 5.5l9 9M14.5 5.5l-9 9\"/><\/svg><\/button>\n  <div class=\"ov-head\">\n    <div><h2 id=\"groupsTitle\">Groups \u2013 3 per group<\/h2><p id=\"groupsSub\"><\/p><div class=\"swap-row\"><div class=\"seg\" id=\"swapSeg\" role=\"group\" aria-label=\"Swap mode\"><button type=\"button\" data-m=\"auto\" aria-pressed=\"true\">Auto swap<\/button><button type=\"button\" data-m=\"manual\" aria-pressed=\"false\">Manual swap<\/button><\/div><p class=\"swap-hint\" id=\"swapHint\"><\/p><\/div>\n    <div class=\"row g-controls\">\n      <button class=\"hover-outline\" id=\"gShuffle\" type=\"button\">Shuffle<\/button>\n      <div class=\"letter-step\" role=\"group\" aria-label=\"Group size\"><button type=\"button\" id=\"gMinus\" aria-label=\"Smaller groups\">\u2212<\/button><output id=\"gSize\">3 per group<\/output><button type=\"button\" id=\"gPlus\" aria-label=\"Larger groups\">+<\/button><\/div>\n      <button class=\"hover-outline round-btn\" id=\"gApartBtn\" type=\"button\" aria-expanded=\"false\" aria-label=\"Group notes\" title=\"Group notes\"><svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"3.5\" width=\"11\" height=\"14\" rx=\"2\"/><path d=\"M7.5 3.5V3a1 1 0 011-1h3a1 1 0 011 1v.5\"/><path d=\"M7.5 8.5h5M7.5 11.5h5M7.5 14.5h3\"/><\/svg><\/button>\n    <\/div>\n    <div class=\"apart-panel\" id=\"apartPanel\" hidden>\n      <div class=\"apart-add\">\n        <select class=\"input\" id=\"apartA\" aria-label=\"First student\"><\/select>\n        <span class=\"apart-x\" aria-hidden=\"true\">and<\/span>\n        <select class=\"input\" id=\"apartB\" aria-label=\"Second student\"><\/select>\n        <button class=\"hover-outline\" id=\"apartAdd\" type=\"button\">Add<\/button>\n      <\/div>\n      <div class=\"apart-list\" id=\"apartList\"><\/div>\n      <p class=\"apart-note\">Each pair is placed in different groups when you shuffle or auto swap. Saved for each class.<\/p>\n    <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"groups-grid\" id=\"groupsGrid\"><\/div>\n<\/section>\n\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script>\n(() => {\n'use strict';\nconst TAU = Math.PI * 2;\nconst ACCENT = [200, 255, 46];\nconst FONT = \"Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif\";\nconst mod = (a, m) => ((a % m) + m) % m;\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst $ = s => document.querySelector(s);\nconst rm = window.matchMedia('(prefers-reduced-motion: reduce)');\nconst reduced = () => rm.matches;\nconst acc = a => `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${a})`;\n\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\n\nconst CLASSES = Array.from({ length: 10 }, (_, i) => `Class ${i + 1}`);\nconst SAMPLE = ['Ava Thompson','Liam Nguyen','Sofia Ramirez','Noah Patel','Maya Johnson','Ethan Brooks','Zoe Kim','Lucas Carter','Isabella Reed','Mateo Garcia','Harper Lewis','Elijah Scott','Amara Okafor','Jackson Hayes','Chloe Bennett','Aiden Murphy','Layla Hassan','Caleb Foster','Nora Sullivan','Owen Price','Priya Shah','Wyatt Collins','Ella Morgan','Gabriel Diaz'];\nconst DEFAULT_TASKS = ['Summarize', 'Predict', 'Ask a question', 'Make a connection', 'Clarify', 'Visualize'];\n\n// Same storage key and shape as the Name Selector, so saved classes appear in both tools.\nconst saved = store.get('names', null) || {};\nCLASSES.forEach(c => { if (!Array.isArray(saved[c])) saved[c] = []; });\nconst settings = Object.assign({ noRepeat: true, fair: false, sound: true, task: false, mode: 'wheel', cls: 'Class 1', groupSize: 3, swapMode: 'auto', suspense: 'low', textSize: 1.15, colorCount: 4, numPreset: '4', numCustom: 30, numBoard: true, numLetters: 2 }, store.get('spinrSettings', {}));\n// Spin length multiplier for each suspense level\nconst SUSPENSE = { low: 0.35, medium: 0.6, high: 1 };\nconst suspense = () => SUSPENSE[settings.suspense] || 1;\nif (!CLASSES.includes(settings.cls)) settings.cls = 'Class 1';\nlet tasks = store.get('spinrTasks', DEFAULT_TASKS);\nconst history = store.get('spinrHistory', {});\nconst absentBy = {};\nlet entries = [];\nlet taskEntries = [];\nlet isSample = false;\nlet hintDismissed = false;\nconst app = { state: 'idle', current: null, task: null, token: 0 };\nconst saveSettings = () => store.set('spinrSettings', settings);\n// Custom class names live under their own key, so the saved lists keep the keys the Name Selector uses.\nconst classLabels = store.get('classNames', {}) || {};\nconst clsName = k => (classLabels[k] || '').trim() || k;\n\n/* ---------- Sound (synthesized so clicks line up exactly with the pegs) ---------- */\nconst Sound = {\n  ctx: null, noise: null, last: 0,\n  ensure() {\n    if (!this.ctx) {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return null;\n      this.ctx = new AC();\n      const len = Math.floor(this.ctx.sampleRate * 0.03);\n      const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n      const d = b.getChannelData(0);\n      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);\n      this.noise = b;\n    }\n    if (this.ctx.state === 'suspended') this.ctx.resume();\n    return this.ctx;\n  },\n  click(intensity = 0.7) {\n    if (!settings.sound) return;\n    const c = this.ensure(); if (!c) return;\n    const now = c.currentTime;\n    if (now - this.last < 0.018) return;\n    this.last = now;\n    const k = clamp(intensity, 0.3, 1);\n    const src = c.createBufferSource(); src.buffer = this.noise; src.playbackRate.value = 0.85 + Math.random() * 0.3;\n    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400 + k * 1200; bp.Q.value = 1.3;\n    const g = c.createGain();\n    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.32 * k, now + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);\n    src.connect(bp).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.06);\n    const o = c.createOscillator(); o.type = 'sine';\n    o.frequency.setValueAtTime(380, now); o.frequency.exponentialRampToValueAtTime(170, now + 0.04);\n    const og = c.createGain();\n    og.gain.setValueAtTime(0.0001, now); og.gain.exponentialRampToValueAtTime(0.10 * k, now + 0.003); og.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);\n    o.connect(og).connect(c.destination); o.start(now); o.stop(now + 0.07);\n  },\n  chime(soft) {\n    if (!settings.sound) return;\n    const c = this.ensure(); if (!c) return;\n    const now = c.currentTime;\n    const notes = soft ? [[988, 0, 0.07]] : [[784, 0, 0.10], [1175, 0.07, 0.08], [1568, 0.14, 0.05]];\n    notes.forEach(([f, t, v]) => {\n      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;\n      const g = c.createGain();\n      g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(v, now + t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 1.4);\n      o.connect(g).connect(c.destination); o.start(now + t); o.stop(now + t + 1.5);\n    });\n  }\n};\n\n/* ---------- Shared drawing helper ---------- */\nfunction rr(c, x, y, w, h, r) {\n  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);\n  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();\n}\nfunction fitText(c, text, maxW) {\n  if (c.measureText(text).width <= maxW) return text;\n  let t = text;\n  while (t.length > 1 && c.measureText(t + '\u2026').width > maxW) t = t.slice(0, -1);\n  return t + '\u2026';\n}\n\n/* ---------- Wheel ---------- */\nclass Wheel {\n  constructor(canvas, opts) {\n    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.opts = opts;\n    this.cache = document.createElement('canvas'); this.cctx = this.cache.getContext('2d');\n    this.rot = 0; this.omega = 0; this.anim = null; this.segs = [];\n    this.pa = 0; this.pv = 0; this.lastIdx = -1; this.lift = 0; this.winner = null;\n    this.size = 0; this.dpr = 1; this.drag = null; this.hubHover = false; this.spinT = 0;\n    this.needsLayout = true; this.dirty = true;\n    this.bind();\n  }\n  get R() { return this.size / 2 - this.size * 0.06; }\n  get hubR() { return this.R * 0.2; }\n  resize(css) {\n    if (css <= 0) return;\n    this.dpr = Math.min(2, window.devicePixelRatio || 1, 2800 / css);\n    this.size = css;\n    const px = Math.round(css * this.dpr);\n    this.cv.width = this.cv.height = px;\n    this.cache.width = this.cache.height = px;\n    this.needsLayout = true; this.dirty = true;\n  }\n  layout() {\n    const its = this.opts.items().filter(e => e.w > 0.0005);\n    const total = its.reduce((s, e) => s + e.w, 0);\n    let a = 0;\n    this.segs = its.map(e => { const span = total ? e.w / total * TAU : 0; const s = { item: e, s: a, e: a + span }; a += span; return s; });\n    this.renderCache();\n    this.needsLayout = false; this.dirty = true;\n  }\n  segIndexAt(theta) {\n    for (let i = 0; i < this.segs.length; i++) if (theta >= this.segs[i].s && theta < this.segs[i].e) return i;\n    return this.segs.length - 1;\n  }\n  labelSize(span) {\n    const R = this.R;\n    return Math.min(R * 0.078, span * R * 0.6 * 0.62);\n  }\n  drawLabel(c, text, mid, fs, color, weight) {\n    const R = this.R;\n    c.save(); c.rotate(mid - Math.PI / 2);\n    c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = color;\n    const maxW = R * 0.86 - this.hubR * 1.35;\n    c.font = `${weight} ${fs}px ${FONT}`;\n    const w = c.measureText(text).width;\n    if (w > maxW) { fs = Math.max(fs * 0.74, fs * maxW / w); c.font = `${weight} ${fs}px ${FONT}`; }\n    c.fillText(fitText(c, text, maxW), R * 0.86, 0);\n    c.restore();\n  }\n  renderCache() {\n    const c = this.cctx, s = this.size, R = this.R, n = this.segs.length;\n    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);\n    c.clearRect(0, 0, s, s);\n    c.translate(s / 2, s / 2);\n    const tones = ['rgba(255,255,255,0.045)', 'rgba(255,255,255,0.11)', 'rgba(255,255,255,0.075)'];\n    if (!n) {\n      c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fillStyle = tones[0]; c.fill(); return;\n    }\n    this.segs.forEach((g, i) => {\n      let t = i % 2; if (n % 2 && n > 1 && i === n - 1) t = 2;\n      c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, g.s - Math.PI / 2, g.e - Math.PI / 2); c.closePath();\n      c.f
