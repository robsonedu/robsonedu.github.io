<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robsonedu</title>
  <link rel="icon" type="image/png" href="images/FaviconCircleR.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

    .logo-img {
      position: fixed;
      top: 20px;
      left: 20px;
      height: 56px;
      width: auto;
      z-index: 2000;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      border: none;
      pointer-events: auto;
    }

    .main-content {
      padding-top: 0px;
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: black;
      background-image: url(images/Daydreamer_F_4k.jpg);
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      position: relative;
      font-family: 'Inter', sans-serif;
      color: #fff;
      text-shadow: 0 0 8px rgba(0,0,0,0.7);
      padding: 0;
      box-sizing: border-box;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2; /* above overlay + number/confetti layer */
    }

    .timer {
      font-size: 7.5rem;
      transition: transform 0.3s ease, text-shadow 0.4s ease;
      z-index: 1;
    }

    .timer.running { transform: scale(1.1);}
    .timer.glow { animation: glowPulse 2s infinite ease-in-out;}

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 10px #fff, 0 0 20px #fff; opacity: 1; }
      50% { text-shadow: 0 0 30px #fff, 0 0 60px #fff; opacity: 0.7; }
    }

    .controls, .custom-time, .presets {
      margin-top: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      z-index: 1;
    }

    button {
      padding: 15px 35px;
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid #ffff00;
      background: transparent;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, transform 0.2s;
      backdrop-filter: blur(5px);
      color: #000000;
      z-index: 1;
    }

    button:hover { background: rgba(255,255,255,0.4); color: #ffffff; transform: scale(1.05);}
    button:active { transform: scale(0.97);}

    .icon-button { font-size: 1.275rem; padding: 15px 35px;}

    .presets button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.3rem;
    }

    .custom-time button { padding: 15px 20px;}

    .custom-time input {
      width: 110px;
      padding: 10px;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #ffff00;
      text-align: center;
      background: rgba(255, 255, 255, 0);
      color: #000;
    }

    .custom-time input::placeholder { color: #333; opacity: 1; }

    /* YOUTUBE PANEL STYLES */
    .youtube-panel {
      position: fixed;
      top: 20px;
      right: -230px;
      width: 204px;
      height: 205px;
      z-index: 200;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0,0,0,0.92);
      box-shadow: 0 6px 30px 0 rgba(0,0,0,0.25);
      transition: right 0.4s cubic-bezier(.82,.01,.4,.99);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .youtube-panel.open {
      right: 20px;
    }

    .youtube-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
    }

    .music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 2.2rem;
      color: #000000;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 100;
      padding: 0;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-toggle:hover { color: #9d98fd; }

    /* Faint overlay over background image */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.1); /* adjust darkness as needed */
      z-index: 0;
      pointer-events: none;
    }

    /* ---------------------------------------------------------
       6 & 7 pairs with smooth alternating up/down motion
       --------------------------------------------------------- */
    .number-bg {
      position: fixed;
      inset: 0;
      z-index: 1; /* above overlay, below main content */
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: visible;
    }

    body.show-numbers .number-bg {
      opacity: 1;
    }

    .number-bg .num {
      position: absolute;
      bottom: 2vh;            /* sitting near the bottom */
      transform: translate3d(0, 0, 0);
      font-family: 'Inter', sans-serif;
      font-size: 5.2rem !important;  /* lock one size for all 6s and 7s */
      color: #ffff00;
      opacity: var(--baseOpacity, 0.0);
      /* no shadow / glow */
    }

    .number-bg .num.six-seven-motion {
      animation-name: sixSevenHand;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      /* Speed control */
      animation-duration: 1.3s;
    }

    /* Smooth single up–down loop */
    @keyframes sixSevenHand {
      0% {
        transform: translate3d(0, 0, 0);
        opacity: var(--baseOpacity, 0.4);
      }
      50% {
        transform: translate3d(0, -5vh, 0);
        opacity: var(--peakOpacity, 0.9);
      }
      100% {
        transform: translate3d(0, 0, 0);
        opacity: var(--baseOpacity, 0.4);
      }
    }

    /* ---------------------------------------------------------
       Confetti rain of 6 & 7 when timer finishes
       --------------------------------------------------------- */
    #confettiContainer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1; /* same as number-bg layer */
    }

    .confetti-num {
      position: absolute;
      top: -10vh;
      font-family: 'Inter', sans-serif;
      font-size: 4rem;
      color: #b2febb;
      opacity: 0;
      animation-name: fallNumber;
      animation-timing-function: ease-in;
      animation-fill-mode: forwards;
    }

    /* No rotation, just straight falling */
    @keyframes fallNumber {
      0% {
        transform: translateY(-10vh);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    @media (max-width: 870px) {
      .timer { font-size: 4rem;}
      button { padding: 10px 20px; font-size: 1.2rem;}
      .presets button { width: 60px; height: 60px; font-size: 1rem;}
      .custom-time input { width: 80px; font-size: 1.2rem;}
      .controls, .custom-time, .presets { gap: 12px; margin-top: 15px;}
      .youtube-panel,
      .music-toggle {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <a href="PageTimers.html">
    <img src="images/TIMEr%20BK%20Logo.png" alt="Logo" class="logo-img">
  </a>

  <!-- 6 & 7 alternating hand-motion pairs along the bottom (only when timer ends) -->
  <div class="number-bg" id="numberBg"></div>

  <!-- Confetti container for 6/7 rain -->
  <div id="confettiContainer"></div>

  <div class="main-content">
    <div class="timer" id="timer">05:00</div>
    <div class="controls">
      <button class="icon-button" onclick="startTimer()">▶</button>
      <button class="icon-button" onclick="pauseTimer()">‖</button>
      <button class="icon-button" onclick="resetTimer()">Reset</button>
      <button onclick="add30Seconds()">+30 sec</button>
    </div>
    <div class="custom-time">
      <button onclick="setCustomTime()">Set</button>
      <input type="text" id="customTime" placeholder="MM:SS" />
    </div>
    <div class="presets">
      <button onclick="setTime(0,15)">:15</button>
      <button onclick="setTime(0,30)">:30</button>
      <button onclick="setTime(1)">1</button>
      <button onclick="setTime(2)">2</button>
      <button onclick="setTime(3)">3</button>
      <button onclick="setTime(4)">4</button>
      <button onclick="setTime(5)">5</button>
      <button onclick="setTime(6)">6</button>
      <button onclick="setTime(7)">7</button>
      <button onclick="setTime(8)">8</button>
      <button onclick="setTime(9)">9</button>
      <button onclick="setTime(10)">10</button>
    </div>
  </div>

  <!-- YOUTUBE PANEL (music player) -->
  <div class="youtube-panel" id="youtubePanel">
    <iframe src="https://www.youtube-nocookie.com/embed/videoseries?si=bV_XwAxnV_fHx064&amp;list=PLYc7EoK5SagCCVbZdbGfKghM9VaGLRyKM"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>
  <button class="music-toggle" onclick="toggleYouTube()">♩</button>

  <audio id="endSound">
    <source src="audio/MinionsLaughing.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <audio id="warningSound">
    <source src="audio/Tick%20Tock%20Clock.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

<script>
  // Unlock audio on any timer button press (once only)
  let audioUnlocked = false;
  function unlockAudio() {
    if (!audioUnlocked) {
      try {
        document.getElementById('endSound').play().then(a => {
          document.getElementById('endSound').pause();
          document.getElementById('endSound').currentTime = 0;
        });
      } catch (e) {}
      try {
        document.getElementById('warningSound').play().then(a => {
          document.getElementById('warningSound').pause();
          document.getElementById('warningSound').currentTime = 0;
        });
      } catch (e) {}
      audioUnlocked = true;
    }
  }

  let duration = 5 * 60; // seconds
  let remainingTime = duration;
  let timerInterval = null;
  let endTime = null;
  let isRunning = false;
  let playingSound = false;
  let warningPlayed = false;
  const timerDisplay = document.getElementById('timer');
  const endSound = document.getElementById('endSound');
  const warningSound = document.getElementById('warningSound');
  warningSound.volume = 0.5;

  function updateDisplay() {
    const minutes = Math.floor(remainingTime / 60);
    const seconds = (remainingTime % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${minutes}:${seconds}`;
  }

  function tick() {
    if (!isRunning) return;
    const now = Date.now();
    remainingTime = Math.round((endTime - now) / 1000);

    // 10 second warning sound
    if (remainingTime === 10 && !warningPlayed) {
      warningPlayed = true;
      warningSound.currentTime = 0;
      warningSound.play().catch(()=>{});
    }

    if (remainingTime <= 0) {
      remainingTime = 0;
      updateDisplay();
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;

      timerDisplay.classList.remove('running');
      timerDisplay.classList.add('glow');

      // Show the 6/7 bottom animation WHEN the timer ends
      document.body.classList.add('show-numbers');

      // Confetti effect
      triggerNumberConfetti(); // 🎉 rain down 6/7
      playSoundThreeTimes();
    } else {
      updateDisplay();
    }
  }

  function startTimer() {
    unlockAudio();
    if (isRunning) return;
    timerDisplay.classList.add('running');

    endTime = Date.now() + remainingTime * 1000;
    isRunning = true;
    warningPlayed = remainingTime <= 10;
    timerInterval = setInterval(tick, 250);
  }

  function pauseTimer() {
    unlockAudio();
    if (!isRunning) return;
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
    const now = Date.now();
    remainingTime = Math.round((endTime - now) / 1000);
    timerDisplay.classList.remove('running');
  }

  function resetTimer() {
    unlockAudio();
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
    remainingTime = duration;
    warningPlayed = false;
    updateDisplay();
    timerDisplay.classList.remove('running', 'glow');

    // Hide bottom animation on reset
    document.body.classList.remove('show-numbers');

    stopSound();

    // Clear any leftover confetti
    const container = document.getElementById('confettiContainer');
    if (container) container.innerHTML = '';
  }

  function setTime(minutes = 0, seconds = 0) {
    unlockAudio();
    pauseTimer();
    duration = (minutes * 60) + seconds;
    remainingTime = duration;
    warningPlayed = false;
    updateDisplay();
    timerDisplay.classList.remove('glow');
    stopSound();

    // Ensure bottom animation is hidden at the start of a new timer
    document.body.classList.remove('show-numbers');

    startTimer();
  }

  function setCustomTime() {
    unlockAudio();
    const input = document.getElementById('customTime').value.trim();
    const match = input.match(/^(\d{1,2}):(\d{2})$/);
    if (match) {
      let min = parseInt(match[1]);
      let sec = parseInt(match[2]);
      if (!isNaN(min) && !isNaN(sec) && sec < 60) {
        duration = (min * 60) + sec;
        remainingTime = duration;
        pauseTimer();
        warningPlayed = false;
        updateDisplay();
        timerDisplay.classList.remove('glow');
        stopSound();
      } else {
        alert("Invalid time format.");
      }
    } else {
      alert("Please enter time in MM:SS format.");
    }
  }

  function add30Seconds() {
    unlockAudio();
    if (isRunning) {
      remainingTime += 30;
      endTime += 30 * 1000;
    } else {
      remainingTime += 30;
    }
    if (remainingTime > 10) warningPlayed = false;
    updateDisplay();
  }

  function playSoundThreeTimes() {
    let count = 0;
    playingSound = true;
    const cutoffRatio = 0.98
    endSound.volume = 0.2;

    function playNext() {
      if (count < 2 && playingSound) {
        endSound.currentTime = 0;
        endSound.play().then(() => {
          const shortDuration = endSound.duration * cutoffRatio;
          setTimeout(() => {
            endSound.pause();
            endSound.currentTime = 0;
            count++;
            playNext();
          }, shortDuration * 1000);
        }).catch(err => console.log("Audio play prevented:", err));
      }
    }
    playNext();
  }

  function stopSound() {
    playingSound = false;
    endSound.pause();
    endSound.currentTime = 0;
    warningSound.pause();
    warningSound.currentTime = 0;
  }

  function toggleYouTube() {
    const panel = document.getElementById('youtubePanel');
    panel.classList.toggle('open');
  }

  // ⬇️ This controls CONFETTI AMOUNT + SPEED
  function triggerNumberConfetti() {
    const container = document.getElementById('confettiContainer');
    if (!container) return;
    container.innerHTML = ''; // clear any old ones

    const TOTAL_CONFETTI = 100;   // 🔢 amount of 6s/7s
    const MIN_DURATION   = 2.0;   // ⏱ slowest-ish
    const MAX_DURATION   = 3.5;   // ⏱ fastest-ish (still slower than before)

    for (let i = 0; i < TOTAL_CONFETTI; i++) {
      const span = document.createElement('span');
      span.className = 'confetti-num';
      span.textContent = Math.random() < 0.5 ? '6' : '7';

      const left = Math.random() * 100;
      const delay = Math.random() * 0.2; // small stagger at the top

      // Slower fall speed: 2.0–3.5 seconds
      const duration = MIN_DURATION + Math.random() * (MAX_DURATION - MIN_DURATION);

      span.style.left = left + 'vw';
      span.style.animationDelay = delay + 's';
      span.style.animationDuration = duration + 's';

      container.appendChild(span);
    }

    // Clear after longest animations finish
    setTimeout(() => {
      container.innerHTML = '';
    }, (MAX_DURATION + 1) * 1000);
  }

  // Helper to create one 6 or 7 at a given horizontal group position
  function createSixSevenNumber(container, digit, baseLeft, offset, delay) {
    const span = document.createElement('span');
    span.textContent = digit;
    span.classList.add('num', 'six-seven-motion', digit === '6' ? 'six' : 'seven');

    const left = baseLeft + offset;
    span.style.left = left + 'vw';

    // Opacity feel: subtle but readable
    const baseOpacity = (0.3 + Math.random() * 0.2).toFixed(2);
    const peakOpacity = (0.7 + Math.random() * 0.2).toFixed(2);
    span.style.setProperty('--baseOpacity', baseOpacity);
    span.style.setProperty('--peakOpacity', peakOpacity);

    // Timing (delay only; duration from CSS)
    span.style.animationDelay = delay.toFixed(2) + 's';

    container.appendChild(span);
  }

  // Initialize 4 "6 7" groups evenly spaced along the bottom
  function initSixSevenPairs() {
    const container = document.getElementById('numberBg');
    if (!container) return;

    const GROUPS = 4;
    const pairDuration = 1.3; // must match CSS animation-duration

    // Four base positions across the bottom (vw)
    const basePositions = [12, 34, 56, 78];

    for (let i = 0; i < GROUPS; i++) {
      // Slight jitter so it doesn't look copy-pasted
      const jitter = (Math.random() * 4) - 2; // -2 to +2
      const baseLeft = basePositions[i] + jitter;

      // Base delay so pairs are offset from each other
      const baseDelay = Math.random() * 1.5;

      // 6 and 7: same duration, but 7 is half a cycle out of phase
      createSixSevenNumber(container, '6', baseLeft, 0, baseDelay);
      createSixSevenNumber(container, '7', baseLeft, 3.45, baseDelay + pairDuration / 2);
    }
  }

  // Only add unlockAudio to timer and preset buttons, NOT music-toggle
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('button:not(.music-toggle)').forEach(btn => {
      btn.addEventListener('click', unlockAudio, { once: true });
    });
    initSixSevenPairs();
    updateDisplay();
  });
</script>
</body>
</html>
